secrets:
  - { tag: "Poisoned the Old Lord", more: "Slowly, over a winter, and the physician helped.", ways: ["The old lord's physician", "A bottle in the cellar"], tags: [blood] }
  - { tag: "{rival}'s Money", more: "Every coin it spends came from {rival}.", ways: ["Its account books", "A courier who talks too much"] }
  - { tag: "Letters in {rival}'s Hands", more: "Its founder's letters would hang half the family.", ways: ["A forger who copied them", "The founder's widow"] }
  - { tag: "A Fraud of a Saint", needs: [faith], more: "The saint's bones are a pig's, and the priests know.", ways: ["The saint's grave", "An old monk with a conscience"], tags: [holy] }
  - { tag: "Hiding the Sick", more: "There's plague in its cellars, and it's kept it quiet.", ways: ["Coughing behind a locked door", "A cart that comes at night"], tags: [plague] }
  - { tag: "The Walls Won't Hold", needs: [wall], more: "The mason cut corners, and one good siege would show it.", ways: ["The mason it never paid", "The plans in the archive"], tags: [war] }
  - { tag: "A Bastard Heir", needs: [blood], more: "The heir isn't the lord's son, and the steward knows whose.", ways: ["The midwife", "A ring the mother gave away"], tags: [blood] }
  - { tag: "Paid {rival} to Lose", more: "The last war's great victory was bought and paid for.", ways: ["{rival}'s old captain", "A payment in the old books"], tags: [war] }
  - { tag: "Forged Charter", more: "Its claim to all it holds is a charter it faked.", ways: ["A seal that's the wrong shape", "The scriptorium's old records"], tags: [law] }
  - { tag: "Spies in {rival}'s Kitchen", more: "Its cooks and grooms report on {rival} every week.", ways: ["A new cook who asks questions", "Notes baked into the bread"] }
  - { tag: "Heretics", more: "Its leaders pray to something the church burns people for.", ways: ["A book hidden in a chest", "A meeting in a barn at night"], tags: [holy] }
  - { tag: "Mortgaged to the Rafters", more: "Everything it owns is pledged against a loan.", ways: ["A lender's agent asking questions", "Silver plate sold off quietly"], tags: [debt] }
  - { tag: "Betrayed {rival}'s Founder", more: "It opened the gates the night {rival}'s founder died.", ways: ["{rival}'s oldest servant", "A grave with no name on it"], tags: [blood] }
  - { tag: "Hid {rival}'s Heir", more: "The child everyone thinks drowned is alive, and in its care.", ways: ["A nurse paid to keep quiet", "A child with the family's eyes"] }
  - { tag: "Bought Guards", more: "Its guards would open the doors for the right price.", ways: ["A guard living above his pay", "A door left unbarred one night"] }
  - { tag: "Clipped Coin", more: "Its silver's been shaved for years, and the mint hasn't noticed.", ways: ["Coins that weigh light", "A goldsmith with too much silver"], tags: [wealth] }
  - { tag: "Started {rival}'s Fire", more: "The fire everyone blamed on lightning started with its torch.", ways: ["A boy who saw it", "Lamp oil bought the day before"] }
  - { tag: "Married Twice", more: "Its leader's first wife is alive and living two towns over.", ways: ["A woman who calls herself his widow", "The parish register"], tags: [blood] }
  - { tag: "The Saint Answers", needs: [faith], more: "Its saint's bones really do heal, and it's selling the miracles.", ways: ["A beggar who walked again", "The price list in the sacristy"], rare: true, strange: true, tags: [holy, old] }
  - { tag: "Fed the Hill", more: "Every seventh year someone walks into the hill and stays.", ways: ["Someone missing every seventh year", "The path up the hill nobody uses"], rare: true, strange: true, tags: [old, hill] }
  - { tag: "Never Ages", more: "Its leader hasn't aged a day in forty years.", ways: ["A portrait from forty years back, still a perfect likeness", "Her grandmother's old nurse"], rare: true, strange: true, tags: [old] }

exceptions:
  - { text: "It won't trade on its own river", when: [river, traders], drops: [trade], gives: [plague], reason: "because the last barge brought the plague" }
  - { text: "It won't take a penny in offerings", when: [faith], drops: [belief], gives: [poor], reason: "because its founder swore it to poverty" }
  - { text: "It won't hire a single sword", when: [house, war], drops: [hired-swords], reason: "because sellswords burned its lands once" }
  - { text: "It won't dig, though it sits on the ore", when: [ground], drops: [ground, labour], reason: "because the deep shaft killed forty men" }
  - { text: "It won't hang anyone", when: [office, law], drops: [constables, bailiffs], reason: "because its judge once watched an innocent man hang" }
  - { text: "It won't let family through the door", when: [family], drops: [kin], reason: "because its own cousins tried to murder its founder" }
  - { text: "It won't sell to strangers", when: [traders, market], drops: [passage], gives: [foreign], reason: "because a stranger robbed it blind" }
  - { text: "It won't set foot in its own forest", when: [forest, land], drops: [land], gives: [old], reason: "because of what the woodcutters found out there" }
  - { text: "It won't fight, whatever it costs", when: [soldiers], drops: [hired-swords, standing-army], gives: [debt], reason: "because its captain swore off killing after the last siege" }
  - { text: "It won't keep a secret", when: [society], drops: [sworn-members, safehouses], reason: "because a lie once hanged its founder" }
  - { text: "It won't steal from anyone", when: [crooks], drops: [crime], gives: [law], reason: "because its founder hanged for a loaf of bread" }
  - { text: "It won't call out its own people", when: [house], drops: [household-guard, levies], reason: "because its retainers mutinied in the last war" }
  - { text: "It won't preach to a crowd", when: [faith], drops: [faithful, mob], reason: "because the last crowd it raised burned the town" }
  - { text: "It won't take on a single apprentice", when: [makers], drops: [guild-hands], gives: [old], reason: "because the last one sold the guild's secrets" }

