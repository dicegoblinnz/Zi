# Medieval: the era on its own, and the base of Fantasy and Dark fantasy.
# Names keep the book's own feel (English and northern European roots), and a
# World board mixes in other medieval worlds as well. Strange things here are
# the deniable kind: saints, curses, old graves and things nobody can explain.
fits: [town, city, country, world]

seats:
  # Town: a street, a building or a square.
  - { text: "The Old Bridge", role: passage, tags: [river, road], regions: [town], notice: "The bridge-keeper charges strangers double, and locals whatever he likes." }
  - { text: "Hob's Ford", role: passage, tags: [river], regions: [town], notice: "The ford's shifted since the flood, and a cart's gone under." }
  - { text: "The West Gate", role: passage, tags: [road, wall], regions: [town], notice: "The gate shuts at dusk, and the gatekeeper sells the key." }
  - { text: "The Bell Inn", role: passage, tags: [road], regions: [town], notice: "Every coach changes horses here, and the ostler reads the mail." }
  - { text: "The Quay", role: passage, tags: [river], regions: [town], notice: "Barges three deep at the quay, and nobody's unloading." }
  - { text: "The Common", role: land, tags: [grain], regions: [town], notice: "Geese, washing lines, and a fence someone put up overnight." }
  - { text: "The Mill Meadows", role: land, tags: [river, grain], regions: [town], notice: "Everyone's grain goes through the lord's mill, at the lord's price." }
  - { text: "The Abbey Orchards", role: land, tags: [holy], regions: [town], notice: "The monks count the apples, and they're always a few short." }
  - { text: "The Hop Gardens", role: land, regions: [town], notice: "The brewers guard the hop poles like a castle wall." }
  - { text: "The Lord's Strips", role: land, tags: [crown, grain], regions: [town], notice: "Tenants working the lord's strips while their own crops rot." }
  - { text: "The Clay Pits", role: ground, tags: [poor], regions: [town], notice: "Brickmakers up to their knees, and one pit roped off." }
  - { text: "Ravel Quarry", role: ground, tags: [hill, mine, stone], regions: [town], notice: "The stone's good, and the quarrymen won't cut the east face." }
  - { text: "The Salt Pans", role: ground, tags: [coast], regions: [town], notice: "Women raking salt, and a man counting every bucket." }
  - { text: "The Peat Cuttings", role: ground, tags: [marsh], regions: [town], notice: "Peat stacked to dry, and old bones turned up with it." }
  - { text: "The Lime Kilns", role: ground, tags: [hill, stone], regions: [town, city], notice: "White dust on everything, and men who cough all night." }
  - { text: "The Tanneries", role: craft, tags: [river, poor], regions: [town], notice: "The tanners dump in the river, and the dyers downstream are furious." }
  - { text: "Smithy Row", role: craft, tags: [metal], regions: [town], notice: "Hammers from dawn, and a smith who'll make anything for silver." }
  - { text: "The Dye Works", role: craft, tags: [river, cloth], regions: [town], notice: "The river runs blue one week and red the next." }
  - { text: "The Bell Foundry", role: craft, tags: [metal], regions: [town], notice: "They're casting a bell for the abbey, and it's cracked twice." }
  - { text: "The Fulling Mill", role: craft, tags: [river, guild, cloth], regions: [town], notice: "Hammers pounding cloth till midnight, and the guild wants it shut." }
  - { text: "The Market Cross", role: trade, tags: [market], regions: [town], notice: "Deals get sworn on the cross, and plenty get broken." }
  - { text: "The Wool Hall", role: trade, tags: [market, wealth, cloth], regions: [town], notice: "Sacks to the rafters, and buyers from overseas wanting more." }
  - { text: "The Fair Field", role: trade, tags: [market, foreign], regions: [town], notice: "Empty all year, then full of strangers for one week." }
  - { text: "The Shambles", role: trade, tags: [market, poor], regions: [town], notice: "Butchers' blood in the gutters, and a fight over every carcass." }
  - { text: "The Fish Steps", role: trade, tags: [river], regions: [town], notice: "The fishwives know every boat's catch before it lands." }
  - { text: "Saint Ancel's", role: belief, tags: [holy], regions: [town], notice: "Bells, and a queue of the sick outside the door." }
  - { text: "The Friary", role: belief, tags: [holy, poor], regions: [town], notice: "The friars feed anyone, and ask a lot of questions." }
  - { text: "The Holy Well", role: belief, tags: [holy, old], regions: [town], notice: "Rags tied to the branches round it, each one a prayer." }
  - { text: "The Chantry", role: belief, tags: [holy, wealth], regions: [town], notice: "Two priests paid to pray for one dead lord, in shifts." }
  - { text: "The Lepers' Chapel", role: belief, tags: [holy, plague], regions: [town], notice: "Outside the walls, with its own bell and its own road." }
  - { text: "The Moot Hall", role: office, tags: [law], regions: [town], notice: "The reeve holds court here, with his brother on the bench." }
  - { text: "The Toll House", role: office, tags: [road, law], regions: [town], notice: "The toll board's been painted over three times this year." }
  - { text: "The Gaol", role: office, tags: [law], regions: [town], notice: "Faces at the bars, calling to anyone who passes." }
  - { text: "The Manor House", role: office, tags: [crown, land], regions: [town], sizes: [city, great], notice: "The steward runs everything, since the lord's never here." }
  - { text: "The Stocks", role: office, tags: [law, poor], regions: [town], notice: "Someone's always in the stocks, and nobody says what for." }
  - { text: "The Abbey Library", role: knowledge, tags: [holy, old], regions: [town], notice: "Monks copying by candlelight, and one book chained shut." }
  - { text: "The Schoolhouse", role: knowledge, regions: [town], notice: "Boys chanting their lessons to a master who knows all their fathers." }
  - { text: "The Apothecary", role: knowledge, regions: [town], notice: "Jars of everything, and a back room for the rest." }
  - { text: "The Scrivener's", role: knowledge, tags: [law], regions: [town], notice: "He writes letters for anyone who pays, and reads them first." }
  - { text: "The Barber-Surgeon's", role: knowledge, tags: [plague], regions: [town], notice: "A striped pole, a bucket of blood and a long queue." }
  - { text: "The Hiring Fair", role: labour, tags: [poor], regions: [town], notice: "Workers by the cross holding the tools of their trade." }
  - { text: "The Wharf", role: labour, tags: [river], regions: [town], notice: "Porters by the crane, waiting on a boat that's late." }
  - { text: "The Carters' Yard", role: labour, tags: [road], regions: [town], notice: "Carts, horses and men who'll haul anything for a price." }
  - { text: "Weavers' Lane", role: labour, tags: [poor, cloth], regions: [town], notice: "A loom in every cottage, and children winding thread." }
  - { text: "The Bargemen's Yard", role: labour, tags: [river], regions: [town], notice: "Bargemen mending rope and waiting for the river to rise." }
  - { text: "The Rookery", role: crime, tags: [poor], regions: [town], notice: "Every window's watching you, and someone's already gone for help." }
  - { text: "The Cellars", role: crime, tags: [secret], regions: [town], notice: "Tunnels under the inns that the landlords swear aren't there." }
  - { text: "The Dice House", role: crime, tags: [poor], regions: [town], sizes: [small, local], notice: "Dice, cheap ale and a man at the door checking hands." }
  - { text: "The Smugglers' Steps", role: crime, tags: [river, secret], regions: [town], notice: "Steps down to the water, worn smooth by night work." }
  - { text: "The Hanged Man", role: crime, tags: [poor], regions: [town], notice: "The worst ale in town, and the best stolen goods." }
  - { text: "The Standing Stone", role: wonder, tags: [old], regions: [town], notice: "Nobody ploughs within a stone's throw of it, even for money." }
  - { text: "The Barrow", role: wonder, tags: [old], regions: [town], notice: "An old king's grave, with fresh flowers on it every morning." }
  - { text: "The Weeping Stone", role: wonder, tags: [old], regions: [town], rare: true, strange: true, notice: "It's wet even in a drought." }
  - { text: "The Hanging Oak", role: wonder, tags: [old], regions: [town], notice: "The hanged are buried under it, and it grows like nothing else." }
  - { text: "The Saint's Shrine", role: wonder, tags: [holy, old], regions: [town], notice: "A finger bone in gold, and pilgrims paying to touch it." }
  - { text: "The Drowned Chapel", role: wonder, tags: [old, marsh], regions: [town], rare: true, strange: true, notice: "Its bell rings under the mere on still nights." }

  # City: a district, a gate or a hall.
  - { text: "The North Gate", role: passage, tags: [road, wall], regions: [city], notice: "Carts from the north pay the gate, and then the gate-captain." }
  - { text: "The Great Bridge", role: passage, tags: [river], regions: [city], notice: "Houses and shops built all along it, leaning out above the river." }
  - { text: "The Harbour Mouth", role: passage, tags: [coast], regions: [city], notice: "A chain across the water, raised every sunset." }
  - { text: "The Watergate", role: passage, tags: [river, secret], regions: [city], notice: "Boats unload straight into the warehouses, with no toll-man in sight." }
  - { text: "The Ferry Stairs", role: passage, tags: [river, poor], regions: [city], notice: "Watermen shouting fares and fighting over passengers." }
  - { text: "The Liberties", role: land, tags: [holy, law], regions: [city], notice: "Fields inside the walls that belong to the bishop, not the city." }
  - { text: "The Water Meadows", role: land, tags: [river, grain], regions: [city], notice: "The city's cattle on the flood plain, and a lawsuit per fence." }
  - { text: "The Market Gardens", role: land, tags: [grain, poor], regions: [city], notice: "Cabbages right up to the walls, grown on the city's night soil." }
  - { text: "The Vineyards", role: land, tags: [hill, wealth], regions: [city], notice: "Vines on the slope, and a press house built like a fort." }
  - { text: "The Deer Park", role: land, tags: [crown, forest], regions: [city], notice: "The king's deer behind a city wall, and a rope for poachers." }
  - { text: "The Old Quarries", role: ground, tags: [mine, poor, stone], regions: [city], notice: "Caves where the city's stone was cut, and people living in them." }
  - { text: "The Brickfields", role: ground, tags: [poor, stone], regions: [city], notice: "Kiln smoke all day, and shanties round the kilns." }
  - { text: "The Saltworks", role: ground, tags: [coast], regions: [city], notice: "Brine boiling in great pans, and a tax man at the gate." }
  - { text: "The Gravel Pits", role: ground, tags: [river], regions: [city], notice: "Gravel dug from the old river bed, and it's turning up coins." }
  - { text: "The Street of Smiths", role: craft, tags: [guild, metal], regions: [city], notice: "Every kind of blade, and a guild man checking each one." }
  - { text: "The Glassblowers' Yard", role: craft, tags: [wealth], regions: [city], notice: "Furnaces roaring, and windows for every church in the land." }
  - { text: "The Cloth Halls", role: craft, tags: [guild, market, cloth], regions: [city], notice: "Bolts stamped with the guild's seal, and fakes sold in the alley." }
  - { text: "The Shipyards", role: craft, tags: [coast], regions: [city], notice: "A half-built warship nobody's paid for." }
  - { text: "Goldsmiths' Row", role: craft, tags: [wealth, metal], regions: [city], notice: "Every shop's got a guard, and the guards are armed." }
  - { text: "The Exchange", role: trade, tags: [wealth, market], regions: [city], notice: "Gold changing hands without a word said." }
  - { text: "The Grand Market", role: trade, tags: [market, foreign], regions: [city], notice: "Every tongue spoken, and every price a lie." }
  - { text: "The Warehouses", role: trade, tags: [river, secret], regions: [city], notice: "Locked, guarded and full of things that aren't on the papers." }
  - { text: "The Spice Wharf", role: trade, tags: [coast, wealth, foreign], regions: [city], notice: "Foreign sailors, foreign ships and a smell you won't forget." }
  - { text: "The Merchants' Hall", role: trade, tags: [guild, wealth], regions: [city], notice: "Portraits of dead merchants, and live ones plotting under them." }
  - { text: "The Cathedral", role: belief, tags: [holy, wealth], regions: [city], sizes: [city, great], notice: "Scaffolding on the tower that's been there for fifty years." }
  - { text: "The Cathedral Close", role: belief, tags: [holy, law], regions: [city], notice: "Its own walls, its own gates and its own law." }
  - { text: "The Friars' Quarter", role: belief, tags: [holy, poor], regions: [city], notice: "Preachers in every square, each saying something different." }
  - { text: "Saint Corrow's Hospital", role: belief, tags: [holy, plague], regions: [city], notice: "Three to a bed, and nuns who never seem to sleep." }
  - { text: "The Hand Shrine", role: belief, tags: [holy, old], regions: [city], notice: "Pilgrims come from all over to kiss a saint's hand." }
  - { text: "The Guildhall", role: office, tags: [guild, law], regions: [city], notice: "Every guild's banner on the walls, and every guild's grudge under them." }
  - { text: "The Castle", role: office, tags: [crown, wall, war], regions: [city], sizes: [city, great], notice: "The king's banner on the keep, and a bored garrison." }
  - { text: "The Mint", role: office, tags: [crown, wealth, metal], regions: [city], notice: "Coins struck behind three doors, and counted twice." }
  - { text: "The Assize Hall", role: office, tags: [law], regions: [city], notice: "Hangings every quarter-day, and crowds who come for them." }
  - { text: "The Customs House", role: office, tags: [coast, law], regions: [city], notice: "Clerks weighing every bale, and taking a cut of each." }
  - { text: "The Colleges", role: knowledge, tags: [old], regions: [city], notice: "Students brawling in the street, and masters looking the other way." }
  - { text: "The Chained Library", role: knowledge, tags: [holy, old], regions: [city], notice: "Books chained to the desks, and a librarian who reads everything." }
  - { text: "The Physicians' Hall", role: knowledge, tags: [plague], regions: [city], notice: "Doctors in long robes, arguing over a dead man." }
  - { text: "The Map Shop", role: knowledge, tags: [coast, foreign], regions: [city], notice: "Maps of places nobody's been, sold to people who'll go." }
  - { text: "The Muniment Tower", role: knowledge, tags: [law, old], regions: [city], notice: "The city's deeds, and a clerk who'll change one for silver." }
  - { text: "The Docks", role: labour, tags: [coast, poor], regions: [city], notice: "Hundreds of hands, and a gang-master for every twenty." }
  - { text: "The Hiring Stairs", role: labour, tags: [river, poor], regions: [city], notice: "Porters on every step, and a fight whenever a boat docks." }
  - { text: "The Weavers' Quarter", role: labour, tags: [poor, guild, cloth], regions: [city], notice: "Looms clattering in every attic, and the guild's men counting them." }
  - { text: "The Ropewalk", role: labour, tags: [coast], regions: [city], notice: "Men walking backwards all day, spinning rope a quarter-mile long." }
  - { text: "The Labourers' Square", role: labour, tags: [poor], regions: [city], notice: "A square full of people with nothing to sell but their hands." }
  - { text: "The Old Cellars", role: crime, tags: [secret], regions: [city], notice: "Cellars under the old town that join up, and nobody admits it." }
  - { text: "The Thieves' Market", role: crime, tags: [market], regions: [city], notice: "Everything's for sale, and nothing's got a past." }
  - { text: "The Sanctuary Yard", role: crime, tags: [holy, law], regions: [city], notice: "Debtors and thieves living in the church's yard, safe from the law." }
  - { text: "The Hangman's Field", role: crime, tags: [law, poor], regions: [city], notice: "Hanging days pull a crowd, and the cutpurses work it." }
  - { text: "The Far Bank", role: crime, tags: [river, poor], regions: [city], notice: "Bear-pits, dice dens and a ferryman who doesn't ask names." }
  - { text: "The Old Tower", role: wonder, tags: [old], regions: [city], rare: true, strange: true, notice: "Nobody goes up it, and there's a light up there at night." }
  - { text: "The Buried Town", role: wonder, tags: [old], regions: [city], notice: "Older stones under the new, carved with words nobody can read." }
  - { text: "The Plague Pit", role: wonder, tags: [plague, old], regions: [city], notice: "A field nobody builds on, or crosses after dark." }
  - { text: "The Weeping Saint", role: wonder, tags: [holy, old], regions: [city], rare: true, strange: true, notice: "A saint's statue that weeps on feast days, for a fee." }
  - { text: "The Bricked-Up Crypt", role: wonder, tags: [old], regions: [city], rare: true, strange: true, notice: "Under the cathedral, walled up the year of the great plague." }

  # Country: a town, a pass, a forest or a fortress.
  - { text: "Crowford", role: passage, tags: [river, road], regions: [country], notice: "The only bridge for forty miles, and the toll's gone up again." }
  - { text: "The High Pass", role: passage, tags: [hill, road], regions: [country], notice: "Snow half the year, and a toll-tower the other half." }
  - { text: "The Crown Road", role: passage, tags: [road, crown], regions: [country], notice: "Wide enough for an army, with holes the crown won't fill." }
  - { text: "The Estuary", role: passage, tags: [coast, river], regions: [country], notice: "Ships heading inland pay the pilots to get past the sandbank." }
  - { text: "Saltmarsh Causeway", role: passage, tags: [marsh, road], regions: [country], notice: "One stone road across the marsh, and it floods at spring tides." }
  - { text: "The Vale", role: land, tags: [grain], regions: [country], notice: "The best farmland in the country, and three lords claim it." }
  - { text: "The Downs", role: land, tags: [hill, cloth], regions: [country], notice: "Sheep on every hill, and the wool's worth more than the land." }
  - { text: "The Great Forest", role: land, tags: [forest, crown], regions: [country], notice: "The king's forest, where a poached deer gets you hanged." }
  - { text: "The Eel Marshes", role: land, tags: [marsh], regions: [country], notice: "Eels, reeds and people who don't trust anyone from upriver." }
  - { text: "The Abbey Lands", role: land, tags: [holy, grain], regions: [country], notice: "Every third field belongs to the abbey, and the abbot knows which." }
  - { text: "The Lead Mines", role: ground, tags: [hill, mine, metal], regions: [country], notice: "Miners who answer to their own court and nobody else." }
  - { text: "The Silver Hills", role: ground, tags: [hill, mine, wealth, metal], regions: [country], notice: "A silver strike last year, and the camp's tripled since." }
  - { text: "The Saltings", role: ground, tags: [coast], regions: [country], notice: "Salt pans along the whole coast, and a tax on every sack." }
  - { text: "The Iron Valley", role: ground, tags: [mine, forest, metal], regions: [country], notice: "Charcoal smoke in the woods, and furnaces glowing at night." }
  - { text: "Hardscar Quarry", role: ground, tags: [hill, stone], regions: [country], notice: "Every castle in the country is built from its stone." }
  - { text: "The Weaving Villages", role: craft, tags: [guild, poor, cloth], regions: [country], notice: "Every village spins and weaves, and one family buys it all." }
  - { text: "Hammerford", role: craft, tags: [mine, metal], regions: [country], notice: "The best swords in the country, and a forge in every yard." }
  - { text: "The Mill River", role: craft, tags: [river], regions: [country], notice: "Twenty mills on one river, and they fight over the water." }
  - { text: "The Potteries", role: craft, regions: [country], notice: "Kilns smoking on the skyline, and clay in every gutter." }
  - { text: "The Glass Woods", role: craft, tags: [forest, wealth], regions: [country], notice: "Glassblowers in the forest who aren't allowed to leave." }
  - { text: "The Great Fair", role: trade, tags: [market, foreign], regions: [country], notice: "Merchants from everywhere each summer, and a court for their quarrels." }
  - { text: "The Market Town", role: trade, tags: [market, road], regions: [country], notice: "Every road meets here, and the market's on four days a week." }
  - { text: "The Port", role: trade, tags: [coast, market], regions: [country], notice: "Ships from abroad, and customs men who don't ask much." }
  - { text: "The Wool Staple", role: trade, tags: [market, wealth, cloth], regions: [country], notice: "Every sack of wool bound abroad goes through here first." }
  - { text: "The River Towns", role: trade, tags: [river, market], regions: [country], notice: "A string of towns along the river, each with its own toll." }
  - { text: "The Great Abbey", role: belief, tags: [holy, wealth], regions: [country], sizes: [city, great], notice: "Richer than any lord, and the abbot rides with an armed escort." }
  - { text: "The Pilgrim Road", role: belief, tags: [holy, road], regions: [country], notice: "Shrines all the way, each selling a bit of the saint." }
  - { text: "The Hermitage", role: belief, tags: [holy, wild], regions: [country], notice: "A holy man on a rock, and pilgrims camped at the bottom." }
  - { text: "The Bishop's Town", role: belief, tags: [holy, law], regions: [country], notice: "The bishop owns the town, and the town's never forgiven him." }
  - { text: "The Monks' Isle", role: belief, tags: [holy, coast], regions: [country], notice: "Cut off at high tide, and the monks like it that way." }
  - { text: "Raventor Castle", role: office, tags: [crown, wall, war], regions: [country], sizes: [city, great], notice: "The court moves here in summer, and the town fills with liars." }
  - { text: "The County Town", role: office, tags: [law], regions: [country], notice: "The sheriff's seat, with the assizes twice a year." }
  - { text: "The Border March", role: office, tags: [war, wall], regions: [country], notice: "Castles every ten miles, and lords who don't take orders." }
  - { text: "The Verderers' Hall", role: office, tags: [forest, law], regions: [country], notice: "Poachers hang here under the forest's law, not the king's." }
  - { text: "The Bishop's Palace", role: office, tags: [holy, law, wealth], regions: [country], notice: "The bishop's court hangs more men than the king's." }
  - { text: "The University Town", role: knowledge, tags: [old], regions: [country], notice: "More students than townsfolk, and a riot every market day." }
  - { text: "The Old Abbey", role: knowledge, tags: [holy, old], regions: [country], notice: "The oldest books in the country, guarded by three old monks." }
  - { text: "The Watchers' Tower", role: knowledge, tags: [old], regions: [country], notice: "An old man up there charts the stars, and won't say why." }
  - { text: "The Heralds' College", role: knowledge, tags: [crown, blood], regions: [country], notice: "Every family tree's kept here, and some get pruned." }
  - { text: "Mendwater", role: knowledge, tags: [plague], regions: [country], notice: "Every healer in the country trained here, and some never left." }
  - { text: "The Mining Camps", role: labour, tags: [mine, poor], regions: [country], notice: "Thousands of hands, and a foreman who decides who eats." }
  - { text: "The Harvest Roads", role: labour, tags: [grain, poor], regions: [country], notice: "Gangs of reapers walking farm to farm, hired by the day." }
  - { text: "The Shipyard Town", role: labour, tags: [coast], regions: [country], notice: "Every man and boy works the yards, or wants to." }
  - { text: "The Charcoal Woods", role: labour, tags: [forest, poor], regions: [country], notice: "Burners living rough in the woods, under a hundred plumes of smoke." }
  - { text: "The Drove Road", role: labour, tags: [road], regions: [country], notice: "Drovers walking herds south every autumn, and they know every pass." }
  - { text: "The Outlaw Wood", role: crime, tags: [forest, wild], regions: [country], notice: "Travellers go through in groups, and still lose their purses." }
  - { text: "The Smugglers' Coast", role: crime, tags: [coast, secret], regions: [country], notice: "Coves and caves, and lights on the cliffs on moonless nights." }
  - { text: "The Debatable Land", role: crime, tags: [war, wild], regions: [country], notice: "Nobody's sure whose land it is, so no law runs there." }
  - { text: "The Marsh Villages", role: crime, tags: [marsh, secret], regions: [country], notice: "Tax men don't go in, since the last one never came out." }
  - { text: "Blackmere Keep", role: crime, tags: [wall, war], regions: [country], notice: "A lord who takes a toll on everything, with crossbows." }
  - { text: "The Giants' Ring", role: wonder, tags: [old], regions: [country], notice: "Stones taller than houses, and a fair there every midsummer." }
  - { text: "The Kings' Mounds", role: wonder, tags: [old], regions: [country], notice: "Mounds on the ridge, and treasure-hunters with spades every spring." }
  - { text: "The Drowned Valley", role: wonder, tags: [old, marsh], regions: [country], rare: true, strange: true, notice: "A church spire sticks up out of the lake." }
  - { text: "The Burning Hill", role: wonder, tags: [old, mine], regions: [country], notice: "The hill's smouldered since before anyone's grandmother was born." }
  - { text: "The Healing Springs", role: wonder, tags: [holy, old], regions: [country], notice: "Hot water from the rock, and plenty swear it cured them." }
  - { text: "The Empty Abbey", role: wonder, tags: [old, holy], regions: [country], rare: true, strange: true, notice: "Left overnight a hundred years ago, with bread still on the tables." }

  # World: a country, a sea or a mountain range.
  - { text: "The Straits", role: passage, tags: [coast], regions: [world], notice: "Every ship between the two seas sails within bowshot of the forts." }
  - { text: "The Spice Road", role: passage, tags: [road, foreign], regions: [world], notice: "Caravans across the desert, and a well every three days." }
  - { text: "The Great Pass", role: passage, tags: [hill, road], regions: [world], notice: "The only way through the mountains, and fifty can hold it." }
  - { text: "The River Mouths", role: passage, tags: [river, coast], regions: [world], notice: "The great river meets the sea through a hundred channels." }
  - { text: "The Salt Road", role: passage, tags: [road, foreign], regions: [world], notice: "Salt going south by caravan, and gold coming back north." }
  - { text: "The Breadbasket", role: land, tags: [grain], regions: [world], notice: "Wheat to the horizon, and every famine elsewhere makes it richer." }
  - { text: "The Horse Plains", role: land, tags: [wild], regions: [world], notice: "Grass from one sea to the other, and riders who own it." }
  - { text: "The Vine Coast", role: land, tags: [coast, wealth], regions: [world], notice: "Wine for every king's table, and pirates who know it." }
  - { text: "The Terraces", role: land, tags: [hill, grain], regions: [world], notice: "Fields cut into every hillside, built by hand over a thousand years." }
  - { text: "The Northern Forests", role: land, tags: [forest, wild], regions: [world], notice: "Furs, timber and tribes who were there first." }
  - { text: "The Silver Mountains", role: ground, tags: [hill, mine, wealth, metal], regions: [world], notice: "Mines that pay for three kingdoms' wars." }
  - { text: "The Salt Flats", role: ground, tags: [wild], regions: [world], notice: "Salt cut in slabs from a dry lake, carried off by camel." }
  - { text: "The Tin Isles", role: ground, tags: [coast, mine, metal], regions: [world], notice: "Tin for every pewter cup in the world starts here." }
  - { text: "The Iron Hills", role: ground, tags: [hill, mine, war, metal], regions: [world], notice: "Iron for every army, sold to whoever pays first." }
  - { text: "The Gold Rivers", role: ground, tags: [river, mine, wealth, metal], regions: [world], notice: "Gold dust in the rivers, and a king who claims every grain." }
  - { text: "The Weaving Cities", role: craft, tags: [guild, wealth, cloth], regions: [world], notice: "Cloth so fine it's sold by its weight in silver." }
  - { text: "The Glass Isles", role: craft, tags: [coast, wealth], regions: [world], notice: "Glassmakers forbidden to leave, on pain of death." }
  - { text: "The Forge Valleys", role: craft, tags: [mine, metal], regions: [world], notice: "Blades that bend and don't break, and smiths who won't say how." }
  - { text: "The Shipwright Coast", role: craft, tags: [coast, forest], regions: [world], notice: "The best ships in the world, built from forests nearly gone." }
  - { text: "The Paper Cities", role: craft, tags: [foreign], regions: [world], notice: "Paper by the cartload, cheaper than any monk's vellum." }
  - { text: "The Free Ports", role: trade, tags: [coast, market, foreign], regions: [world], notice: "No king, no tax and no questions asked." }
  - { text: "The Market League", role: trade, tags: [market, wealth], regions: [world], notice: "Cities that buy and sell kingdoms, and keep the receipts." }
  - { text: "The Pepper Isles", role: trade, tags: [coast, foreign, wealth], regions: [world], notice: "Pepper worth its weight in gold, and fleets fighting over it." }
  - { text: "The Fur Markets", role: trade, tags: [forest, market], regions: [world], notice: "Pelts from the frozen north, and traders who'll freeze to get them." }
  - { text: "The Caravan Cities", role: trade, tags: [road, market, foreign], regions: [world], notice: "Every caravan ends here, and most got robbed on the way." }
  - { text: "The Holy City", role: belief, tags: [holy], regions: [world], notice: "Three faiths claim it, and each one's got an army." }
  - { text: "The Mountain Monasteries", role: belief, tags: [holy, hill], regions: [world], notice: "Monks who've prayed on the peaks since before the kingdoms." }
  - { text: "The Long Pilgrimage", role: belief, tags: [holy, road], regions: [world], notice: "A road across three kingdoms, walked by thousands every year." }
  - { text: "The Burning Temple", role: belief, tags: [holy, old], regions: [world], notice: "A fire that's never gone out, and war if it ever does." }
  - { text: "The Patriarch's City", role: belief, tags: [holy, wealth, crown], regions: [world], notice: "The head of the faith lives here, and crowns are made here." }
  - { text: "The Old Capital", role: office, tags: [crown, old], regions: [world], sizes: [city, great], notice: "The empire's capital, though the empire's half gone." }
  - { text: "The Throne City", role: office, tags: [crown, wealth], regions: [world], notice: "Ten thousand clerks, and one man who signs." }
  - { text: "The Lawgivers' City", role: office, tags: [law], regions: [world], notice: "Every king's laws get written here, and every king pays for it." }
  - { text: "The Tribute City", role: office, tags: [crown, war], regions: [world], notice: "Every province sends its tribute here, under guard." }
  - { text: "The Imperial March", role: office, tags: [war, wall], regions: [world], notice: "Forts along the border, manned by soldiers from everywhere." }
  - { text: "The Library City", role: knowledge, tags: [old], regions: [world], notice: "The biggest library in the world, and a fire every fifty years." }
  - { text: "The Star-Watchers' Tower", role: knowledge, tags: [old], regions: [world], notice: "They'll tell you the next eclipse to the hour." }
  - { text: "The University Cities", role: knowledge, regions: [world], notice: "Students from every kingdom, and spies among them." }
  - { text: "The Chart-Makers' Port", role: knowledge, tags: [coast, foreign], regions: [world], notice: "Charts of every coast, sold by men who've never sailed." }
  - { text: "The Translators' City", role: knowledge, tags: [foreign, old], regions: [world], notice: "Every old book in every tongue, being copied into new ones." }
  - { text: "The Teeming Delta", role: labour, tags: [river, poor], regions: [world], notice: "More people than anywhere, and all of them need work." }
  - { text: "The Galley Ports", role: labour, tags: [coast, war], regions: [world], notice: "Rowers on the benches, some free and some in chains." }
  - { text: "The Mill Cities", role: labour, tags: [river, guild], regions: [world], notice: "Water wheels by the hundred, and workers who strike every winter." }
  - { text: "The Mercenary Coast", role: labour, tags: [war], regions: [world], notice: "Soldiers from every land in the taverns, waiting for a war." }
  - { text: "The Hiring Isles", role: labour, tags: [coast, poor], regions: [world], notice: "Sailors from everywhere, waiting for a ship that'll take them." }
  - { text: "The Pirate Isles", role: crime, tags: [coast, secret], regions: [world], notice: "A hundred islands, and every captain's king of his own." }
  - { text: "The Lawless March", role: crime, tags: [wild, war], regions: [world], notice: "Land between empires that both of them swear isn't theirs." }
  - { text: "The Smugglers' Sea", role: crime, tags: [coast, secret], regions: [world], notice: "Fog, shoals and captains who know every cove." }
  - { text: "The Bandit Mountains", role: crime, tags: [hill, wild], regions: [world], notice: "Caravans pay the mountain lords, or don't come out." }
  - { text: "The Black Market City", role: crime, tags: [market, secret], regions: [world], notice: "Anything from anywhere, and the city watch takes a cut." }
  - { text: "The Map's Edge", role: wonder, tags: [old, foreign], regions: [world], rare: true, strange: true, notice: "Ships go past it, and some come back with gold." }
  - { text: "The Dead Kingdom", role: wonder, tags: [old, plague], regions: [world], notice: "Emptied by plague, with the treasure still in it." }
  - { text: "The Burning Mountain", role: wonder, tags: [hill, old], regions: [world], notice: "It smokes every day, and it's due to wake." }
  - { text: "The Sunken Coast", role: wonder, tags: [coast, old], regions: [world], rare: true, strange: true, notice: "A city under the sea, its towers showing at low tide." }
  - { text: "The First Empire's Ruins", role: wonder, tags: [old], regions: [world], notice: "Roads and walls older than anyone's history, and nobody knows whose." }

