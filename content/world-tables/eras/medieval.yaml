  - { text: "A woman nobody remembers being young", role: old, regions: [town, city], sizes: [small], tags: [old], leans: [wonder, informants, belief, sworn-members, kin, thralls, faithful, household-guard], rare: true, strange: true }
  - { text: "A cult that meets in the old barrows", role: old, regions: [town, country], sizes: [small, local], tags: [old, secret], leans: [sworn-members, wonder, belief, kin, thralls, faithful, household-guard], rare: true, strange: true }
  - { text: "The family at the hall, who never seem to die", role: old, regions: [town], sizes: [city, great], tags: [old, blood], leans: [kin, vault, wonder, belief, sworn-members, thralls, faithful, household-guard], rare: true, strange: true }
  - { text: "A family that's held the town since before the church", role: old, regions: [town], sizes: [great], tags: [old, blood], leans: [kin, land, rooted, wonder, belief, sworn-members, thralls, faithful, household-guard] }
  - { text: "A bloodline that marries only its own", role: old, regions: [city, world], sizes: [small, local, city], tags: [old, blood], leans: [kin, vault, wonder, belief, sworn-members, thralls, faithful, household-guard] }
  - { text: "An order that says it's older than the crown", role: old, regions: [city, country, world], sizes: [local, city, great], tags: [old, secret], leans: [sworn-members, relic, wonder, belief, kin, thralls, faithful, household-guard] }
  - { text: "The old families who ruled before the charter", role: old, regions: [city], sizes: [great], tags: [old, blood, law], leans: [kin, rooted, influential, wonder, belief, sworn-members, thralls, faithful, household-guard] }
  - { text: "The guardians of a tomb nobody's allowed to open", role: old, regions: [country, world], sizes: [small, local], tags: [old, holy], leans: [wonder, relic, belief, sworn-members, kin, thralls, faithful, household-guard] }
  - { text: "The heirs of the kings before the kings", role: old, regions: [country, world], sizes: [city, great], tags: [old, blood, law], leans: [kin, relic, influential, wonder, belief, sworn-members, thralls, faithful, household-guard] }
  - { text: "Whatever's left of the old empire", role: old, regions: [world], sizes: [city, great], tags: [old, ruin], leans: [relic, fortress, wonder, belief, sworn-members, kin, thralls, faithful, household-guard] }

