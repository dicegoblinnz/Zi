# The Medieval era (stage 3 of notes/builder-plan.md): castles, abbeys,
# guilds, mills and the king's road, with names in the book's own feel.
# Medieval on its own has no magic. Its strange things are what people of
# the age believed or feared, and every one could have a worldly answer.
# Fantasy is this pack with the Magic twist on top.
fits: [town, city, country, world]

seats:
  # Town: a street, a mill, a bridge or the square.
  - { text: "The Old Bridge", role: passage, tags: [river, road], regions: [town], sizes: [local, city], notice: "Houses lean over the water, and one's stood empty since the drowning." }
  - { text: "Ferry Steps", role: passage, tags: [river], regions: [town], sizes: [small], notice: "The ferryman takes coin both ways and remembers every face." }
  - { text: "The North Gate", role: passage, tags: [road], regions: [town], notice: "Carts queue while the gatekeeper counts their sacks twice." }
  - { text: "The Wayside Inn", role: passage, tags: [road], regions: [town], sizes: [small, local], notice: "Every traveller stops here, and the landlady writes down their names." }
  - { text: "Toll Lane", role: passage, tags: [road], regions: [town], sizes: [small], notice: "A chain across the lane, and the toll's gone up again." }
  - { text: "The Common", role: land, tags: [poor], regions: [town], notice: "Geese, washing lines, and a gallows at the far end." }
  - { text: "The Long Acre", role: land, tags: [hunger], regions: [town], notice: "Barley in strips, and every strip's fought over at the manor court." }
  - { text: "The Abbey Fields", role: land, tags: [holy], regions: [town], notice: "Lay brothers hoe in silence, and the abbot's moved the boundary." }
  - { text: "The Water Meadows", role: land, tags: [river], regions: [town], notice: "The best grass for miles, and three families claim the grazing." }
  - { text: "Thornhill Farm", role: land, regions: [town], sizes: [small], notice: "A farmer who owns the hill and won't sell it to anyone." }
  - { text: "The Clay Pits", role: ground, regions: [town], notice: "Brickmakers up to their knees, and one pit nobody will dig." }
  - { text: "The Quarry", role: ground, tags: [mountain], regions: [town], notice: "Stonecutters, dust, and a crack in the face that's getting wider." }
  - { text: "The Saltings", role: ground, tags: [coast], regions: [town], notice: "Shallow pans by the sea, raked by women who won't talk." }
  - { text: "The Peat Cuttings", role: ground, tags: [marsh], regions: [town], notice: "Turf drying in stacks, and they dug a body out last spring." }
  - { text: "The Lead Mine", role: ground, tags: [mountain], regions: [town], notice: "One family's worked it a hundred years, and they're all coughing." }
  - { text: "The Mill", role: craft, tags: [river], regions: [town], sizes: [local], notice: "The wheel turns day and night, and the miller takes his cut." }
  - { text: "Tanners' Row", role: craft, tags: [poor, river], regions: [town], notice: "The stink carries two streets, and the tanners like it that way." }
  - { text: "The Smithy", role: craft, tags: [war], regions: [town], notice: "Hammers before dawn, and lately it's making blades, not ploughshares." }
  - { text: "The Dye Works", role: craft, tags: [river], regions: [town], notice: "The stream runs blue on one side and red on the other." }
  - { text: "The Brewhouse", role: craft, regions: [town], notice: "The whole town drinks what's brewed here, and owes for it." }
  - { text: "The Market Cross", role: trade, tags: [market], regions: [town], sizes: [local, city], notice: "Stalls packed round the cross, and a bailiff weighing the bread." }
  - { text: "The Wool Hall", role: trade, tags: [market, wealth], regions: [town], sizes: [city, great], notice: "Bales to the rafters, and buyers who pay in foreign coin." }
  - { text: "The Fair Field", role: trade, tags: [market], regions: [town], notice: "Empty most of the year, then three days of madness." }
  - { text: "The Fish Quay", role: trade, tags: [coast, market], regions: [town], notice: "Gulls, gutting knives, and a price war nobody's winning." }
  - { text: "Pedlars' Corner", role: trade, tags: [road, market], regions: [town], sizes: [small], notice: "Pedlars from everywhere, and one selling things that aren't his." }
  - { text: "The Parish Church", role: belief, tags: [holy], regions: [town], sizes: [local, city], notice: "The only stone building in town, and its bell rules the day." }
  - { text: "The Tithe Barn", role: belief, tags: [holy, wealth], regions: [town], notice: "Bigger than the church, and full of a tenth of everything." }
  - { text: "The Holy Well", role: belief, tags: [holy, old], regions: [town], notice: "Rags tied on every branch, and a queue of the sick." }
  - { text: "The Hermit's Cell", role: belief, tags: [holy], regions: [town], sizes: [small], notice: "A cave in the hillside, and a man silent for years." }
  - { text: "The Chantry", role: belief, tags: [holy, wealth], regions: [town], sizes: [small], notice: "A priest paid to pray for one dead lord, day and night." }
  - { text: "The Moot Hall", role: office, tags: [law], regions: [town], sizes: [local, city], notice: "The manor court sits here, and fines are paid at the door." }
  - { text: "The Manor House", role: office, tags: [law, wealth], regions: [town], sizes: [city, great], notice: "The steward watches the road from the window and writes things down." }
  - { text: "The Lock-Up", role: office, tags: [law], regions: [town], sizes: [small], notice: "One cell, one door, and there's always someone in it." }
  - { text: "The Reeve's House", role: office, tags: [law], regions: [town], notice: "The reeve's ledger has every family's dues in it, and some extra." }
  - { text: "The Stocks", role: office, tags: [law], regions: [town], sizes: [small], notice: "Somebody's in them every market day, and today it's the miller's son." }
  - { text: "The Priest's House", role: knowledge, tags: [holy], regions: [town], notice: "The only books in town, and he reads letters for a penny." }
  - { text: "The Schoolroom", role: knowledge, regions: [town], sizes: [small], notice: "A dozen boys, one master, and lessons chanted through the window." }
  - { text: "The Apothecary", role: knowledge, tags: [plague], regions: [town], notice: "Jars of everything, and a man who knows what's wrong with you." }
  - { text: "The Midwife's Cottage", role: knowledge, regions: [town], sizes: [small], notice: "She's delivered half the town, and she knows every father's name." }
  - { text: "The Manor Rolls", role: knowledge, tags: [law], regions: [town], notice: "Parchment saying who owns what, and someone's been at it." }
  - { text: "The Hiring Fair", role: labour, tags: [poor], regions: [town], notice: "Once a year everyone wanting work stands here holding their tools." }
  - { text: "The Carters' Yard", role: labour, tags: [road], regions: [town], notice: "Wagons, mules, and men waiting to be told where to go." }
  - { text: "The Wharf", role: labour, tags: [river], regions: [town], notice: "Porters carry sacks off the barges for a penny a load." }
  - { text: "The Charcoal Camp", role: labour, tags: [forest], regions: [town], notice: "Smoke in the woods, and men black to the elbows." }
  - { text: "The Woodyard", role: labour, tags: [forest], regions: [town], notice: "Sawyers, and planks stacked higher than the houses." }
  - { text: "The Back Lanes", role: crime, tags: [poor], regions: [town], sizes: [small, local], notice: "Nobody walks here after dark who doesn't belong." }
  - { text: "The Blind Fiddler", role: crime, tags: [poor], regions: [town], sizes: [small], notice: "Bad ale, and the best place in town to buy something stolen." }
  - { text: "Smugglers' Cove", role: crime, tags: [coast, secret], regions: [town], notice: "A path down the cliff, worn smooth by feet at night." }
  - { text: "The Bakery Cellar", role: crime, tags: [secret], regions: [town], sizes: [small], notice: "Knocks on the cellar door at midnight, and bread nobody eats." }
  - { text: "Gibbet Wood", role: crime, tags: [forest], regions: [town], notice: "Outlaws in the trees, and a gibbet at the edge for them." }
  - { text: "The Standing Stones", role: wonder, tags: [old], regions: [town], notice: "Nine stones in a ring, and nobody ploughs inside it." }
  - { text: "The Old Fort", role: wonder, tags: [old, ruin], regions: [town], notice: "Grass walls on the hill, and old coins turn up after rain." }
  - { text: "The Weeping Rood", role: wonder, tags: [holy], regions: [town], notice: "A cross that weeps in wet weather, and pilgrims pay to see." }
  - { text: "The Barrow", role: wonder, tags: [old], regions: [town], notice: "A grave mound older than the church, and someone's been digging." }
  - { text: "The Drowned Bell", role: wonder, tags: [old, river], regions: [town], rare: true, strange: true, notice: "Fishermen swear it rings under the water before every death." }

  # City: a district, a gate, a dock or a hall.
  - { text: "The River Gate", role: passage, tags: [river, road], regions: [city], notice: "Every barge stops for the chain, and the chain-keeper's open to offers." }
  - { text: "The Harbour Mouth", role: passage, tags: [coast], regions: [city], sizes: [city, great], notice: "Two towers and a chain, and a ship that's waited a week." }
  - { text: "The Great Bridge", role: passage, tags: [river], regions: [city], sizes: [city, great], notice: "Shops all along it, and the rents on them are a fortune." }
  - { text: "The Pilgrims' Gate", role: passage, tags: [road, holy], regions: [city], notice: "Pilgrims in, beggars out, and a gatekeeper who sells badges." }
  - { text: "Watergate Stairs", role: passage, tags: [river], regions: [city], sizes: [small], notice: "Boatmen shouting for fares, and one who'll row anyone anywhere." }
  - { text: "The Liberty Fields", role: land, tags: [poor], regions: [city], notice: "Outside the walls, where the law's thin and the cattle graze." }
  - { text: "The Market Gardens", role: land, regions: [city], notice: "Cabbages down to the river, and every gardener owes the same man." }
  - { text: "The Bishop's Vineyards", role: land, tags: [holy, wealth], regions: [city], notice: "The best wine in the city, and the poor never taste it." }
  - { text: "The Deer Park", role: land, tags: [wealth, forest], regions: [city], notice: "A wall round a forest, and they hang poachers at the gate." }
  - { text: "The Castle Orchards", role: land, regions: [city], sizes: [small], notice: "Apples for the castle, and a gardener who hears everything." }
  - { text: "The Brick Fields", role: ground, regions: [city], notice: "Kilns smoking day and night, and a new wall going up." }
  - { text: "The Lime Kilns", role: ground, regions: [city], notice: "White dust on everything, and men with burnt hands." }
  - { text: "The Chalk Pits", role: ground, tags: [old], regions: [city], notice: "Tunnels under the city, and nobody's mapped them all." }
  - { text: "The Old Silver Workings", role: ground, tags: [old, wealth], regions: [city], rare: true, notice: "Shut a lifetime ago, and somebody's bringing ore out again." }
  - { text: "The Clay Banks", role: ground, tags: [river], regions: [city], notice: "Potters dig the riverbank, and the bank's started to slide." }
  - { text: "Weavers' Street", role: craft, tags: [poor], regions: [city], notice: "Looms clacking in every window, and the weavers are angry about something." }
  - { text: "The Bell Foundry", role: craft, tags: [holy], regions: [city], notice: "A bell for the cathedral half cast, and the founder's gone missing." }
  - { text: "The Shipyard", role: craft, tags: [coast], regions: [city], sizes: [local, city], notice: "A great ship on the stocks, and nobody knows who's paying." }
  - { text: "Goldsmiths' Row", role: craft, tags: [wealth], regions: [city], notice: "Armed guards at every door, and scales that are always right." }
  - { text: "The Glassworks", role: craft, tags: [wealth], regions: [city], notice: "The furnaces never go out, and the glassmakers never leave." }
  - { text: "The Cloth Hall", role: trade, tags: [market, wealth], regions: [city], sizes: [city, great], notice: "Cloth worth a lord's ransom, and a guild that sets the price." }
  - { text: "The Counting House", role: trade, tags: [wealth, debt], regions: [city], notice: "Clerks counting coin, and a ledger with half the city in it." }
  - { text: "The Spice Wharf", role: trade, tags: [coast, stranger], regions: [city], notice: "Foreign sailors, strange smells, and pepper worth more than silver." }
  - { text: "The Fair Ground", role: trade, tags: [market], regions: [city], notice: "Three weeks a year, the whole world comes here to sell." }
  - { text: "The Moneychangers' Bridge", role: trade, tags: [river, wealth], regions: [city], notice: "Every coin in the world changes hands here, and some are fakes." }
  - { text: "The Cathedral", role: belief, tags: [holy, wealth], regions: [city], sizes: [city, great], notice: "Still unfinished after eighty years, and the money keeps vanishing." }
  - { text: "The Bishop's Palace", role: belief, tags: [holy, law], regions: [city], sizes: [city, great], notice: "Finer than the castle, and the bishop wants everyone to know it." }
  - { text: "The Friary", role: belief, tags: [holy, poor], regions: [city], notice: "Friars feed the poor at the gate, and hear everything in return." }
  - { text: "Saint Meriel's", role: belief, tags: [holy], regions: [city], notice: "Pilgrims crawl the last mile on their knees to touch her shrine." }
  - { text: "The Charnel House", role: belief, tags: [holy, plague], regions: [city], notice: "Bones stacked to the roof, and the pile's grown since spring." }
  - { text: "The Anchorhold", role: belief, tags: [holy], regions: [city], sizes: [small], notice: "A woman walled up beside the altar gives advice through a slit." }
  - { text: "The Guildhall", role: office, tags: [law, market], regions: [city], sizes: [city, great], notice: "The guilds make the city's laws here, and break them." }
  - { text: "The Castle", role: office, tags: [war, law], regions: [city], sizes: [city, great], notice: "The king's own garrison, and they never drink in the city." }
  - { text: "The Mint", role: office, tags: [wealth, law], regions: [city], notice: "The city's coin is struck here, and the moneyer's living well." }
  - { text: "The Customs House", role: office, tags: [coast, law], regions: [city], notice: "Every cargo's counted twice and paid for three times." }
  - { text: "The Prison Tower", role: office, tags: [law], regions: [city], notice: "The poor rot in the cellars, and the rich dine upstairs." }
  - { text: "The Cathedral Library", role: knowledge, tags: [holy], regions: [city], notice: "Books chained to the desks, and one chain's been cut." }
  - { text: "The Scriptorium", role: knowledge, tags: [holy], regions: [city], sizes: [small], notice: "Monks copying all day, and one of them's copying something else." }
  - { text: "The Schools", role: knowledge, regions: [city], notice: "Students who brawl and argue, and a riot every feast day." }
  - { text: "The Physicians' Hall", role: knowledge, tags: [plague], regions: [city], notice: "Learned men who disagree about the fever, and charge for it." }
  - { text: "Chartmakers' Lane", role: knowledge, tags: [coast], regions: [city], sizes: [small], notice: "Maps of every coast, and captains who'd kill for the right one." }
  - { text: "The Docks", role: labour, tags: [coast], regions: [city], sizes: [local, city], notice: "Porters, cranes and gangs, and every gang owes somebody." }
  - { text: "The Porters' Hall", role: labour, tags: [river], regions: [city], notice: "Nothing moves in the city without porters, and the porters know it." }
  - { text: "The Hiring Steps", role: labour, tags: [poor], regions: [city], notice: "Men wait on the steps at dawn, and half go home empty." }
  - { text: "The Rope Walk", role: labour, tags: [coast, craft], regions: [city], notice: "A shed a furlong long, and the ropemakers walk backwards all day." }
  - { text: "The Builders' Yard", role: labour, tags: [holy], regions: [city], notice: "Masons for the cathedral, and they've downed tools again." }
  - { text: "Thieves' Alley", role: crime, tags: [poor], regions: [city], sizes: [small, local], notice: "A street the watch won't go down, even in daylight." }
  - { text: "Cutthroat Lane", role: crime, tags: [poor], regions: [city], sizes: [small], notice: "It's named for what happened there, and it keeps happening." }
  - { text: "The Sanctuary Yard", role: crime, tags: [holy], regions: [city], notice: "Thieves sit safe inside the church wall, laughing at the watch." }
  - { text: "The Riverside Taverns", role: crime, tags: [river], regions: [city], notice: "Sailors, smugglers, and anyone who's been paid to look away." }
  - { text: "The Old Cellars", role: crime, tags: [secret], regions: [city], notice: "Cellars under the old town that join up, if you know how." }
  - { text: "The Giant's Bones", role: wonder, tags: [old, holy], regions: [city], notice: "Huge bones hung in the cathedral porch, and a fee to look." }
  - { text: "The Old Wall", role: wonder, tags: [old, ruin], regions: [city], notice: "A wall older than the city, and nobody knows who built it." }
  - { text: "The Great Clock", role: wonder, tags: [wealth], regions: [city], notice: "Saints dance on the hour, and its maker was blinded for it." }
  - { text: "The King's Beasts", role: wonder, tags: [wealth], regions: [city], notice: "A lion and a bear, and a keeper running short of meat." }
  - { text: "The Drowned Church", role: wonder, tags: [old, ruin, river], regions: [city], rare: true, strange: true, notice: "Its spire stands in the river, and lights move inside at night." }

  # Country: a town, a pass, a valley or a fortress.
  - { text: "The High Pass", role: passage, tags: [mountain, road], regions: [country], sizes: [local, city], notice: "Snow half the year, and a toll tower that takes the rest." }
  - { text: "The King's Road", role: passage, tags: [road, law], regions: [country], notice: "The only road wide enough for an army, and it's crumbling." }
  - { text: "The Great Ferry", role: passage, tags: [river], regions: [country], notice: "The only crossing for forty miles, and the ferry family knows it." }
  - { text: "The Border Bridge", role: passage, tags: [border, river], regions: [country], notice: "Two kingdoms' soldiers on one bridge, and neither will step back." }
  - { text: "Port Merrow", role: passage, tags: [coast], regions: [country], sizes: [local, city], notice: "The only harbour on the coast that never freezes." }
  - { text: "Wendle Ford", role: passage, tags: [river, road], regions: [country], sizes: [small], notice: "Shallow in summer, deadly in spring, and the ford-keeper's never wrong." }
  - { text: "The Broad Vale", role: land, tags: [river], regions: [country], sizes: [city, great], notice: "The best farmland in the country, and every lord wants it." }
  - { text: "The Sheep Downs", role: land, regions: [country], notice: "Sheep to the skyline, and the wool's worth more than the land." }
  - { text: "The Royal Forest", role: land, tags: [forest, law], regions: [country], notice: "The king's deer, the king's law, and a lot of hungry villages." }
  - { text: "The Fens", role: land, tags: [marsh], regions: [country], notice: "Reeds, eels, and fen folk who don't answer to any lord." }
  - { text: "The Abbey Lands", role: land, tags: [holy], regions: [country], notice: "The valley's farmed for the monks, and the tenants have had enough." }
  - { text: "The Wheatlands", role: land, tags: [hunger], regions: [country], sizes: [city, great], notice: "Grain enough for the whole country, if it isn't burned first." }
  - { text: "The Iron Hills", role: ground, tags: [mountain], regions: [country], notice: "Smoke on every ridge, and miners who answer to nobody." }
  - { text: "The Salt Marsh", role: ground, tags: [coast, marsh], regions: [country], notice: "Salt for the whole kingdom, and the salters guard every pan." }
  - { text: "The Lead Dales", role: ground, tags: [mountain], regions: [country], notice: "Lead for every church roof, and the streams run poisoned." }
  - { text: "The Silver Mountain", role: ground, tags: [mountain, wealth], regions: [country], sizes: [city, great], notice: "A vein of silver, and three lords who say it's theirs." }
  - { text: "The Slate Quarries", role: ground, tags: [mountain], regions: [country], notice: "Grey villages, grey roofs, and a quarry that killed two last week." }
  - { text: "The Tin Moors", role: ground, regions: [country], notice: "Tinners with their own courts, who won't answer to the king's." }
  - { text: "The Cloth Towns", role: craft, tags: [market], regions: [country], sizes: [city, great], notice: "A dozen towns weaving for export, and they've never got on." }
  - { text: "Hammerdown", role: craft, tags: [war], regions: [country], notice: "A town of forges making armour for anyone who pays." }
  - { text: "The Mill Valley", role: craft, tags: [river], regions: [country], notice: "Twenty mills on one river, and they're fighting over the water." }
  - { text: "Shipwrights' Haven", role: craft, tags: [coast], regions: [country], notice: "The best ships in the country, and the navy wants them all." }
  - { text: "Clayhithe", role: craft, tags: [river], regions: [country], notice: "Pots and tiles shipped downriver, and the potters work for one family." }
  - { text: "Saint Ivel's Fair", role: trade, tags: [market, holy], regions: [country], notice: "The greatest fair in the land, and the abbey gets a tenth." }
  - { text: "The River Port", role: trade, tags: [river, market], regions: [country], sizes: [local, city], notice: "Barges unload for the whole valley, and the wharfmaster's rich." }
  - { text: "Fleecebridge", role: trade, tags: [market, wealth], regions: [country], notice: "The wool town, where foreign buyers pay in gold." }
  - { text: "Tollmarket", role: trade, tags: [market, law], regions: [country], notice: "A free town with a charter, and the duke wants it back." }
  - { text: "The Salt Road Towns", role: trade, tags: [road], regions: [country], notice: "Every town charges the salt carters, and they're fed up." }
  - { text: "The Great Abbey", role: belief, tags: [holy, wealth], regions: [country], sizes: [city, great], notice: "Richer than most lords, and the abbot sits on the king's council." }
  - { text: "The Cathedral City", role: belief, tags: [holy], regions: [country], sizes: [city, great], notice: "A city built round a cathedral, and the bishop's its lord." }
  - { text: "Saint Corra's Shrine", role: belief, tags: [holy, road], regions: [country], notice: "Pilgrims from everywhere, and the innkeepers getting rich off them." }
  - { text: "Saint Lowen's Isle", role: belief, tags: [holy, coast], regions: [country], notice: "A causeway at low tide, and monks who don't want visitors." }
  - { text: "The Hermitage", role: belief, tags: [holy, mountain], regions: [country], sizes: [small], notice: "A holy man up in the hills, visited once by the king." }
  - { text: "The Royal Castle", role: office, tags: [war, law], regions: [country], sizes: [city, great], notice: "The king holds court here, when he's not at war." }
  - { text: "Moothill", role: office, tags: [law], regions: [country], notice: "The shire court sits here, and the sheriff decides who's guilty." }
  - { text: "The Border March", role: office, tags: [border, war], regions: [country], notice: "Towers every few miles, and lords who fight for whoever's winning." }
  - { text: "The Bishop's Seat", role: office, tags: [holy, law], regions: [country], notice: "The bishop's court tries priests, and priests never hang." }
  - { text: "The Treasury Tower", role: office, tags: [law, wealth], regions: [country], notice: "The kingdom's tax is counted here, and the count's always short." }
  - { text: "Scholars' Bridge", role: knowledge, regions: [country], notice: "A university town, and the students hate the townsfolk." }
  - { text: "The Abbey Library", role: knowledge, tags: [holy], regions: [country], notice: "The oldest books in the land, and the abbot lets nobody in." }
  - { text: "The Muniment Tower", role: knowledge, tags: [law], regions: [country], notice: "Every charter in the kingdom, and a few that shouldn't exist." }
  - { text: "The Physic Garden", role: knowledge, tags: [plague], regions: [country], sizes: [small], notice: "Herbs for every sickness, and a few for poisoning." }
  - { text: "The Heralds' College", role: knowledge, tags: [blood, law], regions: [country], notice: "Every family's arms and lineage, and a herald who can be bought." }
  - { text: "Mopstead", role: labour, tags: [poor], regions: [country], notice: "The shire's hiring fair, where servants stand in rows to find masters." }
  - { text: "The Mining Camps", role: labour, tags: [mountain], regions: [country], notice: "Men come for the wages and stay for the debts." }
  - { text: "The Charcoal Woods", role: labour, tags: [forest], regions: [country], notice: "The burners live in the forest and sell to the forges." }
  - { text: "The Castle Works", role: labour, tags: [war], regions: [country], notice: "A new castle going up, and the masons were made to come." }
  - { text: "The Quarry Villages", role: labour, tags: [mountain], regions: [country], notice: "Every man's a quarryman, and every family's lost someone." }
  - { text: "The Outlaw Wood", role: crime, tags: [forest], regions: [country], notice: "Outlaws who rob the rich, and keep it." }
  - { text: "The Wreckers' Coast", role: crime, tags: [coast], regions: [country], notice: "Lights on the cliffs on stormy nights, and ships on the rocks." }
  - { text: "Raven Tower", role: crime, tags: [war, road], regions: [country], sizes: [local], notice: "A knight who taxes the road with his sword." }
  - { text: "The Smugglers' Fen", role: crime, tags: [marsh, secret], regions: [country], notice: "Wool goes out, wine comes in, and the king's men get lost." }
  - { text: "The Lawless March", role: crime, tags: [border], regions: [country], notice: "No king's writ runs here, and everyone knows it." }
  - { text: "The Giant's Ring", role: wonder, tags: [old], regions: [country], notice: "A stone ring as big as a village, with a fair inside." }
  - { text: "The Hill Fort", role: wonder, tags: [old, ruin], regions: [country], notice: "Ramparts older than the kingdom, and a well that never dries." }
  - { text: "The Turf Giant", role: wonder, tags: [old], regions: [country], notice: "A giant cut in the chalk, scoured by the villagers every year." }
  - { text: "The Drowned Village", role: wonder, tags: [ruin, marsh], regions: [country], notice: "Roofs under the lake at low water, and a church bell." }
  - { text: "The Holy Spring", role: wonder, tags: [holy, old], regions: [country], notice: "The sick come from all over, and some go home cured." }
  - { text: "The Comet Stone", role: wonder, tags: [old], regions: [country], rare: true, strange: true, notice: "A black stone that fell burning in the war, still warm." }

  # World: a country, a sea, a mountain range or a great city.
  - { text: "The Hook Strait", role: passage, tags: [coast], regions: [world], sizes: [city, great], notice: "The only way between two seas, and every ship pays." }
  - { text: "The Caravan Road", role: passage, tags: [road, stranger], regions: [world], notice: "Months of desert, and every city on it grows rich." }
  - { text: "The Spine Passes", role: passage, tags: [mountain, road], regions: [world], notice: "Three passes through the mountains, and an army can only use one." }
  - { text: "The Wend", role: passage, tags: [river], regions: [world], sizes: [city, great], notice: "The great river, and whoever holds its mouth holds the trade." }
  - { text: "Cullen Sound", role: passage, tags: [coast, law], regions: [world], notice: "Every ship stops to pay dues, and the castle counts the masts." }
  - { text: "The Golden Plains", role: land, tags: [hunger], regions: [world], sizes: [city, great], notice: "Endless wheat, and half the world eats it." }
  - { text: "The Grass Sea", role: land, tags: [stranger], regions: [world], notice: "Horse lords on the steppe, and they don't stay put." }
  - { text: "The Wine Coast", role: land, tags: [coast, wealth], regions: [world], notice: "Vineyards down to the sea, and every king's thirsty." }
  - { text: "The Delta Lands", role: land, tags: [river, marsh], regions: [world], notice: "Rice and floods, and the dykes need mending." }
  - { text: "The Northwood", role: land, tags: [forest], regions: [world], notice: "Timber for every navy, and the woodsmen pick their buyer." }
  - { text: "The Silver Mountains", role: ground, tags: [mountain, wealth], regions: [world], sizes: [city, great], notice: "Half the world's silver, and the mines go deeper every year." }
  - { text: "The White Waste", role: ground, tags: [stranger], regions: [world], notice: "A salt desert, and caravans that come back lighter." }
  - { text: "Ironmark", role: ground, tags: [mountain, war], regions: [world], notice: "A kingdom of iron that sells swords to both sides." }
  - { text: "The Copper Hills", role: ground, tags: [mountain], regions: [world], notice: "Copper for bells and coins, and a feud over every seam." }
  - { text: "The Jet Strand", role: ground, tags: [coast], regions: [world], notice: "Black stone on the beach, worth silver to the right buyer." }
  - { text: "The Weaving Towns", role: craft, tags: [market], regions: [world], notice: "Cloth for the whole world, and the weavers are starving." }
  - { text: "Glassmere", role: craft, tags: [wealth, secret], regions: [world], notice: "A city of glassmakers who'll be killed if they ever leave." }
  - { text: "Steelholm", role: craft, tags: [war], regions: [world], notice: "The world's best blades, and the smiths make their own laws." }
  - { text: "Keelmouth", role: craft, tags: [coast], regions: [world], notice: "Shipyards for any king who pays, and some who don't." }
  - { text: "Saltmarket", role: trade, tags: [market], regions: [world], sizes: [city, great], notice: "The greatest market in the world, where anything's for sale." }
  - { text: "Free Hesk", role: trade, tags: [market, law], regions: [world], notice: "A merchant republic, and its council buys kings." }
  - { text: "The Pepper Isles", role: trade, tags: [coast, stranger, wealth], regions: [world], notice: "Spice worth more than gold, and fleets fighting to carry it." }
  - { text: "Goldbridge", role: trade, tags: [wealth, debt], regions: [world], notice: "Bankers who lend to every king, and own a few." }
  - { text: "The Fur Rivers", role: trade, tags: [river, stranger], regions: [world], notice: "Trappers, traders and furs for every royal shoulder." }
  - { text: "Hallowmere", role: belief, tags: [holy], regions: [world], sizes: [city, great], notice: "The holy city, and three kings claim to protect it." }
  - { text: "Saint Ancret's Tomb", role: belief, tags: [holy, road], regions: [world], notice: "The pilgrimage everyone makes once, and some never come back." }
  - { text: "The Mount of Prayers", role: belief, tags: [holy, mountain], regions: [world], notice: "A mountain of monasteries, all with opinions on the next king." }
  - { text: "The Bishops' Kingdom", role: belief, tags: [holy, law], regions: [world], notice: "A country ruled by its bishops, and they're choosing a new one." }
  - { text: "The Sacred Grove", role: belief, tags: [old, holy], regions: [world], notice: "The old faith's last great grove, and the church wants it felled." }
  - { text: "The Old Capital", role: office, tags: [old, law], regions: [world], sizes: [city, great], notice: "The empire's old throne, and whoever sits in it claims everything." }
  - { text: "Crownhold", role: office, tags: [law, war], regions: [world], notice: "The greatest castle in the world, and its king's dying." }
  - { text: "The Treaty Isle", role: office, tags: [law, coast], regions: [world], notice: "Neutral ground where kings meet, and it's never been neutral." }
  - { text: "The Great March", role: office, tags: [border, war], regions: [world], notice: "The wall at the edge of the kingdoms, and it's undermanned." }
  - { text: "The Library at Sallow", role: knowledge, tags: [old], regions: [world], notice: "Every book worth having, and a librarian who sells copies." }
  - { text: "The City of Schools", role: knowledge, tags: [law], regions: [world], notice: "Scholars from every kingdom, arguing about who should rule." }
  - { text: "Pilotmouth", role: knowledge, tags: [coast], regions: [world], notice: "Map-makers and pilots who know the way to anywhere, for a price." }
  - { text: "The Star Tower", role: knowledge, tags: [old], regions: [world], notice: "Astronomers who chart the heavens and tell kings their fortunes." }
  - { text: "The Oar Coast", role: labour, tags: [coast], regions: [world], notice: "Galley crews hired by the season, who'll row for anyone." }
  - { text: "The Deep Hills", role: labour, tags: [mountain], regions: [world], notice: "Miners from everywhere, who'll dig wherever the pay's better." }
  - { text: "The Mercenary Coast", role: labour, tags: [war], regions: [world], notice: "Companies for hire, camped and waiting for the next war." }
  - { text: "The Harvest Roads", role: labour, tags: [road, land], regions: [world], notice: "Thousands walk these roads every autumn to bring the harvest in." }
  - { text: "The Pirate Isles", role: crime, tags: [coast], regions: [world], notice: "A hundred islands, each with a captain who calls himself king." }
  - { text: "The Brigand Hills", role: crime, tags: [mountain], regions: [world], notice: "No caravan crosses without paying, and some don't cross at all." }
  - { text: "The Black Gulf", role: crime, tags: [coast, secret], regions: [world], notice: "Smugglers' water, where the navies don't go." }
  - { text: "The Broken March", role: crime, tags: [border, war], regions: [world], notice: "Kingdoms ended here, and now it's anyone's." }
  - { text: "The Old Empire's Ruins", role: wonder, tags: [old, ruin], regions: [world], notice: "Marble cities in the grass, and treasure hunters in every one." }
  - { text: "World's Edge", role: wonder, tags: [stranger], regions: [world], rare: true, strange: true, notice: "The maps stop here, and so do the sailors who came back." }
  - { text: "The Burning Mountain", role: wonder, tags: [mountain], regions: [world], notice: "A mountain that smokes and shakes, and a city at its foot." }
  - { text: "The First King's Tomb", role: wonder, tags: [old], regions: [world], notice: "Nobody's ever opened it, and three kingdoms claim his crown." }
  - { text: "The Stone Road", role: wonder, tags: [old, coast], regions: [world], rare: true, strange: true, notice: "Stone columns march into the sea, and nobody knows who laid them." }

