wants:
  - { text: "A title of its own.", tags: [blood, law], leans: [friends-at-court, traders, family, soldiers] }
  - { text: "To win a holy war across the sea.", tags: [holy, war], needs: [holy], leans: [faithful, standing-army, faith, soldiers] }
  - { text: "To get its charter back.", tags: [law], leans: [office, traders, makers] }
  - { text: "To have the river to itself.", tags: [river], needs: [river], leans: [passage, fast-boats, traders, crooks, family] }
  - { text: "To see its enemies hanged.", tags: [law, feud], leans: [judge-in-its-pocket, office, house, family] }

secrets:
  - { tag: "Its heir was fathered by someone in {rival}", tags: [blood], ways: ["A midwife who remembers the night", "A face too like theirs"] }
  - { tag: "It forged its own charter", more: "The seal's ten years too young.", tags: [law], ways: ["The clerk who wrote it", "The real charter, if it survived"] }
  - { tag: "It sold grain to {rival} in the famine", tags: [hunger], ways: ["The granary's books", "A carter paid to keep quiet"] }
  - { tag: "Its lord died a year ago and nobody's said", more: "The steward signs for him.", tags: [blood, secret], ways: ["A bedchamber that's always locked", "The priest who gave the last rites"] }
  - { tag: "Its relic's a fake", more: "The real bones went to {rival}.", tags: [holy], ways: ["An old monk who knows", "The craftsman who made the copy"] }
  - { tag: "It hid its plague dead in the river", tags: [plague], ways: ["Bones in the mud at low water", "A gravedigger nobody paid"] }
  - { tag: "It's paying {rival} not to attack", ways: ["Carts that leave at night", "A purse handed over at the fair"] }
  - { tag: "Its knights ran at the last battle", tags: [war], ways: ["A survivor in the almshouse", "A song the minstrels won't sing here"] }
  - { tag: "It started the fire that burned the old quarter", tags: [feud, ruin], ways: ["The fire's first witness", "Scorched boots in its own storeroom"] }
  - { tag: "It poisoned the last lord of {seat}", tags: [blood], ways: ["The physician who sat with him", "A herb-woman who sold the dose"] }
  - { tag: "Its leader can't read, and hides it", ways: ["Letters left unopened", "A clerk who reads everything aloud"] }
  - { tag: "It's sheltering a heretic", more: "The bishop would burn them both.", tags: [holy, secret], ways: ["A guest who never leaves", "Books it shouldn't own"] }
  - { tag: "It took {seat} by moving the boundary stones", tags: [land], ways: ["The old stones' marks in the grass", "A shepherd who saw it done"] }
  - { tag: "Its heir's been a hostage of {rival} since spring", tags: [blood], ways: ["Letters in a child's hand", "A guard who saw the child"] }
  - { tag: "It's promised the same bride to two houses", more: "One of them is {rival}.", tags: [blood], ways: ["Two marriage contracts", "A dowry paid twice"] }
  - { tag: "Its fortune came from a robbery on the king's road", tags: [crime, road], ways: ["A stolen chalice it never sold", "The robbed merchant's son, grown up"] }
  - { tag: "Its founder was a runaway serf", more: "The old lord's heirs could claim it all.", tags: [blood, law], ways: ["A false name on the founder's grave", "The manor rolls of a far-off village"] }
  - { tag: "It plans to open the gates to {rival}", tags: [war], ways: ["A key copied in wax", "New guards nobody's seen before"] }
  - { tag: "Its abbess has visions, and they come true", more: "She's seen the end of {rival}.", tags: [holy], rare: true, strange: true, ways: ["A book of dated prophecies", "A novice who writes them down"] }
  - { tag: "Its saint's body hasn't rotted in a hundred years", tags: [holy, old], rare: true, strange: true, ways: ["The tomb opened once a year", "A sexton who's seen inside"] }
  - { tag: "It guards a stone that fell from the sky", more: "Its smith's new blade is made from it.", tags: [old], rare: true, strange: true, ways: ["A crater on the hill", "A sword that never seems to dull"] }

exceptions:
  - { text: "On the river, and won't trade on it", when: [river], out: [soldiers, office, faith, society, keepers, old], drops: [trade], gives: [plague], reason: "because the last barge brought the plague" }
  - { text: "Holy, and won't take a penny in offerings", when: [faith], drops: [belief], reason: "because its founder swore it would stay poor" }
  - { text: "Rich, and won't hire a single sword", when: [wealth], drops: [hired-swords], reason: "because hired men murdered its old head" }
  - { text: "It holds a mine and won't dig", when: [ground], drops: [ground], reason: "because the deep shaft took forty men" }
  - { text: "It keeps the law, and won't arrest anyone", when: [office], out: [makers, traders, crooks, family, rebels, keepers, old, society, faith], drops: [constables, bailiffs], reason: "because its last arrest started a riot" }
  - { text: "A family that won't call on its family", when: [blood], drops: [kin], gives: [feud], reason: "because the cousins tried to poison the heir" }
  - { text: "On the coast, and won't put to sea", when: [coast], out: [faith, office, keepers, old, society, rebels], drops: [ship, warships, fast-boats], reason: "because the last ship sank with every hand" }
  - { text: "Soldiers who won't fight for pay", when: [soldiers], drops: [hired-swords], reason: "because they swore an oath to a dead king" }
  - { text: "Crooks who won't touch the market", when: [crooks], drops: [market], reason: "because the market women saved its leader's life" }

