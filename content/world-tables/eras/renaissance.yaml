secrets:
  - { tag: "Bankrupt Already", more: "Its bank's empty, and it pays old debts with new loans.", ways: ["A clerk quietly selling the silver", "A creditor who can't get paid"], tags: [debt, wealth] }
  - { tag: "{rival}'s Printer", more: "It pays the press behind every libel against {rival}.", ways: ["The printer's account book", "The same type on every pamphlet"], tags: [print, secret] }
  - { tag: "Poisoned {rival}'s Heir", more: "The fever that killed {rival}'s heir came out of its kitchen.", ways: ["The cook it paid to leave town", "The apothecary's ledger"], tags: [blood] }
  - { tag: "A Reformer at Heart", more: "Its leader hears the new preachers in secret every week.", ways: ["A plain prayer book under her pillow", "A preacher hidden over the stables"], tags: [holy, secret] }
  - { tag: "Sold the Fortress Plans", more: "It sold the plans of the bastions to the prince's enemies.", ways: ["An engineer who drew a second copy", "Gold from a foreign bank"], tags: [war, foreign] }
  - { tag: "Sank Its Own Ships", more: "It insured its ships, then paid their captains to sink them.", ways: ["A captain drinking too well", "The underwriters' records"], tags: [coast, wealth] }
  - { tag: "Notes in {rival}'s Hands", more: "Every note it's signed has ended up in {rival}'s strongbox.", ways: ["A broker who bought them cheap", "{rival}'s counting-house clerk"], tags: [debt] }
  - { tag: "A Bought Name", more: "Its noble name was bought from a herald, ancestors and all.", ways: ["The herald's account book", "A family tomb with nobody in it"], tags: [blood] }
  - { tag: "A Foreign Crown's Spies", more: "Its leader reports every week to an ambassador.", ways: ["Letters in cipher in the dovecote", "Gold that comes in an embassy's bag"], tags: [foreign, crown] }
  - { tag: "The Plague Ship", more: "It let a plague ship unload, and the dying started after.", ways: ["The harbour master it paid", "The ship's log"], tags: [plague, coast] }
  - { tag: "Counterfeit Bills", more: "Half the bills it pays out with are forgeries.", ways: ["A banker abroad refusing one", "An engraver it keeps in the attic"], tags: [print, wealth] }
  - { tag: "Married into {rival}", more: "Its heir's secretly married to {rival}'s eldest.", ways: ["The priest who married them", "A ring the heir won't take off"], tags: [blood] }
  - { tag: "Burned the Wrong Woman", more: "The woman it had burned was innocent, and it knew.", ways: ["The witness who lied", "The real heretic, still preaching"], tags: [holy, law] }
  - { tag: "Pays {rival}'s Bravos", more: "The bravos who keep attacking {rival}'s people take its money.", ways: ["A bravo who talks when he's drunk", "Coins from its own strongroom"], tags: [secret] }
  - { tag: "The Altarpiece Is Fake", more: "Its famous altarpiece was painted last year by a forger.", ways: ["The forger, now dying", "Paint still soft underneath"], tags: [wealth, holy] }
  - { tag: "Copied {rival}'s Ledger", more: "It holds a copy of {rival}'s secret ledger, bribes and all.", ways: ["The clerk who copied it", "A strongbox under the chapel"], tags: [debt, secret] }
  - { tag: "Ran at the Battle", more: "Its captain ran at the famous battle, and paid men to lie.", ways: ["A veteran with a long memory", "The roll of the dead"], tags: [war] }
  - { tag: "{rival}'s Captain Is Ours", more: "{rival}'s best captain has taken its pay for years.", ways: ["A captain buying land above his pay", "Orders that always go wrong"], tags: [war, secret] }
  - { tag: "Sank {rival}'s Fleet", more: "The storm took the blame, but its fireship sank {rival}'s fleet.", ways: ["A sailor who saw the fireship", "Powder bought the week before"], tags: [coast, war] }
  - { tag: "The Gold Is Real", more: "Its leader really does make gold, and it's killing her.", ways: ["Gold with no mint mark", "Her hair coming out in handfuls"], rare: true, strange: true, tags: [old, wealth] }
  - { tag: "The Prophecy Names Her", more: "An old printed prophecy names its leader, and it's all come true.", ways: ["Almanacs it buys up and burns", "The astrologer who read it"], rare: true, strange: true, tags: [old, print] }
  - { tag: "The Saint Walks", needs: [holy], more: "Its saint's statue leaves the church at night, and it knows where.", ways: ["Wet stone feet in the morning", "The sacristan who follows"], rare: true, strange: true, tags: [holy, old] }
  - { tag: "The First Wife Walks", more: "Its leader's first wife is buried in the garden, and walks.", ways: ["Fresh earth on an old grave", "A gardener who won't work past dusk"], rare: true, strange: true, tags: [old, blood] }

# Each breaks the logic on purpose, with its reason.
exceptions:
  - { text: "It won't lend to a prince", when: [debt, wealth], drops: [crown, friends-at-court], gives: [secret], reason: "because the last prince it lent to hanged its founder" }
  - { text: "It won't print a word against the crown", when: [print], drops: [rumour-mill], gives: [crown], reason: "because the censor burned its first shop with the printer inside" }
  - { text: "It won't keep gunpowder anywhere near it", when: [war], drops: [powder], reason: "because a powder store took its founder's three sons" }
  - { text: "It won't sail past the cape", when: [coast, traders], drops: [foreign, ship], reason: "because its founder's whole fleet went down there" }
  - { text: "It won't hire a single bravo", when: [house, blood], drops: [toughs, hired-swords], reason: "because a bravo it hired killed the heir instead" }
  - { text: "It won't let a doctor through the door", when: [plague], drops: [healers], reason: "because the last doctor brought the plague in with him" }
