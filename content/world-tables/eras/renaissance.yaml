# Renaissance: the era on its own, and the base of the Gilded Court and
# Brinewake. Banks and bills, presses and pamphlets, pike and shot and star
# forts, chartered ships to the far side of the world, princes and patrons,
# plague and the split in the faith. Names are a wide mix on every board
# (Mo's pick, 30 Oct): Italian, French, Spanish, Dutch, German and English.
# Strange things here are the deniable kind: comets, prophecies, alchemists,
# saints that weep and clockwork that shouldn't think. Magic makes them real.
fits: [town, city, country, world]

seats:
  # Town: a street, a building or a square.
  - { text: "The Post House", role: passage, tags: [road, crown], regions: [town], notice: "Fresh horses for the royal post, and a postmaster who reads." }
  - { text: "The Lock Gates", role: passage, tags: [river], regions: [town], notice: "Barges stacked up at the lock while the keeper names his price." }
  - { text: "Porta Salvagna", role: passage, tags: [road, wall], regions: [town], notice: "A new gate with a gun bastion, and a toll per cart." }
  - { text: "The Packet Quay", role: passage, tags: [coast], regions: [town], notice: "The packet sails on Tuesdays, and the captain sells the spare berths." }
  - { text: "The Coach Yard", role: passage, tags: [road], regions: [town], notice: "Three coach companies share one yard, and they don't share it well." }
  - { text: "The Hedged Common", role: land, tags: [cloth, poor], regions: [town], notice: "Hedges where the common was, and sheep where the village grazed." }
  - { text: "The Mulberry Rows", role: land, tags: [cloth, wealth], regions: [town], notice: "Mulberry trees for the silkworms, and a guard walking every row." }
  - { text: "The Rice Fields", role: land, tags: [river, grain, plague], regions: [town], notice: "Women knee-deep in the flooded fields, and fever every summer." }
  - { text: "The Drained Meadows", role: land, tags: [marsh, grain], regions: [town], notice: "An engineer drained them, and the eel-fishers want their marsh back." }
  - { text: "The Villa Grounds", role: land, tags: [wealth], regions: [town], notice: "A banker's country villa, and the town's only fountain inside its wall." }
  - { text: "The Saltpetre Yard", role: ground, tags: [powder, poor], regions: [town], notice: "Saltpetre men with a licence to dig up any stable floor." }
  - { text: "The Alum Pits", role: ground, tags: [cloth, mine], regions: [town], notice: "Alum for the dyers, and the bishop's cut on every cart." }
  - { text: "The Marble Cut", role: ground, tags: [stone, wealth], regions: [town], notice: "White marble for rich men's tombs, cut from the one hill." }
  - { text: "The Coal Pits", role: ground, tags: [mine, poor], regions: [town], notice: "Coal for the glassworks, and children working the narrow seams." }
  - { text: "The Copper Diggings", role: ground, tags: [mine, metal, powder], regions: [town], notice: "The gun foundry buys every barrow of copper before it's washed." }
  - { text: "The Print Shop", role: craft, tags: [print], regions: [town], notice: "Wet pages pegged up, and a censor's stamp by the door." }
  - { text: "The Powder Mill", role: craft, tags: [powder], regions: [town], notice: "Built a mile out of town, for the day it goes up." }
  - { text: "The Gun Foundry", role: craft, tags: [metal, powder, war], regions: [town], notice: "The duke's cannon is a month late, and he's sent a man." }
  - { text: "Lacemakers' Row", role: craft, tags: [cloth, poor], regions: [town], notice: "Women at their lace pillows in every window, working the light." }
  - { text: "The Clockmaker's", role: craft, tags: [metal, wealth], regions: [town], notice: "Every clock in town keeps his time, and he sets it." }
  - { text: "The Banker's Bench", role: trade, tags: [wealth, debt], regions: [town], notice: "A green cloth, a pair of scales and half the town's debts." }
  - { text: "The Market Loggia", role: trade, tags: [market], regions: [town], notice: "An open hall on the square, so every deal's done in sight." }
  - { text: "The Cloth Market", role: trade, tags: [market, cloth, foreign], regions: [town], notice: "Foreign bolts on every table, and the town's weavers glaring at them." }
  - { text: "The Lottery Office", role: trade, tags: [market, poor], regions: [town], notice: "Tickets for the new bridge lottery, and nobody's ever met a winner." }
  - { text: "The Bonded Warehouse", role: trade, tags: [law, secret], regions: [town], notice: "Goods waiting on their duty, and fewer of them every week." }
  - { text: "The New Chapel", role: belief, tags: [holy, poor, print], regions: [town], notice: "Bare walls, no statues, and a preacher in the common tongue." }
  - { text: "Saint Marsilia's", role: belief, tags: [holy, wealth], regions: [town], notice: "Painted from floor to dome, and still owing the painter." }
  - { text: "The Plague Chapel", role: belief, tags: [holy, plague], regions: [town], notice: "Built to end the last plague, with a vow to build another." }
  - { text: "The Broken Altar", role: belief, tags: [holy, secret], regions: [town], notice: "Saints with their faces chiselled off, and nobody's owned up." }
  - { text: "The Confraternity Hall", role: belief, tags: [holy, guild], regions: [town], notice: "The brothers carry the saint on feast days, and fight over who." }
  - { text: "The Magistrate's House", role: office, tags: [law], regions: [town], notice: "The magistrate's hired from out of town, so he's nobody's cousin." }
  - { text: "The Health Office", role: office, tags: [plague, law], regions: [town], notice: "The health officers can shut any house in town, and do." }
  - { text: "The Weigh-House", role: office, tags: [law, market], regions: [town], notice: "Bales weighed twice, once for the crown and once for the clerk." }
  - { text: "The Mustering Ground", role: office, tags: [war, crown], regions: [town], notice: "The militia drills on Sundays, and skipping it costs a fine." }
  - { text: "The Notary's", role: office, tags: [law], regions: [town], notice: "He copies the town's contracts in a hand only he can read." }
  - { text: "The Anatomy Theatre", role: knowledge, tags: [plague], regions: [town], notice: "Benches round a slab, and bodies bought fresh from the gallows." }
  - { text: "The Bookseller's", role: knowledge, tags: [print, secret], regions: [town], notice: "Almanacs in the window, and banned books in the back room." }
  - { text: "The Physic Garden", role: knowledge, tags: [plague, foreign], regions: [town], notice: "Herbs from across the sea, and a gardener who sells the seeds." }
  - { text: "The Astronomer's Roof", role: knowledge, tags: [old], regions: [town], notice: "A spyglass on the roof, and a man who's stopped sleeping." }
  - { text: "The Writing Master's", role: knowledge, tags: [law, secret], regions: [town], notice: "He teaches the merchant's hand, and writes anyone else's for a fee." }
  - { text: "The Silk Mill", role: labour, tags: [cloth, river, poor], regions: [town], notice: "One water wheel turns three hundred spindles, and girls tie the threads." }
  - { text: "The Bridge Works", role: labour, tags: [river, stone, poor], regions: [town], notice: "Half the town's men on the new bridge, and their pay's late." }
  - { text: "The Canal Diggings", role: labour, tags: [marsh, poor, plague], regions: [town], notice: "Hundreds digging the new canal, and the marsh fever's taken twenty." }
  - { text: "The Soldiers' Camp", role: labour, tags: [war, poor], regions: [town], notice: "A company waiting on a contract, and eating the town bare." }
  - { text: "The Porters' Lodge", role: labour, tags: [market, guild], regions: [town], notice: "The porters' guild carries everything, and nothing moves without them." }
  - { text: "The Bravos' Tavern", role: crime, tags: [poor], regions: [town], notice: "Men with long knives, waiting for someone with a grudge and coin." }
  - { text: "The Coiners' Cellar", role: crime, tags: [wealth, secret, metal], regions: [town], notice: "Light coin for heavy, and a press that only runs at night." }
  - { text: "The Card Rooms", role: crime, tags: [wealth, debt], regions: [town], notice: "Cards all night, and a duel in the yard by morning." }
  - { text: "Pawnbrokers' Alley", role: crime, tags: [debt, poor], regions: [town], notice: "Pawned swords in every window, and men who come back armed." }
  - { text: "The Bandits' Chapel", role: crime, tags: [road, wild], regions: [town], notice: "A wayside chapel the brigands use for counting their takings." }
  - { text: "The Comet Stone", role: wonder, tags: [old], regions: [town], rare: true, strange: true, notice: "It fell the year the old duke died, and it's still warm." }
  - { text: "The Curiosity Cabinet", role: wonder, tags: [wealth, old], regions: [town], notice: "A dragon's tooth, a mermaid's hand and a drawer that's always locked." }
  - { text: "The Speaking Head", role: wonder, tags: [old, metal], regions: [town], rare: true, strange: true, notice: "A brass head in the apothecary's window answers one question a day." }
  - { text: "The Old Arena", role: wonder, tags: [old], regions: [town], notice: "Stone seats in a ring, dug up under the market last spring." }
  - { text: "The Prophet's Pillar", role: wonder, tags: [holy, poor], regions: [town], notice: "A hermit up a column, preaching that the world ends next year." }

  # City: a district, a gate or a hall.
  - { text: "The Lagoon Mouth", role: passage, tags: [coast], regions: [city], notice: "Pilots row out to every ship, and one in three's a spy." }
  - { text: "The Customs Point", role: passage, tags: [coast, law], regions: [city], notice: "Ships stop here to be searched, and the officers' cousins unload them." }
  - { text: "Porta Ferrugia", role: passage, tags: [road, wall, crown], regions: [city], notice: "The duke's own gate, and his own men search every cart." }
  - { text: "The Canal Locks", role: passage, tags: [river], regions: [city], notice: "Three locks into the city, and three families who run them." }
  - { text: "The Courier Office", role: passage, tags: [road, crown, secret], regions: [city], notice: "Letters to every court, and copies to whoever pays the night clerk." }
  - { text: "The Villa Hills", role: land, tags: [hill, wealth], regions: [city], notice: "Every great family's summer villa, and a feud along each wall." }
  - { text: "The Reclaimed Marsh", role: land, tags: [marsh, grain], regions: [city], notice: "New fields where the lagoon was, and the sea wants them back." }
  - { text: "The Grain Islands", role: land, tags: [river, grain], regions: [city], notice: "The city's bread grows on three islands, and one family owns them." }
  - { text: "The Garden Quarter", role: land, tags: [wealth], regions: [city], notice: "Walled gardens with fountains, and water rights older than the walls." }
  - { text: "The Olive Terraces", role: land, tags: [hill], regions: [city], notice: "Olives up every slope, and the oil sold before it's pressed." }
  - { text: "The Lagoon Salt Pans", role: ground, tags: [coast, crown], regions: [city], notice: "Salt raked in the shallows, under the state's own guards." }
  - { text: "The Saltpetre Works", role: ground, tags: [powder, poor], regions: [city], notice: "Dung heaps and boiling vats, kept upwind of anyone important." }
  - { text: "The Travertine Cut", role: ground, tags: [stone, wealth], regions: [city], notice: "Honey-coloured stone for every palazzo, all of it from one family's quarry." }
  - { text: "The Clay Banks", role: ground, tags: [river, poor], regions: [city], notice: "Potters digging out the riverbank, and the bank's falling in." }
  - { text: "The Glass Sands", role: ground, tags: [coast, wealth], regions: [city], notice: "White sand for the glassmakers, guarded like a bank." }
  - { text: "The Arsenal", role: craft, tags: [coast, war, powder], regions: [city], sizes: [city, great], notice: "Thousands of hands, and a war galley built in a single day." }
  - { text: "Printers' Street", role: craft, tags: [print], regions: [city], notice: "Twenty presses, and every one's printed something it shouldn't have." }
  - { text: "The Tapestry Works", role: craft, tags: [cloth, wealth], regions: [city], notice: "Forty looms on one hunting scene, for a king who hasn't paid." }
  - { text: "The Painters' Workshops", role: craft, tags: [wealth, guild], regions: [city], notice: "Apprentices grinding colours, and the master signs whatever they paint." }
  - { text: "The Armourers' Quarter", role: craft, tags: [war, metal], regions: [city], notice: "Breastplates proofed with a pistol shot, and the dent left in." }
  - { text: "The Bourse", role: trade, tags: [wealth, market], regions: [city], notice: "Merchants shouting prices for cargoes that are still at sea." }
  - { text: "The Bankers' Loggia", role: trade, tags: [wealth, debt], regions: [city], notice: "Bills from every city in the world, honoured over a handshake." }
  - { text: "The Foreigners' Hall", role: trade, tags: [foreign, market, law], regions: [city], notice: "Foreign merchants live and trade here, and they're locked in at night." }
  - { text: "The Underwriters' Room", role: trade, tags: [coast, wealth], regions: [city], notice: "Ships insured over a glass of wine, and one captain's sunk twice." }
  - { text: "The Book Fair", role: trade, tags: [print, market], regions: [city], notice: "Presses from all over sell here, and the censors buy too." }
  - { text: "The Cathedral Dome", role: belief, tags: [holy, wealth, stone], regions: [city], sizes: [city, great], notice: "The biggest dome ever started, and nobody knows how to finish it." }
  - { text: "The Reformers' Hall", role: belief, tags: [holy, poor, print], regions: [city], notice: "Psalms the old church calls heresy, with a guard on the door." }
  - { text: "The Mercy Brothers' Chapel", role: belief, tags: [holy, plague], regions: [city], notice: "Hooded brothers carry the dying out, and keep all their names." }
  - { text: "The Penitents' Church", role: belief, tags: [holy, secret], regions: [city], notice: "They whip themselves through the streets, and know every sinner by name." }
  - { text: "The Foundling Hospital", role: belief, tags: [holy, poor], regions: [city], notice: "A wheel in the wall for foundlings, and a ledger of who." }
  - { text: "The Ducal Palace", role: office, tags: [crown, law], regions: [city], sizes: [city, great], notice: "A lion's mouth in the wall takes accusations, signed or not." }
  - { text: "The Citadel", role: office, tags: [crown, war, wall, powder], regions: [city], sizes: [city, great], notice: "A star fort built facing the city, not the enemy." }
  - { text: "The Salt Office", role: office, tags: [crown, coast, law], regions: [city], notice: "The state sells all the salt, and fines anyone else who tries." }
  - { text: "The Censors' Office", role: office, tags: [print, law], regions: [city], notice: "Every page printed in the city gets read here first." }
  - { text: "The Great Council Hall", role: office, tags: [law], regions: [city], notice: "Two hundred seats, and the vote's usually bought by Thursday." }
  - { text: "The Academy", role: knowledge, tags: [old, wealth], regions: [city], notice: "Scholars arguing over old books, paid by whichever prince likes the answer." }
  - { text: "The Observatory", role: knowledge, tags: [old], regions: [city], notice: "Charts of the heavens, and a prince's horoscope locked in a box." }
  - { text: "The Pilots' School", role: knowledge, tags: [coast, foreign, secret], regions: [city], notice: "Navigators train here, and the charts never leave the room." }
  - { text: "The Prince's Library", role: knowledge, tags: [crown, old], regions: [city], notice: "The prince's books, all of them, bar the few he's had burned." }
  - { text: "The Engineer's Studio", role: knowledge, tags: [war, wealth], regions: [city], notice: "Drawings of machines that fly, sink ships and shouldn't exist." }
  - { text: "The Wool Combers' Quarter", role: labour, tags: [cloth, poor], regions: [city], notice: "Thousands working for the cloth guild, and not one gets a vote." }
  - { text: "The Palace Works", role: labour, tags: [stone, poor], regions: [city], notice: "The palace is ten years building, and the masons want paying first." }
  - { text: "The Boatmen's Stations", role: labour, tags: [river, coast], regions: [city], notice: "Boatmen at every stair, and if they stop, the city stops." }
  - { text: "The Mercenary Market", role: labour, tags: [war], regions: [city], notice: "Captains hire out whole companies by the month, from a tavern table." }
  - { text: "The Tanners' Island", role: labour, tags: [river, poor], regions: [city], notice: "The stink got the tanners sent across the water, families and all." }
  - { text: "The Bravo Steps", role: crime, tags: [poor], regions: [city], notice: "Hired knives sit on these steps, with their prices chalked up." }
  - { text: "The Carnival Quarter", role: crime, tags: [secret], regions: [city], notice: "Masks for six weeks a year, and nobody's who they say." }
  - { text: "The Gaming Palaces", role: crime, tags: [wealth, debt], regions: [city], notice: "Fortunes lost by candlelight, and the debts collected by daylight." }
  - { text: "Forgers' Lane", role: crime, tags: [print, secret], regions: [city], notice: "Bills, passes and pardons, still wet from the press." }
  - { text: "The Back Canals", role: crime, tags: [river, secret], regions: [city], notice: "Narrow water the watch can't follow, and boats with no lamps." }
  - { text: "The Alchemist's House", role: wonder, tags: [old, secret, wealth], regions: [city], rare: true, strange: true, notice: "Smoke at all hours, and he's paid his debts in gold." }
  - { text: "The Painted Ceiling", role: wonder, tags: [holy, wealth], regions: [city], rare: true, strange: true, notice: "The painter died finishing it, and the figures have moved since." }
  - { text: "The Statue Garden", role: wonder, tags: [old, wealth], regions: [city], notice: "Old gods dug from the ruins, and buyers from every court." }
  - { text: "The Plague Island", role: wonder, tags: [plague, old], regions: [city], notice: "The quarantine island, with a plague pit the boatmen won't go near." }
  - { text: "The Clockwork Theatre", role: wonder, tags: [metal, wealth], regions: [city], rare: true, strange: true, notice: "Clockwork actors play one tragedy, and one's started changing its lines." }

  # Country: a town, a pass, a forest or a fortress.
  - { text: "The Bastion Pass", role: passage, tags: [hill, road, war], regions: [country], notice: "A star fort astride the road, its guns facing both ways." }
  - { text: "Port Saint-Valéran", role: passage, tags: [coast], regions: [country], notice: "The only deep harbour on the coast, and three crowns want it." }
  - { text: "The Post Road", role: passage, tags: [road, crown], regions: [country], notice: "A relay every ten miles, and the crown's riders don't give way." }
  - { text: "The Great Canal", role: passage, tags: [river], regions: [country], notice: "Half-dug across the country, and already taxed at both ends." }
  - { text: "Puente Hondo", role: passage, tags: [river, road, war], regions: [country], notice: "The only bridge over the gorge, its toll doubled in the war." }
  - { text: "The Plain Estates", role: land, tags: [grain, wealth], regions: [country], notice: "Wheat to the horizon, owned by men who've never seen it." }
  - { text: "The Sheep Country", role: land, tags: [cloth, hill, poor], regions: [country], notice: "Whole villages emptied for sheep, and the shepherds paid in wool." }
  - { text: "The Polders", role: land, tags: [marsh, grain], regions: [country], notice: "Fields below the sea, held up by dykes and a water board." }
  - { text: "The Vine Valleys", role: land, tags: [hill, wealth], regions: [country], notice: "Wine that sells across the sea, and lords who drink the profits." }
  - { text: "The Horse Studs", role: land, tags: [wild, war, wealth], regions: [country], notice: "Warhorses for every army, and the breeder sells to both sides." }
  - { text: "The Alum Mountains", role: ground, tags: [mine, cloth, hill, holy], regions: [country], notice: "Alum for every dyer in the land, and the church owns it." }
  - { text: "The Quicksilver Mines", role: ground, tags: [mine, metal], regions: [country], notice: "Quicksilver for the silver works, and miners who shake by thirty." }
  - { text: "The Saltpetre Caves", role: ground, tags: [powder, hill], regions: [country], notice: "Bat dung by the cartload, worth more than the land above it." }
  - { text: "The Ore Hills", role: ground, tags: [mine, metal, hill, powder], regions: [country], notice: "Iron for the gun foundries, dug by men the army can't take." }
  - { text: "The Coal Fields", role: ground, tags: [mine, poor], regions: [country], notice: "Pits on every hill, and their smoke reaches the capital." }
  - { text: "Cannon Town", role: craft, tags: [powder, metal, war], regions: [country], notice: "A whole town casting guns, with every army's buyer in its inns." }
  - { text: "The Press Town", role: craft, tags: [print], regions: [country], notice: "Forty presses in a college town, and the censor lives elsewhere." }
  - { text: "The Lace Villages", role: craft, tags: [cloth, poor], regions: [country], notice: "Every cottage makes lace, and one merchant buys it by the yard." }
  - { text: "The Majolica Kilns", role: craft, tags: [wealth], regions: [country], notice: "Painted pottery for rich tables, and a glaze nobody else can copy." }
  - { text: "The Watchmakers' Valley", role: craft, tags: [metal, wealth], regions: [country], notice: "A watchmaker in every house, and the prince buys the best." }
  - { text: "The Exchange Fairs", role: trade, tags: [wealth, market, foreign], regions: [country], notice: "Four times a year, the bankers meet to settle every debt." }
  - { text: "The Free Port", role: trade, tags: [coast, market], regions: [country], notice: "No customs and no questions, and a governor who takes his share." }
  - { text: "The Spice Port", role: trade, tags: [coast, foreign, wealth, plague], regions: [country], notice: "Ships home from the world's far side, with pepper and plague." }
  - { text: "The Wine Port", role: trade, tags: [river, market], regions: [country], notice: "Barrels down the river, and merchants tasting with their knives out." }
  - { text: "The Customs Frontier", role: trade, tags: [road, law, foreign], regions: [country], notice: "Carts for the next kingdom stop here, and pay twice." }
  - { text: "The Reformed Town", role: belief, tags: [holy, poor, print], regions: [country], notice: "The whole town turned to the new preachers, and the bishop's coming." }
  - { text: "The Great Monastery", role: belief, tags: [holy, wealth, land], regions: [country], sizes: [city, great], notice: "Richer than the crown, and the crown's noticed." }
  - { text: "The Mountain Sanctuary", role: belief, tags: [holy, hill], regions: [country], notice: "A miracle every year, and pilgrims paying for each one." }
  - { text: "The Martyrs' Field", role: belief, tags: [holy, war], regions: [country], notice: "The reformers burned here get fresh flowers every week." }
  - { text: "The Seminary", role: belief, tags: [holy, law], regions: [country], notice: "Young priests trained to argue with reformers, and to name them." }
  - { text: "The Summer Palace", role: office, tags: [crown, wealth, debt], regions: [country], sizes: [city, great], notice: "The king's new palace, built on loans the town still holds." }
  - { text: "The Frontier Fortress", role: office, tags: [war, wall, crown, powder], regions: [country], notice: "Five bastions and a garrison, paid three months late." }
  - { text: "The Parliament Town", role: office, tags: [law, land], regions: [country], notice: "The estates meet here to grant the king's taxes, or refuse them." }
  - { text: "The Governor's Residence", role: office, tags: [crown, law, debt], regions: [country], notice: "The governor bought his office, and means to earn it back." }
  - { text: "The Salt Tax House", role: office, tags: [crown, coast], regions: [country], notice: "The province's salt is weighed and taxed here, sack by sack." }
  - { text: "The Medical University", role: knowledge, tags: [plague, old], regions: [country], notice: "Doctors come from everywhere to study, and the anatomy hall's always full." }
  - { text: "The Observatory Island", role: knowledge, tags: [old, coast], regions: [country], notice: "An astronomer's island, and a prince paying for every star." }
  - { text: "The Mapmakers' Town", role: knowledge, tags: [print, foreign], regions: [country], notice: "Maps of every coast, with mistakes kept in on purpose." }
  - { text: "The Engineers' School", role: knowledge, tags: [war, powder], regions: [country], notice: "Officers learn to build forts here, and sell what they learn." }
  - { text: "The Archive Fortress", role: knowledge, tags: [law, old, crown], regions: [country], notice: "Every treaty the crown's signed, and the ones it says it didn't." }
  - { text: "The Recruiting Ground", role: labour, tags: [war, poor, hill], regions: [country], notice: "Younger sons from the hills sign on here, for anyone's war." }
  - { text: "The Spinning Villages", role: labour, tags: [cloth, poor, debt], regions: [country], notice: "Women spin for the merchant, and owe him for the wheel." }
  - { text: "The Boiling Houses", role: labour, tags: [coast, poor], regions: [country], notice: "Salt boiled along the shore by workers who never see the town." }
  - { text: "The Navy Yards", role: labour, tags: [coast, war, crown], regions: [country], notice: "The crown's new fleet, built by carpenters taken from their villages." }
  - { text: "The Dyke Works", role: labour, tags: [marsh, poor], regions: [country], notice: "Every village owes days on the dykes, and the sea keeps count." }
  - { text: "The Brigands' Hills", role: crime, tags: [hill, wild, road], regions: [country], notice: "Every road through the hills pays the brigands, or loses a cart." }
  - { text: "The Uncharted Islands", role: crime, tags: [coast, secret], regions: [country], notice: "Islands nobody's charted, and nobody who lives there wants charting." }
  - { text: "The Deserters' Wood", role: crime, tags: [forest, war], regions: [country], notice: "Soldiers who walked off the last campaign, and kept their guns." }
  - { text: "The Salt Marsh Ways", role: crime, tags: [marsh, secret], regions: [country], notice: "Untaxed salt goes out through the marsh, where the salt men drown." }
  - { text: "The Debtors' Haven", role: crime, tags: [law, debt], regions: [country], notice: "No creditor can touch you here, if you've paid the lord." }
  - { text: "The Prophetess's Cave", role: wonder, tags: [holy, old], regions: [country], rare: true, strange: true, notice: "Every almanac quotes her, and she's been dead fifty years." }
  - { text: "The Field of Columns", role: wonder, tags: [old], regions: [country], notice: "An old empire's temple in a sheep field, and men digging nightly." }
  - { text: "The Witch's Hill", role: wonder, tags: [old, law], regions: [country], rare: true, strange: true, notice: "Grass won't grow where they burned the nine women." }
  - { text: "The Spa", role: wonder, tags: [wealth, plague], regions: [country], notice: "The rich bathe here for their health, and plot their heirs' marriages." }
  - { text: "The Stone Maze", role: wonder, tags: [old], regions: [country], notice: "A maze cut in the hill before any history, and freshly recut." }

  # World: a country, a sea or a mountain range.
  - { text: "The Cape Route", role: passage, tags: [coast, foreign], regions: [world], notice: "Round the cape to the far coasts, if the storms allow." }
  - { text: "The Silver Fleet Lanes", role: passage, tags: [coast, wealth, war], regions: [world], notice: "The treasure ships sail once a year, and every pirate knows when." }
  - { text: "The Contested Strait", role: passage, tags: [coast, war], regions: [world], notice: "Two navies, one channel and a convoy every week." }
  - { text: "The Ice Road", role: passage, tags: [wild, road], regions: [world], notice: "Frozen half the year, and the only way to the fur coast." }
  - { text: "The Trade Winds", role: passage, tags: [coast, foreign], regions: [world], notice: "They carry ships across the ocean in autumn, and home in spring." }
  - { text: "The Clove Isles", role: land, tags: [coast, foreign, wealth], regions: [world], notice: "Cloves grow nowhere else, and every navy wants them." }
  - { text: "The Cattle Plains", role: land, tags: [wild], regions: [world], notice: "Herds without number, and riders who answer to nobody." }
  - { text: "The Wine Countries", role: land, tags: [hill, wealth], regions: [world], notice: "Kings drink it, and two kingdoms claim the best hills." }
  - { text: "The Fur Forests", role: land, tags: [forest, wild, foreign], regions: [world], notice: "Beaver and sable for every hat, and trappers dying for it." }
  - { text: "The Rice Deltas", role: land, tags: [river, grain], regions: [world], notice: "Rice for half the world, and floods that change who owns it." }
  - { text: "The Silver Mountain", role: ground, tags: [mine, wealth, metal], regions: [world], notice: "A whole mountain of silver, paying for everybody's wars." }
  - { text: "The Copper Kingdom", role: ground, tags: [mine, metal, powder], regions: [world], notice: "Copper for every gun in the world, from one king's mines." }
  - { text: "The Saltpetre Deserts", role: ground, tags: [powder, wild], regions: [world], notice: "Powder for every army starts as the crust on these dry lakes." }
  - { text: "The Emerald Mountains", role: ground, tags: [mine, wealth, foreign], regions: [world], notice: "Green stones by the sackful, and a war over every vein." }
  - { text: "The Coal Coast", role: ground, tags: [coast, mine], regions: [world], notice: "The world's glass and iron is fired with coal from one coast." }
  - { text: "The Gun Cities", role: craft, tags: [powder, metal, war], regions: [world], notice: "Three cities cast the cannon for every army in the world." }
  - { text: "The Porcelain Coast", role: craft, tags: [foreign, wealth], regions: [world], notice: "Blue and white plates nobody else knows how to make." }
  - { text: "The Printing Lands", role: craft, tags: [print], regions: [world], notice: "Books for every faith, printed by men who believe none of them." }
  - { text: "The Tapestry Cities", role: craft, tags: [cloth, wealth], regions: [world], notice: "Hangings for every palace, by weavers who've never seen one." }
  - { text: "The Clock Valleys", role: craft, tags: [metal, wealth], regions: [world], notice: "Clocks for every court come from here, and spies with them." }
  - { text: "The Exchange City", role: trade, tags: [wealth, market], regions: [world], notice: "Every bill of exchange in the world gets settled here." }
  - { text: "The Pepper Monopoly", role: trade, tags: [coast, foreign, wealth], regions: [world], notice: "One company sets the price of pepper for the whole world." }
  - { text: "The Warehouse Ports", role: trade, tags: [coast, market], regions: [world], notice: "Goods from everywhere, held in store till the price is right." }
  - { text: "The Indigo Markets", role: trade, tags: [foreign, cloth], regions: [world], notice: "Blue dye by the shipload, and dyers from three countries bidding." }
  - { text: "The Lottery Republic", role: trade, tags: [wealth, poor, law], regions: [world], notice: "A republic run on lotteries, and every citizen holds a ticket." }
  - { text: "The Reformed North", role: belief, tags: [holy, crown, print], regions: [world], notice: "Whole kingdoms left the old church, and burned its abbeys." }
  - { text: "The Old Faith's Heartland", role: belief, tags: [holy, wealth], regions: [world], notice: "The old church's own lands, where reformers hang." }
  - { text: "The Pilgrim Sea", role: belief, tags: [holy, coast], regions: [world], notice: "Pilgrim ships to the holy islands, and pirates waiting for them." }
  - { text: "The Prophets' Desert", role: belief, tags: [holy, wild], regions: [world], notice: "New faiths start out here, each with a man and a vision." }
  - { text: "The Council City", role: belief, tags: [holy, law], regions: [world], notice: "The faith's great council has sat here for eighteen years." }
  - { text: "The Imperial Capital", role: office, tags: [crown, wealth], regions: [world], sizes: [city, great], notice: "A palace of a thousand rooms, and an emperor who uses three." }
  - { text: "The Ambassadors' City", role: office, tags: [crown, foreign, secret], regions: [world], notice: "Envoys from every court, and every one of them's spying." }
  - { text: "The Toll Sea", role: office, tags: [law, coast, crown], regions: [world], notice: "One crown taxes every ship that crosses its sea." }
  - { text: "The Fort Line", role: office, tags: [war, wall, powder], regions: [world], notice: "Star forts a day's march apart, every one owed its pay." }
  - { text: "The Bankrupt Kingdom", role: office, tags: [crown, debt], regions: [world], notice: "The richest crown alive, and bankrupt three times this century." }
  - { text: "The Southern Academies", role: knowledge, tags: [old, wealth], regions: [world], notice: "New ideas start here, and every prince wants them first." }
  - { text: "The Chart House", role: knowledge, tags: [coast, foreign, secret], regions: [world], notice: "The world's best maps in one locked room, and spies copying them." }
  - { text: "The Observatory Peaks", role: knowledge, tags: [old, hill], regions: [world], notice: "Astronomers on the mountaintops, chasing a prize nobody's won." }
  - { text: "The University Republic", role: knowledge, tags: [old, law, print], regions: [world], notice: "Scholars run the city, and they've banned three kings' books." }
  - { text: "The Plague Doctors' College", role: knowledge, tags: [plague], regions: [world], notice: "Every cure for the plague gets tested here, on somebody." }
  - { text: "The Mercenary Cantons", role: labour, tags: [hill, war], regions: [world], notice: "Mountain valleys that send their sons to every war, for pay." }
  - { text: "The Fishing Banks", role: labour, tags: [coast, poor, foreign], regions: [world], notice: "Cod by the shipload, and crews from ten countries fighting for room." }
  - { text: "The Mining Valleys", role: labour, tags: [mine, poor, guild], regions: [world], notice: "Whole valleys working underground, with a miners' guild that votes." }
  - { text: "The Weaving Lowlands", role: labour, tags: [cloth, poor], regions: [world], notice: "Looms in the cottages, and riots whenever the price drops." }
  - { text: "The Press-Gang Ports", role: labour, tags: [coast, war], regions: [world], notice: "Sailors taken from the taverns for the navy, and few come back." }
  - { text: "The Privateer Coast", role: crime, tags: [coast, war], regions: [world], notice: "Pirates with a king's letter, robbing his enemies and his friends." }
  - { text: "The Pirate Republic", role: crime, tags: [coast, secret, law], regions: [world], notice: "Pirates who vote for their captains, and sell to every crown." }
  - { text: "The Counterfeit Kingdom", role: crime, tags: [wealth, secret, metal], regions: [world], notice: "A small crown that pays its debts in other crowns' coin." }
  - { text: "The Wild Frontier", role: crime, tags: [wild, war], regions: [world], notice: "Past the last fort, any man with a gun is the law." }
  - { text: "The Mutineers' Isle", role: crime, tags: [coast, secret], regions: [world], notice: "A crew killed their officers here, and kept the island." }
  - { text: "The Southern Continent", role: wonder, tags: [foreign, old], regions: [world], rare: true, strange: true, notice: "Every map shows it, and no ship's ever come back." }
  - { text: "The Golden City", role: wonder, tags: [old, wealth], regions: [world], rare: true, strange: true, notice: "Every explorer swears it's real, and three came back mad." }
  - { text: "The Great Comet", role: wonder, tags: [old], regions: [world], notice: "It's hung in the sky a whole year, and every prophet's busy." }
  - { text: "The Fountain Isle", role: wonder, tags: [old, foreign], regions: [world], rare: true, strange: true, notice: "An island where old sailors swear they came home young." }
  - { text: "The Giants' Bones", role: wonder, tags: [old, wild], regions: [world], notice: "Bones bigger than ships in the cliffs, and scholars fighting over them." }

