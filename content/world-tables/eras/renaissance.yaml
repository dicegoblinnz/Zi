# The deck's moments of its own: presses and censors, banks and bad debts,
# plague years, painters, duels at court and the new preachers.
deck:
  - text: "The old prince left his library to whoever could read it first. {b} sent their scholars that same night."
    age: 1
    a: [keepers, house, faith, society]
    tags: [old]
    answers:
      - text: "Race them for it"
        does: ["lean a old", "gain asset a", "rival a b"]
        line: "{a} beat {b} to the old prince's library, and kept every book."
      - text: "Share the reading room"
        does: ["lean a law", "gain res a", "ally a b"]
        line: "{a} shared the old prince's library with {b}, shelf by shelf."
  - text: "A printer came to town with a press nobody had seen before, and {b} wanted it smashed."
    age: 1
    a: [makers, traders, family, keepers, society]
    tags: [print]
    answers:
      - text: "Buy the press"
        does: ["lean a print", "gain res a", "grudge b a"]
        tags: [print]
        line: "{a} bought the first press in town, and {b} never forgave the pamphlets."
        then: censor-raid
      - text: "Help smash it"
        does: ["lean a law", "gain asset a", "ally a b"]
        line: "{a} helped {b} break the first press, and kept the type for themselves."
  - text: "The prince's censor came for our press, and someone at {b} had told him where to look."
    key: censor-raid
    chain: true
    age: 2
    answers:
      - text: "Hide the press"
        does: ["lean a secret", "rival a b"]
        line: "{a} hid the press from the censor, and knew who'd talked."
      - text: "Print for the prince"
        does: ["lean a crown", "gain asset a", "strain a b"]
        line: "{a} printed for the prince from then on, and {b} lost their reward."
  - text: "{b} sold copies of our maps as their own, mistakes and all."
    age: 2
    a: [keepers, makers, society]
    tags: [print]
    answers:
      - text: "Shame them in print"
        does: ["lean a print", "rival a b"]
        line: "{a} named {b} as thieves in a pamphlet, with every copied mistake listed."
      - text: "Charge them for it"
        does: ["lean a wealth", "gain res a", "debt b a"]
        line: "{a} made {b} pay for every map they'd copied, for years after."
  - text: "{b} had a cartload of our books burned in the square, and the crowd cheered."
    age: 2
    a: [keepers, society, faith, makers]
    tags: [holy, print]
    answers:
      - text: "Print them again"
        does: ["lean a print", "rival a b"]
        line: "{a} printed every burned book again, and sent {b} the first copy."
      - text: "Lie low"
        does: ["lean a secret", "lose res a", "grudge a b"]
        line: "{a} hid what books were left, and never forgot {b}'s bonfire."
  - text: "The plague took half the town, and {b} sat it out in their country villa."
    age: 1
    a: [faith, family, makers, rebels, office]
    b: [house, traders, family]
    tags: [plague]
    answers:
      - text: "Bury the dead"
        does: ["lean a holy", "gain people a", "grudge a b"]
        tags: [plague]
        line: "{a} stayed and buried the plague dead, and the town remembered who ran."
      - text: "Take their houses"
        does: ["lean a poor", "take res a b", "rival a b"]
        line: "{a} moved into the houses {b} left empty in the plague year."
  - text: "The war was over, and {b}'s mercenaries wanted their pay or the town."
    age: 1
    a: [house, office, traders, family]
    b: [soldiers]
    tags: [war]
    answers:
      - text: "Pay them off"
        does: ["lean a wealth", "lose res a", "favour b a"]
        line: "{a} paid off {b}'s mercenaries, and they settled down as neighbours."
      - text: "Hire them"
        does: ["lean a war", "gain people a", "ally a b"]
        line: "{a} hired {b}'s mercenaries to hold the walls, and paid them for twenty years."
  - text: "A comet hung over {b} for forty nights, and the astrologers swore it meant a fall."
    age: 1
    b: seat
    res: seat
    strange: true
    tags: [old]
    answers:
      - text: "Buy it cheap"
        does: ["lean a wealth", "gain res a", "secret a"]
        line: "{a} bought up {b} while the comet scared everyone else off, and nothing fell."
      - text: "Pay the astrologers"
        does: ["lean a old", "gain asset a", "secret a"]
        line: "{a} paid the astrologers to read the comet their way, and they did."
  - text: "{b} brought a famous painter from abroad for their chapel. He sent word he'd come to us instead, for more."
    age: 1
    a: [house, faith, family, traders, makers]
    b: [house, faith, family, traders]
    tags: [wealth, holy]
    answers:
      - text: "Pay him double"
        does: ["lean a wealth", "gain asset a", "rival a b"]
        prompt: { kind: person, ask: "What was the painter called?" }
        line: "{a} paid {person} double to paint for them instead of {b}."
        then: painter-faces
      - text: "Turn him away"
        does: ["lean a holy", "favour b a"]
        line: "{a} sent the painter back to {b}, and {b} never forgot the kindness."
  - text: "{person} finished our altarpiece, and everyone in town can see {b}'s faces on the sinners."
    key: painter-faces
    chain: true
    age: 2
    answers:
      - text: "Leave it up"
        does: ["rival a b", "lean a wealth"]
        line: "{a} left {person}'s altarpiece up, {b}'s faces among the damned."
      - text: "Paint them out"
        does: ["ally a b", "lose res a"]
        line: "{a} paid {person} to paint {b}'s faces out, and the town laughed anyway."
  - text: "{b} hedged the common for their sheep, and the village came to us with pitchforks and a petition."
    age: 2
    a: [rebels, faith, office, family]
    b: [house, traders, family]
    tags: [cloth, poor, land]
    answers:
      - text: "Tear the hedges down"
        does: ["lean a poor", "gain people a", "rival a b"]
        line: "{a} tore down the hedges {b} planted, and the village followed them."
      - text: "Buy the village off"
        does: ["lean a law", "lose res a", "ally a b"]
        line: "{a} paid the villagers off, and {b} kept the common for their sheep."
  - text: "The prince wanted new bastions on the walls, and {b} offered to pay if they got the gate."
    age: 2
    a: [office, house, soldiers, traders]
    tags: [war, wall, powder]
    answers:
      - text: "Outbid them"
        does: ["lean a war", "gain asset a", "rival a b"]
        line: "{a} paid for the bastions themselves, and kept the gate out of {b}'s hands."
      - text: "Let them have it"
        does: ["lean a crown", "block b a"]
        line: "{a} let {b} pay for the bastions, and paid a toll at their gate ever after."
  - text: "{b}'s clockmaker built a brass man that plays cards. It's never lost, and it cheated our captain."
    age: 2
    strange: true
    tags: [metal, old]
    answers:
      - text: "Smash the thing"
        does: ["rival a b", "secret a"]
        line: "{a} smashed {b}'s brass card-player, and something in it screamed."
      - text: "Buy it"
        does: ["take asset a b", "secret a"]
        line: "{a} bought {b}'s brass card-player, and locked it in the cellar."
  - text: "{b} came to our bench for a loan to fit out three ships for the far side of the world."
    age: 2
    a: [traders, family, house, society]
    b: [traders, family, house, office]
    tags: [debt, coast, foreign]
    needs: [coast]
    answers:
      - text: "Lend at a third"
        does: ["lean a debt", "gain res a", "debt b a"]
        line: "{a} lent {b} the money for three ships, at a third interest."
        then: ships-late
      - text: "Turn them down"
        does: ["lean a wealth", "grudge b a"]
        line: "{a} turned {b} down, and watched them go to another bank."
  - text: "Only one of the three ships came home. {b}'s coffers are empty, and they're saying we sank the others."
    key: ships-late
    chain: true
    age: 3
    answers:
      - text: "Call in the debt"
        does: ["agenda a b", "take res a b"]
        line: "{a} called in the loan, and took what {b} had left."
      - text: "Lend them more"
        does: ["secret a", "agenda b a"]
        line: "{a} lent {b} more to keep them afloat, and hid how much."
  - text: "A pamphlet's going round naming every bribe {b} paid at court. Our press printed it."
    age: 3
    a: [makers, society, rebels, keepers]
    tags: [print, secret]
    answers:
      - text: "Print another run"
        does: ["agenda a b", "secret b"]
        line: "{a} printed a second run of the pamphlet, and sent one to {b}."
      - text: "Sell them the press"
        does: ["secret a b", "agenda b a"]
        line: "{a} sold {b} the press, and kept a copy of the pamphlet."
  - text: "{b}'s heir called our leader a coward at the ball, in front of the whole court."
    age: 3
    a: [house, family, soldiers, traders]
    b: [house, family]
    tags: [blood, crown]
    answers:
      - text: "Send a challenge"
        does: ["agenda a b", "rival a b"]
        thread: "{b} called us cowards in front of the court"
        back: "{b} made a scene at the ball, and we'll answer it"
        line: "{a} challenged {b}'s heir to a duel at dawn."
        then: duel-dawn
      - text: "Laugh it off"
        does: ["secret a", "agenda b a"]
        line: "{a} laughed at the insult, and paid a poisoner to remember it."
  - text: "The duel's at dawn, and {b}'s heir has hired a fencing master to fight in his place."
    key: duel-dawn
    chain: true
    age: 3
    answers:
      - text: "Fight the master"
        does: ["agenda a b", "lean a blood"]
        line: "{a} fought {b}'s hired fencing master at dawn, and won it ugly."
      - text: "Tell the prince"
        does: ["secret b", "agenda a b"]
        line: "{a} told the prince that {b}'s heir sent a stand-in, and watched them fall."
  - text: "{b}'s alchemist swears he'll have gold by midsummer. They've borrowed against it all over town."
    age: 3
    strange: true
    tags: [old, debt]
    answers:
      - text: "Buy their debts"
        does: ["agenda a b", "secret a"]
        line: "{a} bought up {b}'s debts, and waited on their alchemist's gold."
      - text: "Steal the alchemist"
        does: ["secret a", "agenda b a"]
        line: "{a} smuggled {b}'s alchemist out, and gave him a cellar of his own."
  - text: "A ship's in the harbour with fever aboard. {b}'s cargo is in her hold, and the health board doesn't know."
    age: 3
    a: [office, traders, crooks, family]
    tags: [plague, coast]
    needs: [coast]
    answers:
      - text: "Tell the board"
        does: ["agenda b a", "lean a law"]
        line: "{a} told the health board about {b}'s cargo, and the ship was burned."
      - text: "Land it quietly"
        does: ["secret a b", "gain res a"]
        line: "{a} helped land {b}'s cargo by night, and took a share of it."
  - text: "The prince is dying with no heir named, and the cousin in {b}'s house says he's next."
    age: 3
    last: true
    a: [house, office, society, faith, family]
    b: [house, family]
    tags: [crown, blood]
    answers:
      - text: "Back the cousin"
        does: ["ally a b", "secret a"]
        line: "{a} swore for the cousin in {b}'s house, and kept the letters he wrote."
      - text: "Find another heir"
        does: ["agenda a b", "secret a"]
        line: "{a} went looking for an heir of their own, and found one."
  - text: "A preacher's been filling the square every night, and {b}'s own people are listening."
    age: 3
    a: [faith, office, house, rebels]
    tags: [holy, poor, print]
    answers:
      - text: "Protect the preacher"
        does: ["agenda a b", "gain people a"]
        line: "{a} kept the preacher safe, and {b} lost half their flock to the square."
      - text: "Hand him over"
        does: ["ally a b", "secret a"]
        line: "{a} handed the preacher over to {b}, and burned his sermons."
