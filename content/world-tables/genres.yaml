# The eras and twists behind the genres, and the genres the menu names, in
# the menu's order (Mo's first, then the ones made from the same packs). A
# genre deals once its era's pack is in, and its twist's too if it's got one.
# A frame's mix goes in with the last pack it needs.
eras:
  ancient: Ancient
  medieval: Medieval
  renaissance: Renaissance
  industrial: Industrial
  modern: Modern
  near-future: Near future
  far-future: Far future
twists:
  magic: Magic
  steam: Steam
  chrome: Chrome
  ruin: Ruin
  dread: Dread
genres:
  fantasy: { name: Fantasy, era: medieval, twist: magic }
  medieval: { name: Medieval, era: medieval }
  renaissance: { name: Renaissance, era: renaissance }
  modern: { name: Modern, era: modern }
  steampunk: { name: Steampunk, era: industrial, twist: steam }
  cyberpunk: { name: Cyberpunk, era: near-future, twist: chrome }
  futuristic: { name: Futuristic, era: far-future }
  ancient: { name: Ancient, era: ancient }
  mythic: { name: Mythic, era: ancient, twist: magic }
  gothic-horror: { name: Gothic horror, era: industrial, twist: dread }
  urban-fantasy: { name: Urban fantasy, era: modern, twist: magic }
  post-apocalyptic: { name: Post-apocalyptic, era: modern, twist: ruin }
  dark-fantasy: { name: Dark fantasy, era: medieval, twist: dread }
  space-fantasy: { name: Space fantasy, era: far-future, twist: magic }
frames:
  # The book's own world: an archipelago of trade cities, so Country, and
  # magic sits quietly there (Magic in the World), so how strange is 0.
  steeplands: { era: medieval, twist: magic, region: country, dials: { strange: 0 } }
  # Lanternhead and the city under the mountain: a company town.
  deep-company: { era: medieval, twist: magic, region: town }
  # A chain of storm-bitten islands, so Country, and magic's real but rare
  # there (the frame's Characters), so how strange is 0.
  brinewake: { era: renaissance, twist: magic, region: country, dials: { strange: 0 } }
  # A dying queen's court in her capital, so City, and it's tense (Tone and
  # feel). Magic at court's a hanging matter if anyone can prove it, so it's
  # the deniable kind, with no twist.
  gilded-court: { era: renaissance, region: city, dials: { tense: 2 } }
