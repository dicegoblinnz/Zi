# Hidden tags, the way the book's cards write one. One in three names another
# faction, and every one has two ways in.
secrets:
  - { tag: "Spent Its Soul", more: "Its leader's used up every scrap of her soul on spells.", ways: ["She hasn't slept or dreamed in years", "Her face doesn't show in mirrors"], tags: [magic] }
  - { tag: "Every Spell Costs Someone", more: "Its mages never pay for their magic, because their servants do.", ways: ["Servants who age too fast", "Who falls sick after a big spell"], needs: [magic], tags: [magic, poor] }
  - { tag: "{rival}'s Ghost Is Ours", more: "The spirit that whispers to {rival} has always worked for it.", ways: ["{rival}'s séance room", "A second voice under the ghost's"], tags: [magic, old] }
  - { tag: "Cursed {rival}", more: "The bad luck dogging {rival} for years is its doing.", ways: ["A hex-doll under {rival}'s floor", "The witch it paid and never thanked"], tags: [magic, secret] }
  - { tag: "The Cat Decides", more: "Its leader's cat makes every decision, and he just nods.", ways: ["Orders given with nobody else in the room", "A cat at every meeting"], tags: [magic] }
  - { tag: "Made, Not Born", more: "Its leader's a construct, and he doesn't know it.", ways: ["A seam behind his ear", "The workshop that made him"], tags: [magic] }
  - { tag: "Pays the Dragon", more: "It feeds the dragon to burn its enemies' fields.", ways: ["Herds driven up the mountain at night", "Only its rivals ever get burned"], tags: [old], rare: true }
  - { tag: "Stolen from {rival}", more: "Its great spell-book came out of {rival}'s library.", ways: ["{rival}'s mark, scraped off the binding", "The thief, still drinking in town"], tags: [magic, secret] }
  - { tag: "Worked by the Dead", more: "Half its workers died years ago, and they're still at it.", ways: ["They never eat or drink", "The smell in hot weather"], tags: [magic, old] }
  - { tag: "The Guest Downstairs", more: "What it summoned for one job never went home.", ways: ["Scratching under the floor at night", "The summoner who went missing"], tags: [magic, old] }
  - { tag: "Soul Held by {rival}", more: "Its leader's soul is locked in {rival}'s vault.", ways: ["{rival}'s vault-keeper", "Its leader goes pale at {rival}'s name"], tags: [magic, debt] }
  - { tag: "The Ward Faces Inward", more: "The great ward's there to hold something in, and always was.", ways: ["Which way the sigils face", "The first warden's diary"], needs: [magic], tags: [magic, wall] }
  - { tag: "Burned the Old Masters", more: "It set the fire that put it in charge.", ways: ["The one apprentice who got out", "Scorch marks in its founder's old room"], tags: [magic, blood] }
  - { tag: "The Charm's a Fake", more: "Its famous protection's a fake, and it's just been lucky.", ways: ["A ward-maker who checked it", "The one night it failed"], tags: [magic] }
  - { tag: "Taught {rival} Everything", more: "{rival}'s best mage is its runaway apprentice, and owes it.", ways: ["The apprentice's old indenture", "A spell nobody outside it should know"], needs: [magic], tags: [magic] }
  - { tag: "Lead by Spring", more: "Its alchemist's gold turns back to lead within a year.", ways: ["A banker weighing old coins", "Lead where the gold was hoarded"], tags: [magic, wealth], eras: [renaissance] }
  - { tag: "{rival}'s Horoscope", more: "It cast {rival}'s chart, and knows the day their leader dies.", ways: ["The astrologer it paid", "A chart with a date circled"], tags: [magic], eras: [renaissance] }
  - { tag: "A Soul in the Portrait", more: "Its founder's soul is in the portrait in the great hall.", ways: ["Eyes that follow the heir", "Paint that's warm to the touch"], tags: [magic, old, blood], eras: [renaissance] }
  - { tag: "Wards Sold to {rival}", more: "It sold {rival} wards with a way in only it knows.", ways: ["A sigil carved backwards", "The engraver who cut them"], tags: [magic, secret], eras: [renaissance] }

# Each breaks the logic on purpose, with its reason.
exceptions:
  - { text: "It won't cast another spell", when: [magic, society], drops: [wonder, bound-spirit], reason: "because a spell once took its founder's sight" }
  - { text: "It won't raise its own dead", when: [magic, family], drops: [thralls], reason: "because grandmother came back wrong" }
  - { text: "It won't trade in charms any more", when: [magic, traders], drops: [trade], gives: [debt], reason: "because a charm it sold killed a child" }
  - { text: "It won't have a mage in the house", when: [house, magic], drops: [magic], reason: "because its last wizard poisoned the heir" }
  - { text: "It won't heal anyone", when: [faith, magic], drops: [healers], reason: "because its saint asks a price nobody should pay" }
  - { text: "It won't open its books to anyone", when: [keepers, magic], drops: [knowledge], gives: [secret], reason: "because the last reader let something out of one" }
  - { text: "It won't work for the crown", when: [magic, soldiers], drops: [office, crown], reason: "because the crown hanged its first captain as a witch" }
  - { text: "It won't make wards for the council", when: [guild, magic, makers], drops: [office], gives: [debt], reason: "because the council still owes for the last one" }
  - { text: "It won't print a single charm", when: [magic, print], drops: [print], reason: "because a misprinted charm burned its first shop down", eras: [renaissance] }
  - { text: "It won't let an astrologer near its heir", when: [magic, house], drops: [knowledge], reason: "because the last one's prophecy killed the heir's brother", eras: [renaissance] }

