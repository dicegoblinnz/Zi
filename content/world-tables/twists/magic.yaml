# Magic: the twist that makes Medieval into Fantasy (and, once their eras are
# in, Mythic, Urban fantasy and Space fantasy). Everyone knows magic's real
# (Mo's pick, 28 Oct). Wards, charms and healing are trades with shops, guilds
# and licences, and the big magic (rituals, bound souls, summoning and the
# dead) stays behind closed doors. It's people only: monsters, spirits, the
# dead and old things like dragons, but no other peoples. The rows lean on the
# book's own magic: the schools, the five kinds of practitioner in Magic in
# the World, souls that can be spent, and summoning. Every row's strange, so
# the "how strange" dial sets how often they come up, and at the middle dial
# about a faction in three runs on magic. A row tagged magic makes the magic
# rows after it likelier on its card, and one that needs magic only goes to a
# faction whose seat or kind is magic already, so a wool guild doesn't sell
# familiars. Written for Medieval and Renaissance (stage 10): a row that only
# fits one of them says which in eras, like the Renaissance rows at the end of
# each part, where magic's a learned art of academies, printed charms,
# alchemists, court astrologers and winds sold to captains.
fits: [town, city, country, world]
eras: [medieval, renaissance]

seats:
  # Town: a street, a building or a square.
  - { text: "The Warded Bridge", role: passage, tags: [magic, river, road], regions: [town], notice: "Try crossing without paying, and your feet won't move." }
  - { text: "The Witch's Ferry", role: passage, tags: [magic, river], regions: [town], notice: "The ferrywoman takes a penny, or a year off your life." }
  - { text: "The Green Witch's Acre", role: land, tags: [grain, magic], regions: [town], notice: "Three harvests every year from the same strip of ground." }
  - { text: "The Witchstone Pit", role: ground, tags: [magic, mine, stone], regions: [town], notice: "Blue stone that hums whenever someone casts a spell nearby." }
  - { text: "Sigil Street", role: craft, tags: [guild, magic], regions: [town], notice: "A sigil over every door, with a queue outside the busiest shop." }
  - { text: "The Lamp-Maker's", role: craft, tags: [magic], regions: [town], notice: "Lamps in the window that haven't needed oil in years." }
  - { text: "Charm Lane", role: trade, tags: [magic, market], regions: [town], notice: "Charms on strings in every window, and half of them work." }
  - { text: "The Crutch Shrine", role: belief, tags: [holy, magic], regions: [town], notice: "Fifty crutches nailed to the wall, left by people who walked home." }
  - { text: "The Speaking Gallows", role: office, tags: [law, magic], regions: [town], notice: "The hanged get asked who helped them, and they answer." }
  - { text: "The Penny Library", role: knowledge, tags: [magic], regions: [town], notice: "Spell-books lent by the hour, and a man to watch you read." }
  - { text: "The Grey Mill", role: labour, tags: [grain, magic, old], regions: [town], notice: "It grinds from dusk to dawn with the miller fast asleep." }
  - { text: "The Swan's Back Room", role: crime, tags: [magic, secret], regions: [town], notice: "Curses sold by the ounce to buyers who all give false names." }
  - { text: "The Dancing Stones", role: wonder, tags: [magic, old], regions: [town], notice: "They've moved again since last market day." }
  - { text: "The Sealed Shop", role: wonder, tags: [magic, secret], regions: [town, city], notice: "Shut since its owner vanished, though the till still rings up sales." }

  # City: a district, a gate or a hall.
  - { text: "The Lamp Gate", role: passage, tags: [magic, wall], regions: [city], notice: "The gate-lamps burn red for anyone carrying a curse." }
  - { text: "The Tide Stair", role: passage, tags: [coast, magic], regions: [city], notice: "A stair to a jetty that's gone again by morning." }
  - { text: "The Glasshouses", role: land, tags: [magic, wealth], regions: [city], notice: "Peaches in midwinter, grown under glass by a witch's light." }
  - { text: "The Undercroft Seams", role: ground, tags: [magic, mine, stone], regions: [city], notice: "Miners in the cellars, cutting out stone that holds a spell." }
  - { text: "The Spellwrights' Hall", role: craft, tags: [guild, magic], regions: [city], notice: "The guild's mark is on every ward sold in the city." }
  - { text: "The Golem Yards", role: craft, tags: [magic, stone], regions: [city], notice: "Timber stacked by things that don't breathe, while a master shouts names." }
  - { text: "The Bottle Market", role: trade, tags: [magic, market], regions: [city], notice: "Bottles of every colour, tasted first by a man with a twitch." }
  - { text: "The Weather Exchange", role: trade, tags: [coast, magic, market], regions: [city], notice: "Captains bidding for a fair wind, sold corked in a jar." }
  - { text: "The Mending Hall", role: belief, tags: [holy, magic], regions: [city], notice: "The sick go in one door, and most walk out the other." }
  - { text: "The Licensing House", role: office, tags: [law, magic, market], regions: [city], notice: "Every charm-seller in the city queues here for a stamped licence." }
  - { text: "The Court of Truths", role: office, tags: [law, magic], regions: [city], notice: "The seer beside the judge hears every lie in the room." }
  - { text: "The Reading Halls", role: knowledge, tags: [magic], regions: [city], notice: "Students in black hurry past an east wing that won't stop burning." }
  - { text: "The Night Docks", role: labour, tags: [coast, magic, old], regions: [city], notice: "Dead hands unload the night ships for a living master's wage." }
  - { text: "The Burned Quarter", role: crime, tags: [magic, poor], regions: [city], notice: "A mage's mistake burned it black, so the unlicensed moved in." }
  - { text: "The Mirror Hall", role: wonder, tags: [magic, old], regions: [city], notice: "Every mirror shows the room the way it was a year ago." }
  - { text: "The Portrait Gallery", role: wonder, tags: [magic, wealth], regions: [city], notice: "The portraits blink, and the curator says it's the light." }

  # Country: a town, a pass, a forest or a fortress.
  - { text: "The Witchwood Road", role: passage, tags: [forest, magic, road], regions: [country], notice: "The road through the trees goes somewhere new every week." }
  - { text: "The Sigil Pass", role: passage, tags: [hill, magic, road], regions: [country], notice: "A ward stretched across the road, lifted only at the toll-house." }
  - { text: "The Storm Coast", role: passage, tags: [coast, magic], regions: [country], notice: "Ships pay the storm-witches, or they don't get round the point." }
  - { text: "The Charmed Vale", role: land, tags: [grain, magic], regions: [country], notice: "Fields that never flood, with a witch's sign cut in every gatepost." }
  - { text: "The Blue Quarries", role: ground, tags: [hill, magic, mine, stone], regions: [country], notice: "The quarrymen glow faintly after a long day's cutting." }
  - { text: "Brightforge", role: craft, tags: [magic, metal], regions: [country], notice: "Blades that never dull, sold at three times the price." }
  - { text: "The Moonfair", role: trade, tags: [magic, market], regions: [country], notice: "A fair at every full moon, never in the same field twice." }
  - { text: "The Answering Hill", role: belief, tags: [hill, holy, magic], regions: [country], notice: "Pray at the top and you'll get your answer, if you live." }
  - { text: "The Glass Keep", role: office, tags: [crown, magic, war], regions: [country], notice: "A fortress with no gate, though its soldiers come and go anyway." }
  - { text: "Quillmere", role: knowledge, tags: [magic], regions: [country], notice: "Students in every lodging, with landladies who know a spell or two." }
  - { text: "The Bone Fields", role: labour, tags: [magic, old, war], regions: [country], notice: "An old battlefield where a necromancer rents out the dead." }
  - { text: "The Blind Mile", role: crime, tags: [magic, road], regions: [country], notice: "Travellers reach the far end lighter, without ever seeing a thief." }
  - { text: "The Dragon's Fell", role: wonder, tags: [hill, magic, old], regions: [country], notice: "Burned rock for a mile, and sheep left out as rent." }
  - { text: "The Sleeping Wood", role: wonder, tags: [forest, magic, old], regions: [country], notice: "Woodcutters lie down in it for a nap and wake up old." }

  # World: a country, a sea or a mountain range.
  - { text: "The Ember Sea", role: passage, tags: [coast, magic], regions: [world], notice: "Ships cross it under wards, and the wards don't always hold." }
  - { text: "The Spirit Road", role: passage, tags: [magic, old, road], regions: [world], notice: "The dead walk this road too, and they don't give way." }
  - { text: "The Blessed Lands", role: land, tags: [grain, holy, magic], regions: [world], notice: "A whole country that hasn't had a bad harvest in a century." }
  - { text: "The Glass Desert", role: ground, tags: [magic, wild], regions: [world], notice: "Miles of sand fused into glass, sold off by the cartload." }
  - { text: "The Enchanters' Coast", role: craft, tags: [coast, magic], regions: [world], notice: "Every blade and lock made here is enchanted, and priced like it." }
  - { text: "The Charm Ports", role: trade, tags: [coast, magic, market], regions: [world], notice: "Philtres and bottled storms, sold by the crate off the quay." }
  - { text: "The Saints' Kingdom", role: belief, tags: [crown, holy, magic], regions: [world], notice: "The sick cross the world to be touched by its healer-kings." }
  - { text: "The Sigil Empire", role: office, tags: [crown, law, magic], regions: [world], notice: "Every law's written as a ward, and breaking one burns." }
  - { text: "The College Isles", role: knowledge, tags: [coast, magic], regions: [world], notice: "An island for every college, and every college spying on the rest." }
  - { text: "The Clay Kingdom", role: labour, tags: [magic, stone], regions: [world], notice: "Golems work the fields for people who've forgotten how." }
  - { text: "The Drifting Isles", role: crime, tags: [coast, magic], regions: [world], notice: "Pirate islands that won't stay where the maps put them." }
  - { text: "The Dragons' Spine", role: wonder, tags: [hill, magic, old], regions: [world], notice: "Mountains where three dragons sleep, and one's started stirring." }
  - { text: "The Grey Waste", role: wonder, tags: [magic, old, wild], regions: [world], notice: "Where the last great ritual went wrong, nothing's grown back." }

  # Renaissance's own.
  - { text: "The Horoscope Stall", role: knowledge, tags: [magic, market], regions: [town], eras: [renaissance], notice: "Charts cast while you wait, and some of them come true." }
  - { text: "The Weather-Caller's Loft", role: passage, tags: [magic, coast], regions: [town], eras: [renaissance], notice: "Knotted cords on every beam, a fair wind in each knot." }
  - { text: "The Hermetic Academy", role: knowledge, tags: [magic, wealth, old], regions: [city], eras: [renaissance], notice: "Magic taught to princes' sons, and the fees paid in gold." }
  - { text: "The Spell Presses", role: craft, tags: [magic, print], regions: [city], eras: [renaissance], notice: "Charms printed by the thousand, and one sheet in fifty works." }
  - { text: "The Warded Fortress", role: office, tags: [magic, war, wall, crown], regions: [country], eras: [renaissance], notice: "Every bastion's carved with sigils, and the engineer's a mage." }
  - { text: "The Alchemists' Valley", role: craft, tags: [magic, mine, metal], regions: [country], eras: [renaissance], notice: "Furnaces all down the valley, and gold coming out of one." }
  - { text: "The Sold-Wind Sea", role: passage, tags: [magic, coast], regions: [world], eras: [renaissance], notice: "No ship crosses it without buying a wind first." }
  - { text: "The Magi's Empire", role: office, tags: [magic, crown], regions: [world], eras: [renaissance], notice: "An empire ruled by its astrologers, and the emperor's their pupil." }

