# How it came to be: Abnu from the Anunnaki to two nights before the crew
# turn up, an age at a time. What everyone in Abnu agrees happened reads
# first, then what really happened, in order. A line that gives one of the
# canon's five truths away, or the molefolk, is hers.
history:

  # ── Long ago: what everyone agrees
  - age: 1
    text: >-
      Before anyone counted the years, the Seven walked Abnu, and souls reached
      further than they do now.
  - age: 1
    text: Something was fought and sealed in the Sundering, and nobody saw the Seven again.
  - age: 1
    text: >-
      Empires rose and fell through the long middle. The records are poor, and
      historians have blamed fire ever since.
  - age: 1
    text: About 400 years ago the empire nearly fell apart, and nobody's ever agreed why.
  - age: 1
    text: >-
      About 380 years ago Alysta took the throne, ended the wars and abolished
      slavery, the first ruler anywhere to do it.
  - age: 1
    text: A golden age followed, with amulets the fashion and awakening a curiosity.

  # ── Long ago: what happened
  - age: 1
    text: >-
      The Anunnaki opened their eyes in the Cradle, raised cities of impossible
      geometry and passed through the Gates like breathing.
  - age: 1
    text: >-
      The greatest of the Anunnaki died and refused it. She forced her soul into
      someone else's body and kept ruling, and her followers did the same.
  - age: 1
    text: >-
      Abnu's own spirit rose as the Seven to stand against her, and the war over
      what a soul owes the world lasted centuries.
  - age: 1
    hers: true
    text: >-
      One of the Queen's generals beat an Anunnaki master of growth and forced
      him into an orb, and he flung himself into the currents, which carried him
      underground.
  - age: 1
    hers: true
    text: >-
      At the end she pulled the moons out of the sky. The Seven caught nine of
      them and sealed her inside the tenth.
  - age: 1
    hers: true
    text: >-
      Her body died with the meteor she'd made, which came down on the Cradle
      and trapped a coast people inside their mountain.
  - age: 1
    hers: true
    text: >-
      The trapped people found the orb they call Melammu, lived on what grew in
      its light, and over the centuries became molefolk.
  - age: 1
    hers: true
    text: >-
      She battered at the tenth moon for generations, till it broke from its
      course and sank into the Sundering Deep.
  - age: 1
    hers: true
    text: >-
      Thelis carved ten moons into its halls, and raised its children never to
      say what fell into the sea.
  - age: 1
    hers: true
    text: >-
      The Seven brought rebirth back for every soul, and the fallen moon started
      stripping a little memory every time.
  - age: 1
    text: >-
      The souls the crowded Garden couldn't take began coming to Xurux, and the
      city built itself out of the ones who chose to cease.
  - age: 1
    text: >-
      Montia built its temples low and wide with seven doors, and kept the
      seventh shut, because one of the Seven isn't there.
  - age: 1
    text: >-
      The Etweil kept their songs in the cold, eleven verses long, and hummed the
      tenth the way their grandmothers did.
  - age: 1
    hers: true
    text: >-
      Alysta, the soul the Seven set to guide people, was the first to lose his
      memory to rebirth, and an amulet was forged to hold it.
  - age: 1
    hers: true
    text: >-
      Over the centuries Alysta forgot and remembered, banned the Seven's
      worship, buried his amulet and asked that nobody ever find it.
  - age: 1
    text: >-
      Montian pilgrims kept the Seven's texts alive through centuries of quiet
      suppression, copied by hand and carried ship to ship.
  - age: 1
    hers: true
    text: >-
      About 380 years ago a merchant found the buried amulet and gave it to the
      emperor, who was Alysta again, and every life came back to him at once.
  - age: 1
    hers: true
    text: >-
      He rebuilt the empire, never brought back the Seven's worship, and made his
      own weaker amulets the fashion.
  - age: 1
    hers: true
    text: >-
      He signed the Soulless's charter in his own hand to break his curse, and
      they found a way to copy his amulet in others instead.
  - age: 1
    text: >-
      Three centuries ago, scholars running from Alysta's persecution of
      soul-workers founded the Ezkian Union.
  - age: 1
    text: The Soths let a free port stand at Lubro on their coast, and Soth iron went out through it.
  - age: 1
    hers: true
    text: >-
      Two hundred years ago a Rusk boat found a door in the coast mountain, and
      the family's traded with the molefolk in secret ever since.

  # ── In living memory
  - age: 2
    text: >-
      The empire's charity started handing out free amulets in the poorer
      districts, and everyone counted it one of the emperor's kindnesses.
  - age: 2
    hers: true
    text: >-
      The charity's order from Xurux grew every year, off the books and always
      signed A., till a clerk would've called it industrial.
  - age: 2
    text: >-
      The Ninth District got more free amulets a head than anywhere in the
      world, and nobody asked why.
  - age: 2
    text: >-
      Ezkia Prime raised its towers and lit them with gas, and the Union's
      engines started turning in Waslach's foundries.
  - age: 2
    text: >-
      The Council of Nine voted to finish something the Anunnaki left half
      finished, before anyone else could.
  - age: 2
    text: >-
      Soul-workers running from Alysta kept turning up in Ezkia Prime, and the
      Ezkian Union took every one of them in.
  - age: 2
    text: >-
      Old Tekk asked the amulet houses what the etching was for, and Xurux sent
      him out with no mark he's allowed to use.
  - age: 2
    text: The Soths started turning Xurux's amulet carts back at their border.
  - age: 2
    hers: true
    text: >-
      Cobrian children who opened early started going missing from the coast
      towns, a few a year.
  - age: 2
    hers: true
    text: Seven of the Standing Stones' students went south to Alysta and stopped writing.
  - age: 2
    text: A fever took half of Neuzon's east side, and Echily blamed Cobria's forest.
  - age: 2
    hers: true
    text: Echily's council found the fevers started in Neuzon's own wells, and said nothing.
  - age: 2
    text: >-
      The Polythusian Marches kept Echily's towns behind their walls through the
      worst of the fever.
  - age: 2
    text: >-
      Echily started burning the forest's edge back, and Cobria's hunters
      started answering.
  - age: 2
    text: >-
      The Free City of Inkhal fed Montia's eastern holding through a bad winter,
      and Montia's never paid it back.
  - age: 2
    text: >-
      The Marches raised the toll on the northern passes twice, and Inkhal's
      caravans started going through at night.
  - age: 2
    hers: true
    text: A wall-captain of the Marches started selling Inkhal the hours his garrison sleeps.
  - age: 2
    hers: true
    text: >-
      Montian captains started paying Alysta's customs men at Verrant in silver
      to let the books through.
  - age: 2
    text: Alysta's customs cutters started sitting off Lubro's harbour.
  - age: 2
    text: >-
      The Etweilian Tribes brought three Ezkian survey teams out of the Green
      Silence, politely, and never said what happened.
  - age: 2
    text: Thelis started turning ships back from the Sundering Deep.
  - age: 2
    text: Orza's prince closed two of Aron's libraries to Ezkian scholars.
  - age: 2
    text: >-
      The Soths opened a new shaft into the coast mountain for the Ironhand
      Forge, and their miners started finding the tunnels filled back in
      overnight.

  # ── This last year
  - age: 3
    text: Nine moons hung over Abnu, trade moved, and by every account everything was fine.
  - age: 3
    text: >-
      The emperor banned the Seven's worship outright, and the statue of the
      Seven in the capital was left in ruins where everyone has to walk past it.
  - age: 3
    text: >-
      Soul sight became a crime in Alysta, and people went on visiting the
      Drowned Quarter's shrine to the Seven anyway, quietly.
  - age: 3
    text: >-
      Queen Aurea of Montia took up Justice every day after the ban, and Montian
      captains stopped carrying imperial cargo east.
  - age: 3
    text: The Soths watched the ban with real unease, and Queen Signe said nothing at all.
  - age: 3
    hers: true
    text: Queen Signe kept her line's old peace with the Seven, quietly, and told nobody.
  - age: 3
    hers: true
    text: The Order of the Seven met under the emperor's own roof the night after the ban.
  - age: 3
    text: Deepshaft Kel's master started asking questions.
  - age: 3
    hers: true
    text: Every seer in Aron had the same vision in spring, and the prince told nobody what it was.
  - age: 3
    text: >-
      The sea over the Sundering Deep shook harder than anyone remembered, and
      sailors gave it a wider berth.
  - age: 3
    hers: true
    text: Thelis knew why the Deep was shaking, and said nothing.
  - age: 3
    hers: true
    text: The Council of Nine kept the Union's race going by one vote.
  - age: 3
    text: Echily's fire-lines reached the river.
  - age: 3
    text: Xurux's carts started taking the coast road to get round the Soths.
  - age: 3
    text: >-
      The Union's surveyors went back into the Green Silence, and the Etweil
      brought them out again.
  - age: 3
    hers: true
    text: The Soth shaft came within three walls of Melammu's cavern.
  - age: 3
    hers: true
    text: Speaker Sevra of Cobria swore to find whoever was taking its children.
  - age: 3
    text: Two nights before the crew turned up, Merren Vast read a manifest instead of signing it.
