      - text: Donation Requests
        does: >-
          Once a downtime, 6th Street squeezes a district it guards for a
          resource, and calls it a gift.
    agendas:
      - text: Win the Heywood Industrial Zone's contract
        die: 4
        at: ncpd
        then: 6th Street guards every factory in Heywood, and the NCPD's lost another district.
    mor:
      - { text: We fought for this country and it forgot us, kind: bond }
    threads:
      - { to: ncpd, tie: rival, text: The NCPD left these streets long before we came }
      - { to: inquisitors, tie: rival, text: The Inquisitors attack our patrols and call it holy }
      - { to: city-council, kind: bond, text: Big Deal pays well for a quiet district }
    secret:
      tag: Paid to Let It Burn
      more: >-
        6th Street let the Inquisitors and the Toecutters run North Heywood
        till Delvecchio gave it the contract, and pays him every month.
      ways:
        - The Sergeant's payments to Delvecchio
        - An Inquisitor who swears 6th Street left the way clear
    note: >-
      The Sergeant's name is yours to give. Father Kevin at Holy Angels trusts
      6th Street with his church, and he'd be hurt to learn any of this.

