    faceOf: kanzaki-heir
    res:
      - Building Contracts
      - Old Debts
      - Demolition Rights
      - Megabuilding Rents
    people:
      - { text: Demolition Crews, does: "+1 Power. Builders who can clear a block in a day, people included." }
    assets:
      - text: Future BuildWorks
        does: >-
          The family's building company. Once a downtime, start a megabuilding
          somewhere, or knock something down.
      - text: Family Debts
        does: >-
          Half the managers owe the Kanzakis something. Once a session, call
          one in.
      - text: The H6 Site
        does: >-
          Megabuilding H6 in New Westbrook, half-built and theirs, over the
          homes it cleared.
    agendas:
      - text: Clear the Reclamation Zone for building
        die: 6
        at: [los-perros-guardianes, place:reclamation-zone]
        then: Future BuildWorks flattens the Zone's squats, and a megabuilding goes up where they were.
    threads:
      - { to: los-perros-guardianes, tie: rival, text: The Perros guard squats on our land }
      - { to: network-54, tie: debt, text: "Net54 kept H6 off the news, and we paid for that" }
      - { to: city-council, kind: bond, text: The managers sign our plans before they're drawn }
    secret:
      tag: The Family's Broke
      more: >-
        The Kanzakis sank nearly everything into Future BuildWorks in the
        2030s, and if H6 stalls, the family's finished.
      ways:
