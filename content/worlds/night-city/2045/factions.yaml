    assets:
      - text: Neutral Ground
        does: >-
          Anyone who reaches the Afterlife and asks is safe there for the
          night, and whoever's after them stops at the door.
    agendas:
      - text: Bleed Lazarus's clients dry
        die: 4
        at: lazarus
        then: Lazarus's clients stop trusting its gates, and the Afterlife's mercs are the only security that works.
    pub:
      - { text: A drink named after you at the Afterlife means you made it, kind: bond }
    threads:
      - { to: lazarus, tie: rival, text: Lazarus thinks a wall can stop a good merc }
    secret:
      tag: "Johnny's Old Partner"
      more: >-
        Rogue went into Arasaka Tower with Johnny Silverhand in 2023, and she's
        never told anyone what really happened up there.
      ways:
        - The drink named after Johnny
        - Kerry Eurodyne, who knew them both
    note: >-
      Rogue's been the Queen of the Afterlife for years already, and she
      will be in 2077 too. The Willows are her crew, and she's one of them.

  - key: willows
