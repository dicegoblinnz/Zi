    faceOf: inquisitor-preacher
    res:
      - Converts' Money
      - Allowances
    people:
      - { text: True Believers, does: "+1 Power. Teenagers from good families, with bats and gasoline." }
    assets:
      - text: Kids in Every School
        does: >-
          Once a session, the Inquisitors know what any corpzone family's up
          to, from its own children.
    agendas:
      - text: Burn Biotechnica's implant clinics
        die: 4
        at: biotechnica
        then: Biotechnica's clinics are ash, and the corpzone's parents are afraid of their own kids.
    threads:
      - { to: sixth-street, tie: rival, text: 6th Street guards the clinics we mean to burn }
      - { to: biotechnica, kind: hostile, text: Biotechnica puts metal in children }
    secret:
      tag: A Corpzone Daughter
      more: >-
        The Preacher's best recruiter is Symon Featherstonehaugh's daughter,
        and the Charter Hill manager's paying Militech to keep it quiet.
      ways:
        - The manager's daughter at a burning
        - Militech's guard logs at her school
    note: >-
      The Preacher's name is yours to give. The Inquisitors are new and
      growing, and they're not finished.

  - key: voodoo-boys
    kind: gang
    seal: { c: signal, f: wavy }
    size: local
    seat: pacifica
    name: The Voodoo Boys
    about: >-
      Haitian netrunners in Pacifica, keeping to themselves and their own
      ends. It works through the Net, the Pool and secrets. It sits in
      Pacifica.
    want: The Voodoo Boys find what's left of the old Net, before anyone else does.
    face: >-
      The Voodoo Boys' Houngan, a runner who speaks softly and never stands
      near a window.
    faceOf: voodoo-boys-houngan
    res:
      - Netrunning Jobs
      - Hacked Accounts
      - Pacifica Rackets
    people:
      - { text: Netrunners, does: "+1 Power. Runners who can reach any system in the city that's on the Pool." }
      - { text: Pacifica Watchers, does: "+1 Power. Kids on every corner who see everything in Pacifica." }
    assets:
      - text: Ghost Accounts
        does: >-
          Once a session, the Voodoo Boys can move money, or a record, so
          nobody can find where it went.
    agendas:
      - text: Push the Piranhas out of Pacifica
        die: 4
        at: piranhas
        then: Pacifica's the Voodoo Boys' alone, Playland and all.
    threads:
      - { to: piranhas, tie: rival, text: The Piranhas want Pacifica and know nothing about it }
      - { to: ziggurat, kind: hostile, text: Ziggurat's Mind watches the Pool and we watch it back }
    secret:
      tag: Something in the Old Net
      more: >-
        The Voodoo Boys found something in the dead old Net that talks back,
        and they're bringing it to the Pool through Ziggurat's Mind.
      ways:
        - A runner who came out of a dive shaking
        - A dead line on the Pool that answers at midnight
      strange: true
    note: >-
      The Houngan's name is yours to give. In 2077 the Voodoo Boys are still
      chasing what's in the old Net.

  - key: piranhas
    kind: gang
    seal: { c: wave, f: plain }
    size: small
    seat: pacifica
    name: The Piranhas
    about: >-
      A beach gang in Pacifica Playground, loud and hungry, in a cold war
      with the Voodoo Boys. It works through raids and the fairground's
      rackets. It sits in Pacifica.
    want: Pacifica Playground belongs to the Piranhas.
    face: >-
      The Piranhas' Boss, a teenager with sharpened teeth and a lot of
      friends.
    faceOf: piranhas-boss
    res:
      - Fairground Rackets
      - Beach Raids
    people:
      - { text: The Shoal, does: "+1 Power. Dozens of kids who swarm whatever the Boss points at." }
    assets:
      - text: Playland's Back Gates
        does: >-
          The Piranhas know every way into Playland by the Sea. Once a session,
          get in or out unseen.
    agendas:
      - text: Raid the Jodes' camp
        die: 4
        at: jodes
        then: The Piranhas have the Jodes' food and fuel, and the nomads are leaving.
    threads:
      - { to: voodoo-boys, tie: rival, text: The Voodoo Boys think they own the beach }
      - { to: jodes, tie: rival, text: The Jodes' camp is full of food and nobody guarding it }
    secret:
      tag: Elliot Kane's Gang
      more: >-
        Pacifica's manager, Elliot Kane, pays the Piranhas to scare off anyone
        bidding against Playland's owners.
      ways:
        - Kane's car outside a Piranhas party
        - A bidder who was scared off and wants to talk
    note: >-
      The Boss's name is yours to give. Playland by the Sea reopened in 2036,
      and it's the only fun in Pacifica.

  - key: el-norte-cartel
    kind: gang
    seal: { c: serpent, f: plain }
    size: local
    seat: santo-domingo
    name: The El Norte Cartel
    about: >-
      A cartel from the south, trying out its business in Night City and
