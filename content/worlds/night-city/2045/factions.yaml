  - key: jodes
    kind: nomad
    seal: { c: tree, f: plain }
    size: local
    seat: the-jodes-camp
    name: The Jodes
    about: >-
      A nomad family of farmers, camped in Pacifica since 2041. It works
      through crops, trade and stubbornness. It sits in the Jodes' Camp.
    want: The Jodes grow enough to feed Pacifica, and stay.
    face: >-
      The Jodes' Matriarch, who's buried two husbands and every crop that ever
      failed her.
    faceOf: jodes-matriarch
    res:
      - Crops
      - Trade
      - Tools
    people:
      - { text: Farmhands, does: "+1 Power. Every Jode can drive, shoot and plant." }
      - { text: Camp Guards, does: "+1 Power. The ones watching the fence at night." }
    assets:
      - text: The Fields
        does: >-
          Rooftop and lot farms across Pacifica. Once a downtime, feed a
          district, or let it go hungry.
    agendas:
      - text: Buy the lots round the camp
        die: 4
        at: place:pacifica
        then: The Jodes own their ground, and nobody can move them on.
    threads:
      - { to: piranhas, tie: rival, text: The Piranhas raid our fields at night }
      - { to: los-perros-guardianes, tie: ally, text: The Perros pay fair for our food }
      - { to: aldecaldos, kind: bond, text: "The Aldecaldos are cousins, near enough" }
    secret:
      tag: Biotechnica's Seed
      more: >-
        The Jodes' crops grow from Biotechnica seed they stole, and Biotechnica
        can kill every field with one signal.
      ways:
        - A Biotechnica mark on a seed sack
        - A crop that wilts the day Biotechnica's agronomists visit
    note: >-
      The Matriarch's name is yours to give. The Jodes are the best food in
      Pacifica, and they'll feed the crew for news.

  # ── The fixers

