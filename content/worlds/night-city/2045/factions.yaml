    res:
      - North Heywood Contract
      - Donations
      - Church Contracts
      - Veterans' Pensions
    people:
      - { text: Street Patrols, does: "+1 Power. Veterans in old uniforms who walk the blocks they guard." }
      - { text: The Reserve, does: "+1 Power. Ex-soldiers who'll pick up a rifle when they're called." }
    assets:
      - text: Holy Angels
        does: >-
          6th Street guards Holy Angels Church and Father Kevin. Anyone they
