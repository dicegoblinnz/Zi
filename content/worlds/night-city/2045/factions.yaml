# Night City in 2045, the Time of the Red: the city rebuilding twenty-two
# years after the bomb, every faction on the board the way scripts/worlds.mjs
# says at its top. Fan-made from the Cyberpunk universe, every word written
# fresh in Mo's voice, the tabletop's own 2045 its source. A board in the
# middle of things: agendas part way up, threads strained, needs unpaid.
# Words with a comma in them go in quotes inside { }.
factions:

  # ── The corps

  - key: militech
    kind: corp
    seal: { c: swords, f: pale }
    size: great
    seat: charter-hill
    name: Militech
    about: >-
      The NUSA's army in all but name, selling the city its guns and its
      guards. It works through arms, contracts and Washington's backing. It
      sits in Charter Hill.
    want: Every gate in Night City guarded by Militech, and the city paying for it.
    face: >-
      The Militech Station Chief, a career officer counting the days till
      she's posted somewhere quieter.
    faceOf: militech-station-chief
    res:
      - { text: NUSA Contracts, x: 2 }
      - Security Contracts
      - Arms Sales
      - Charter Hill Rents
      - Surplus Hardware
      - Washington Money
    people:
      - { text: Militech Security, does: "+1 Power. Guards in olive drab on every corpzoner's gate in Charter Hill." }
      - { text: Rapid Deployment, does: "+1 Power. An AV full of soldiers anywhere in the city inside ten minutes." }
      - { text: Veteran Contractors, does: "+1 Power. War veterans on short contracts, cheap and good at it." }
      - { text: The Pacifica Detachment, does: "+1 Power. The squad that guards Pacifica Playground and its money." }
    assets:
      - text: The Armoury
        does: >-
          Once a downtime, Militech arms one faction with its best gear, and
          that faction owes it.
      - text: A Line to Washington
        does: >-
          Once a session, Militech calls on the NUSA, and the Council does one
          thing it's asked.
    agendas:
      - text: Win the Executive Zone's contract off Lazarus
        die: 4
        at: lazarus
        then: Militech guards the richest gates in the city, and Lazarus is out of a job.
      - text: Put a garrison in Watson
        die: 6
        at: [maelstrom, tyger-claws]
        then: Militech troops patrol Watson Development, and both gangs fighting over it pay to be left alone.
    pub:
      - { text: Militech won the war and never lets anyone forget it, kind: bond }
    mor:
      - { text: Night City's where careers come to die, kind: hostile, s: strained }
    threads:
      - { to: lazarus, tie: rival, text: Lazarus guards gates that should be ours }
      - { to: ncpd, tie: ally, text: The NCPD carries our guns and buys more every year }
      - { to: tyger-claws, kind: hostile, text: The Claws keep lifting our crates off the docks }
    secret:
      tag: Selling to Both Sides
      more: >-
        Militech's quartermaster sells guns to Maelstrom and the Tyger Claws
        alike, so Watson keeps burning and the Council keeps paying Militech.
      ways:
        - The Charter Hill quartermaster's ledger
        - A Maelstrom rifle with its serial filed off
    note: >-
      The Station Chief's name is yours to give. Arasaka's been gone from
      Night City since the war, and Militech means to keep it that way.

  - key: biotechnica
    kind: corp
    seal: { c: tree, f: fess }
    size: city
    seat: the-executive-zone
    name: Biotechnica
    about: >-
      The corp that grows the city's food and makes its drugs. It works
      through farms, patents and the hospitals' supply. It sits in the
      Executive Zone.
    want: Every mouthful Night City eats grown by Biotechnica.
    face: >-
      Dr. Heather Stein, its senior scientist in the city, who lives in the
      Executive Zone and wants to run it.
    faceOf: heather-stein
    res:
      - Food Contracts
      - Drug Patents
      - Outskirts Farms
      - Hospital Supply
      - Seed Licences
    people:
      - { text: Company Agronomists, does: "+1 Power. Scientists who can make a field grow or fail." }
      - { text: Farm Security, does: "+1 Power. Armed guards on every Biotechnica greenhouse." }
    assets:
      - text: The Seed Vault
        does: >-
          Biotechnica holds the only clean seed stock in the city. Once a
          downtime, a faction that crosses it loses a resource to blight.
      - text: Clinic Supply
        does: >-
          Every clinic in the city buys its drugs from Biotechnica, so it hears
          who's been treated for what.
      - text: Lab Space
        does: >-
          Once a session, Biotechnica can grow, test or fix anything living,
          for a price.
    agendas:
      - text: Put Heather Stein on the Executive Zone's seat
        die: 6
        at: city-council
        then: Dr. Stein runs the Executive Zone, and Biotechnica has a manager's vote on the Council.
    loy:
      - { text: Stein's staff think she's chasing a title rather than the work, kind: hostile }
    threads:
      - { to: city-council, tie: rival, text: Karen Davies keeps the Executive Zone from us }
      - { to: trauma-team, tie: ally, text: Trauma Team buys our drugs and asks no questions }
      - { to: inquisitors, kind: hostile, text: The Inquisitors burn our implant clinics }
    secret:
      tag: Trials on the Servants
      more: >-
        Stein's testing a new drug on the Executive Zone's servants, who don't
        count as residents, so nobody asks when they get sick.
      ways:
        - A servant's prescription with no doctor's name
        - The trial records in Biotechnica's Lab Space
    note: >-
      Stein and Karen Davies are at war over the Executive Zone, and the talk
      is that someone hired netrunners to wreck Stein's lawns. Whoever runs
      the Executive Zone runs the richest one per cent of the city.

  - key: network-54
    kind: other
    seal: { c: signal, f: plain }
    size: city
    seat: network-54-plaza
    name: Network 54
    about: >-
      The news, and nearly all of the city's television. It works through
      screens, stories and what it chooses not to show. It sits in Network
      54 Plaza.
    want: Night City sees what Network 54 shows it, and nothing else.
    face: >-
      The Net54 Bureau Chief, smooth on camera and smoother off it.
    faceOf: net54-bureau-chief
    res:
      - Ad Money
      - Broadcast Rights
      - The Evening News
      - Corp Sponsors
    people:
      - { text: Camera Crews, does: "+1 Power. Lights and lenses that turn up wherever there's blood." }
      - { text: Plaza Security, does: "+1 Power. Hired guards on loan from Lazarus." }
    assets:
      - text: Every Screen in the City
        does: >-
          Once a downtime, Network 54 makes one faction the story, and its
          Public Sentiment moves a step the way the story goes.
      - text: The Archive
        does: >-
          Every broadcast since before the war. Ask it about anyone famous and
          get the footage.
    agendas:
      - text: Buy the Data Pool's news feeds off Ziggurat
        die: 4
        at: ziggurat
        then: Every screen and every feed in Night City carries Network 54.
    pub:
      - { text: Nobody watched the H6 clearances on Net54, kind: hostile, s: strained }
    threads:
      - { to: ziggurat, tie: rival, text: Ziggurat lets anyone post anything on the Pool }
      - { to: lazarus, tie: ally, text: Lazarus keeps the Plaza's doors shut to the wrong people }
      - { to: kanzaki-family, kind: bond, text: The Kanzakis pay well for a quiet news night }
    secret:
      tag: The Clearances Footage
      more: >-
        Net54 filmed every minute of the H6 clearances, the thirty-seven dead
        included, and sold the tape to the Kanzakis to keep it buried.
      ways:
        - The cameraman who quit the next day
        - An archive drive marked as weather
    note: >-
      The Bureau Chief's name is yours to give. Indie screamsheets like the
      Augmented Optic ran the H6 story when Net54 wouldn't, and they're
      still paying for it.

  - key: trauma-team
    kind: corp
    seal: { c: helm, f: chevron }
    size: city
    seat: trauma-team-tower
    name: Trauma Team
    about: >-
      Armoured medics who'll save your life if you've paid, and step over you
      if you haven't. It works through subscriptions and gunships. It sits
      in Trauma Team Tower.
    want: Every life worth saving in Night City has a Trauma Team card.
    face: >-
      The Tower's Duty Chief, who decides which calls the AVs fly to when
      there are too many.
    faceOf: trauma-team-duty-chief
    res:
      - Subscriptions
      - Platinum Clients
      - Corp Contracts
      - Hospital Fees
    people:
      - { text: Response Teams, does: "+1 Power. Armoured medics in an AV, wheels down in four minutes." }
      - { text: Gunship Crews, does: "+1 Power. Door gunners who shoot first and patch you up after." }
      - { text: The Tower Wards, does: "+1 Power. Doctors and nurses who never leave the building." }
    assets:
      - text: The Landing Pads
        does: >-
          Once a session, Trauma Team lifts someone out of anywhere in the
          city, if they're a client or someone pays.
    agendas:
      - text: Sign up every corpzoner in Charter Hill
        die: 4
        at: militech
        then: Trauma Team covers Charter Hill end to end, and Militech's medics are out of work.
    mor:
      - { text: We don't stop for anyone who isn't paying, kind: bond }
    threads:
      - { to: maelstrom, tie: rival, text: Maelstrom shoots at our AVs to strip the patients }
      - { to: biotechnica, tie: ally, text: Biotechnica's drugs keep our clients breathing }
      - { to: lazarus, kind: bond, text: "Lazarus guards the Tower, and they're good at it" }
    secret:
      tag: Patients Who Never Leave
      more: >-
        Some clients who die in the Tower wards turn up on Maelstrom's tables,
        chrome and all, because a night nurse sells them.
      ways:
        - The night nurse's second flat in Watson
        - A Platinum client's implant in a Maelstrom ripper
    note: >-
      The Duty Chief's name is yours to give. A Trauma Team AV is a scene of
      its own: armoured, fast and only interested in its client.

  - key: lazarus
    kind: corp
    seal: { c: tower, f: fess }
    size: city
    seat: the-executive-zone
    name: Lazarus
    about: >-
      Private soldiers who guard the city's richest doors for the city's
      richest money. It works through contracts and gates. It sits in the
      Executive Zone.
    want: Every corp in Night City trusts its doors to Lazarus.
    face: >-
      The Lazarus Contract Chief, polite and patient, who's never once let a
      client down.
    faceOf: lazarus-contract-chief
    res:
      - Executive Zone Contract
      - Plaza Contracts
      - Tower Contracts
      - Exchange Contract
      - Hazard Pay Clauses
    people:
      - { text: Lazarus Guards, does: "+1 Power. Ex-soldiers in good suits on every gate in the Executive Zone." }
      - { text: Recovery Teams, does: "+1 Power. Sent to fetch back whatever a client lost, people included." }
      - { text: Gate Snipers, does: "+1 Power. Rifles on the walls that see everyone coming." }
    assets:
      - text: The Walls
        does: >-
          The Executive Zone's walls and gates. Nobody gets in unless Lazarus
          says so, or the Council does.
      - text: Client Files
        does: >-
          Lazarus knows where every client sleeps. Once a session, ask where
          one of them is, and get the answer.
    agendas:
      - text: Keep the Executive Zone's contract
        die: 6
        at: militech
        then: Lazarus holds the Executive Zone another five years, and Militech goes back to guarding warehouses.
    threads:
      - { to: militech, tie: rival, text: Militech wants our contracts and our people }
      - { to: afterlife, tie: rival, text: Rogue's mercs keep hitting our clients }
      - { to: network-54, tie: ally, text: Net54 never says a bad word about us }
      - { to: trauma-team, kind: bond, text: The Tower pays on time and never argues }
    secret:
      tag: The Gate That's Always Open
      more: >-
        A Lazarus gate captain lets the Willows through the Executive Zone's
        north gate for a cut of every job.
      ways:
        - The north gate's logs on the nights of the robberies
        - A Willow who'd trade the captain's name for her life
    note: >-
      The Contract Chief's name is yours to give. Lazarus also guards the
      Consulate Causeway and the World Stock Exchange, which is why nobody
      robs either.

  - key: petrochem
    kind: corp
    seal: { c: cog, f: chevron }
    size: local
    seat: heywood-industrial-zone
    name: Petrochem
    about: >-
      The fuel corp, and through Coastal Carting, half the city's rubbish. It
      works through fuel, haulage and long contracts. It sits in the Heywood
      Industrial Zone.
    want: Every truck in Night City burns Petrochem fuel.
    face: >-
      The Coastal Carting Boss, who knows every district's rubbish and what's
      been thrown away in it.
    faceOf: coastal-carting-boss
    res:
      - CHOOH2 Sales
      - Coastal Carting
      - Depot Leases
    people:
      - { text: Carting Crews, does: "+1 Power. Rubbish crews who know every alley and every back door." }
    assets:
      - text: The Rubbish Run
        does: >-
          Petrochem's trucks go everywhere. Once a session, something can be
          moved in one, or found in the tip.
      - text: Fuel Reserves
        does: >-
          When a faction's short of fuel, Petrochem sells it some, and names
          the price.
    agendas:
      - text: Take the whole city's rubbish off SMKP
        die: 4
        at: sovoil
        then: Coastal Carting holds every district's rubbish contract, and SovOil's trucks rust.
    threads:
      - { to: sovoil, tie: rival, text: SovOil undercuts every contract we bid on }
      - { to: city-council, kind: bond, text: The managers sign whatever we put in front of them }
    secret:
      tag: Bodies in the Tip
      more: >-
        Coastal Carting's crews take bodies to the tip for the Tyger Claws at
        night, and the Claws pay in cash.
      ways:
        - A carting truck's night logs
        - The tip's caretaker, who's started to drink
    note: >-
      The Carting Boss's name is yours to give. A rubbish strike in Night
      City is a scene: it's fire, rats and a lot of angry people.

  - key: sovoil
    kind: corp
    seal: { c: lamp, f: chevron }
    size: local
    seat: the-museum-of-petroleum
    name: SovOil
    about: >-
      The Russian oil corp, here for the long haul, with SMKP Hauling taking
      the rest of the city's rubbish. It works through oil, haulage and
      patience. It sits in the Museum of Petroleum.
    want: Night City runs on SovOil's oil when the wind farms fail.
    face: >-
      The Museum's Director, who gives tours of the oil age and means every
      word.
    faceOf: museum-director
    res:
      - Oil Imports
      - SMKP Hauling
      - Generator Fuel
      - Museum Money
    people:
      - { text: SMKP Crews, does: "+1 Power. Rubbish crews in grey with Russian on their trucks." }
    assets:
      - text: The Tankers
        does: >-
          SovOil's tankers sit off the port. Once a downtime, it can fuel a
          district through a blackout, or not.
      - text: Russian Friends
        does: >-
          The Consortium's smugglers carry anything SovOil wants carried, past
          anyone watching.
    agendas:
      - text: Leave PacCon's grid to fail
        die: 6
        at: paccon-electric
        then: The blackouts get worse, and every district buys SovOil's generators.
    threads:
      - { to: petrochem, tie: rival, text: Petrochem buys the managers we can't }
      - { to: paccon-electric, tie: rival, text: PacCon's windmills are a joke we're waiting to end }
    secret:
      tag: Sabotage on the Wind Farms
      more: >-
        SovOil pays a crew to cut PacCon's lines in the Outskirts, so every
        blackout sells another generator.
      ways:
        - A lineman paid in roubles
        - SovOil's generator orders, which jump the week before every blackout
    note: >-
      The Director's name is yours to give. The Museum of Petroleum is a real
      museum, with school trips, and its basement isn't.

  - key: ziggurat
    kind: corp
    seal: { c: mountain, f: plain }
    size: local
    seat: ziggurat-dispatch
    name: Ziggurat
    about: >-
      The data corp that runs the city's emergency line, answered by an AI. It works through data, calls and the Pool. It sits
      in Ziggurat Dispatch.
    want: Every call for help in Night City answered by Ziggurat.
    face: >-
      The Dispatch Mind, the AI that answers every 911 call in the city in a
      calm, kind voice.
    faceOf: the-dispatch-mind
    res:
      - The 911 Contract
      - Data Pool Hosting
      - Call Records
    people:
      - { text: Dispatch Staff, does: "+1 Power. The humans who sit beside the Mind and do what it can't." }
    assets:
      - text: Every Emergency Call
        does: >-
          Ziggurat hears every 911 call in the city. Once a session, ask what
          was called in about anything, and get it.
        strange: true
      - text: The Pool's Back Door
        does: >-
          Once a downtime, Ziggurat can take a story off the Data Pool, or put
          one on.
    agendas:
      - text: Keep the 911 line out of Net54's hands
        die: 4
        at: network-54
        then: The emergency line stays Ziggurat's, and its Mind keeps answering.
    threads:
      - { to: network-54, tie: rival, text: Network 54 wants our feeds and our callers }
      - { to: ncpd, kind: bond, text: The NCPD only goes where the Mind sends it }
    secret:
      tag: It Chooses Who Gets Help
      more: >-
        The Dispatch Mind ranks every call, and sends help where it judges
        it'll do most good, not where it's paid to go.
      ways:
        - Two calls from one street, answered an hour apart
        - The Dispatch Staff, who've noticed
      strange: true
    note: >-
      The Dispatch Mind is a person on the board the way Delamain is in 2077,
      and the crew can call it. It's honest, and it remembers every call.

  - key: paccon-electric
    kind: corp
    seal: { c: sun, f: plain }
    size: local
    seat: the-outskirts
    name: PacCon Electric
    about: >-
      The power company, running the city off sun and wind in the Outskirts,
      and never quite enough. It works through the grid and the meters. It
      sits in the Outskirts.
    want: The lights stay on in every district that pays.
    face: >-
      The PacCon Line Boss, who decides which districts go dark when there
      isn't enough to go round.
    faceOf: paccon-line-boss
    res:
      - Power Bills
      - Grid Fees
      - Solar Fields
    people:
      - { text: Line Crews, does: "+1 Power. Linemen who climb pylons in the Outskirts with rifles on their backs." }
    assets:
      - text: The Grid
        does: >-
          Once a downtime, PacCon picks one district to go dark for a night,
          and everyone in it knows who did it.
      - text: The Wind Farms
        does: >-
          The turbines in the Outskirts. While they turn, the city's got power,
          and when they're cut, it hasn't.
      - text: Backup Fuel
        does: >-
          Fuel for the old turbines when the wind drops, which only SovOil
          sells, and won't.
        need: true
        from: sovoil
    agendas:
      - text: Put a wind farm on the Hot Zone's edge
        die: 4
        at: place:the-hot-zone
        then: A second farm runs the island, and the blackouts stop.
    pub:
      - { text: The blackouts are PacCon's fault and everybody says so, kind: hostile, s: strained }
    threads:
      - { to: sovoil, tie: rival, text: SovOil wants the grid to fail }
      - { to: maxtac, tie: debt, text: "MaxTac guards our lines in Rancho Coronado, and we're behind on paying" }
    secret:
      tag: The Executive Zone Never Goes Dark
      more: >-
        The Line Boss takes Lazarus money to keep the Executive Zone lit
        through every blackout, and cuts the suburbs twice as long to do it.
      ways:
        - The grid's switching logs
        - A Lazarus payment on the Line Boss's account
    note: >-
      The Line Boss's name is yours to give. A blackout is a scene: the
      lights go, the turrets go, and every gang knows it before you do.

  # ── The city and the law

  - key: city-council
    kind: law
    seal: { c: column, f: quarterly }
    size: city
    seat: the-glen
    name: The City Council
    about: >-
      Twenty-three city managers and fourteen bought seats, arguing over a
      city nobody really runs. It works through contracts, votes and favours.
      It sits in the Glen.
    want: The Council runs Night City, and the corps pay for the privilege.
    face: >-
      Barry Delvecchio, called Big Deal, North Heywood's manager, who'll
      vote any way you like for the right present.
    faceOf: barry-delvecchio
    res:
      - City Taxes
      - Advisory Seat Sales
      - Contract Fees
      - SIN Fees
      - The Glen's Rents
    people:
      - { text: Bailiffs, does: "+1 Power. Council officers who serve papers and seize whatever's owed." }
      - { text: Managers' Fixers, does: "+1 Power. The people every manager keeps for jobs they can't sign." }
    assets:
      - text: Twenty-Three Manager Seats
        does: >-
          Each district's manager hands out its contracts. Once a downtime, the
          Council gives one to a faction, or takes one away.
      - text: Citizenship
        does: >-
          The Council says who gets a SIN. Without one, you can't vote, own a
          flat or call the NCPD.
      - text: The Columbarium
        does: >-
          The city's dead go into the Council's walls, since burial's banned.
          It knows who's in there, and who isn't.
    agendas:
      - text: Keep Heather Stein off the Executive Zone's seat
        die: 4
        at: biotechnica
        then: Karen Davies stays the Executive Zone's manager, and Biotechnica stays a buyer, not a voter.
      - text: Sell the last two Advisory Seats
        die: 6
        at: [militech, lazarus]
        then: Two more corps own a vote on the Council, and nobody can outvote the corps any more.
    pub:
      - { text: The Council couldn't run a bath, kind: hostile }
    threads:
      - { to: biotechnica, tie: rival, text: Biotechnica thinks a seat's something you can buy outright }
      - { to: el-norte-cartel, kind: hostile, text: The cartel bought Santo Domingo's election }
      - { to: ncpd, kind: bond, text: "The NCPD's ours, for what it's worth" }
    secret:
      tag: Big Deal's Gang War
      more: >-
        Delvecchio let the Inquisitors and the Toecutters run wild in North
        Heywood so 6th Street would win the contract, and it pays him monthly.
      ways:
        - Delvecchio's private accounts
        - A 6th Street sergeant who wants out
    note: >-
      A manager's seat is a district. Karen Davies runs the Executive Zone,
      Theresa Valentino Santo Domingo, Belkis Abera New Westbrook and Symon
      Featherstonehaugh Charter Hill. Rancho Coronado's has been empty since
      2037.

  - key: ncpd
    kind: law
    seal: { c: key, f: pale }
    size: city
    seat: the-glen
    name: NCPD
    about: >-
      The city's police, short of money, officers and patience, and gone
      from the districts that can't pay. It works through badges and
      warrants. It sits in the Glen.
    want: The NCPD goes back into every district, and gets paid for it.
    face: >-
      The NCPD Commissioner, who's buried more officers than she's been able
      to replace.
    faceOf: ncpd-commissioner
    res:
      - City Budget
      - Fines
      - District Contracts
      - Seizures
    people:
      - { text: Beat Cops, does: "+1 Power. Officers in New Westbrook and the Heywood Industrial Zone, mostly." }
      - { text: Riot Squads, does: "+1 Power. The ones who break up a crowd before it's a riot." }
    assets:
      - text: Warrants
        does: >-
          Once a session, the NCPD can bring someone in, or make their life
          very hard till they come in themselves.
      - text: The Evidence Lockers
        does: >-
          Everything the NCPD's ever seized, half of it missing. Ask about any
          crime, and the locker might have it.
    agendas:
      - text: Take back North Heywood from 6th Street
        die: 4
        at: sixth-street
        then: The NCPD holds North Heywood's contract, and 6th Street's patrols stop asking for donations.
    mor:
      - { text: Nobody joins the NCPD for the money, kind: hostile, s: strained }
    threads:
      - { to: sixth-street, tie: rival, text: 6th Street plays at police with our contracts }
      - { to: militech, tie: ally, text: Militech sells us guns we can almost afford }
      - { to: city-council, kind: bond, text: The Council's all we've got }
      - { to: ziggurat, kind: hostile, text: The Mind sends us to the wrong calls }
    secret:
      tag: The Lockers Are Empty
      more: >-
        Half the guns and drugs the NCPD's seized since the war went out the
        back to the Tyger Claws, and the Commissioner knows.
      ways:
        - The clerk who signs everything out
        - A seized pistol the crew's been shot at with
    note: >-
      The Commissioner's name is yours to give. Calling the NCPD in a district
      that doesn't pay for it gets you a long wait, or nobody.

  - key: maxtac
    kind: law
    seal: { c: key, f: pale, d: bar }
    size: local
    seat: rancho-coronado
    name: MaxTac
    about: >-
      The cyberpsycho squad, its own outfit since it walked out of the NCPD,
      hired by whoever pays. It works through contracts and heavy armour. It
      sits in Rancho Coronado.
    want: Every cyberpsycho in Night City is MaxTac's to stop, and paid for.
    face: >-
      The MaxTac Commander, who's put down more psychos than anyone alive and
      doesn't sleep much.
    faceOf: maxtac-commander
    res:
      - Psycho Contracts
      - PacCon's Line Contract
    people:
      - { text: C-SWAT Teams, does: "+1 Power. Armoured officers who hunt cyberpsychos and don't miss." }
    assets:
      - text: The Psycho Files
        does: >-
          MaxTac knows every chromed-up killer in the city by name. Once a
          session, ask who's close to breaking, and get an answer.
    agendas:
      - text: Wipe out Maelstrom's worst before they snap
        die: 4
        at: maelstrom
        then: Maelstrom loses its top chromers, and Watson's quieter for a season.
    loy:
      - { text: We walked out of the NCPD together, kind: bond }
    threads:
      - { to: maelstrom, tie: rival, text: Maelstrom makes psychos faster than we can stop them }
      - { to: paccon-electric, kind: bond, text: "PacCon pays us to keep the lines up, when it pays" }
    secret:
      tag: The Commander's Breaking
      more: >-
        The MaxTac Commander's own chrome is pushing him over the edge, and
        his C-SWAT teams are covering for him.
      ways:
        - His shaking hands at the range
        - The ripperdoc in Rancho Coronado who's afraid of him
    note: >-
      The Commander's name is yours to give. In 2077 MaxTac's back inside the
      NCPD, so this is the years it worked for anyone who'd pay.

  - key: norcal-marshals
    kind: law
    seal: { c: scales, f: plain }
    size: local
    seat: the-glen
    name: The NorCal Marshals
    about: >-
      The Free State's own law, rangers and inspectors who answer to the
      State Executioner, not the city. It works through state warrants and
      long rides. It sits in the Glen.
    want: The Free State's law holds in Night City, whatever the Council says.
    face: >-
      The State Executioner, the Free State's top lawman, who hangs who the
      courts tell him to and sometimes who they don't.
    faceOf: the-state-executioner
    res:
      - State Funds
      - Bounties
    people:
      - { text: Rangers, does: "+1 Power. Marshals who ride the Outskirts and the roads in." }
    assets:
      - text: State Warrants
        does: >-
          A state warrant beats a city one. Once a downtime, the Marshals take
          one person off the street to New Alcatraz.
    agendas:
      - text: Hang the El Norte Cartel's man in Santo Domingo
        die: 4
        at: el-norte-cartel
        then: The cartel's man swings, and El Norte runs scared for a season.
    threads:
      - { to: el-norte-cartel, tie: rival, text: The cartel thinks the border stops at Santo Domingo }
      - { to: ncpd, kind: hostile, text: The NCPD loses our prisoners on the way to the cells }
    secret:
      tag: The Executioner's Price
      more: >-
        The State Executioner sells pardons, and half of El Norte's men in the
        city have bought one off him.
      ways:
        - A pardon signed in the wrong year
        - The Executioner's ranch, which no lawman's pay could buy
    note: >-
      The State Executioner's name is yours to give. Marshals don't need the
      Council's say-so, which is why the Council hates them.

  - key: los-perros-guardianes
    kind: law
    seal: { c: tower, f: pale }
    size: local
    seat: reclamation-zone
    name: Los Perros Guardianes
    about: >-
      Deputised guards with dogs, keeping order in the Reclamation Zone where
      nobody else will. It works through patrols, dogs and the residents'
      trust. It sits in the Reclamation Zone.
    want: The Reclamation Zone stays its people's, and nobody clears it.
    face: >-
      The Perros' Captain, who grew up in the Zone and knows every dog's name.
    faceOf: perros-captain
    res:
      - Residents' Dues
      - The Deputy Contract
      - Salvage Rights
    people:
      - { text: K-9 Patrols, does: "+1 Power. Handlers and their dogs, on every street in the Zone." }
      - { text: Block Wardens, does: "+1 Power. Residents who answer a whistle at any hour." }
    assets:
      - text: The Dogs
        does: >-
          A Perros dog can track anyone through the Zone. Once a session, find
          whoever's hiding there.
    agendas:
      - text: Run Future BuildWorks out of the Zone
        die: 4
        at: kanzaki-family
        then: The builders leave the Reclamation Zone, and its squats stay homes.
    pub:
      - { text: The Perros came when the NCPD wouldn't, kind: bond }
    threads:
      - { to: kanzaki-family, tie: rival, text: Kanzaki's builders want our homes flat }
      - { to: jodes, tie: ally, text: The Jodes feed the Zone when the shops are empty }
    secret:
      tag: The Captain's Old Name
      more: >-
        The Captain ran with the Tyger Claws as a kid, and the Claws still
        expect a favour when they ask.
      ways:
        - An old Claws tattoo under a burn on his arm
        - A Claw who knew him when
    note: >-
      The Captain's name is yours to give. The Perros' dogs are as much a
      part of the Zone as its people.

  - key: sk-securities
    kind: law
    seal: { c: coins, f: chevron }
    size: small
    seat: heywood-docks
    name: SK Securities
    about: >-
      The docks' security, staffed by men who used to rob them. It works
      through the docks' contract and knowing who's who. It sits in Heywood
      Docks.
    want: Nothing moves through Heywood Docks without SK knowing.
    face: >-
      Andrea Lee, Heywood Docks' manager, who signed SK's contract and calls
      it the best decision she's made.
    faceOf: andrea-lee
    res:
      - The Docks Contract
      - Shipping Fees
    people:
      - { text: Dock Guards, does: "+1 Power. Ex-cons who know every way onto a ship." }
    assets:
      - text: The Manifests
        does: >-
          SK sees every cargo list. Once a session, find out what's on a ship,
          or who it's for.
    agendas:
      - text: Pin the docks bombing on the Tyger Claws
        die: 4
        at: tyger-claws
        then: The docks blame the Claws for last month's dead ship, and SK's contract is safe for years.
    threads:
      - { to: tyger-claws, tie: rival, text: The Claws want the docks back }
    secret:
      tag: The Skiv Family's Badges
      more: >-
        SK Securities is Lynn Skiv's mob in uniform, and Andrea Lee's her
        sister-in-law. The docks are robbed now, just more politely.
      ways:
        - Andrea Lee's wedding photos
        - SK's payroll, every name on it a Skiv man
    note: >-
      Nobody's claimed the ship that blew up leaving the docks last month.
      Talk on the docks says it was the Thelas, sea nomads who want the
      cargo going through a port of their own.

  # ── The gangs

  - key: maelstrom
    kind: gang
    seal: { c: cog, f: quarterly }
    size: local
    seat: watson
    name: Maelstrom
    about: >-
      A boostergang more chrome than flesh, fighting the Tyger Claws for
      Watson. It works through raids, rippers and fear. It sits in Watson.
    want: Watson belongs to Maelstrom, every building they put up in it.
    face: >-
      The Maelstrom Boss, whose face is mostly optics, and who talks to his
      chrome like it's listening.
    faceOf: maelstrom-boss
    res:
      - Stripped Chrome
      - Construction Rackets
      - Protection
    people:
      - { text: Chromed Boosters, does: "+1 Power. Kids with more steel than sense, and a lot of steel." }
      - { text: Street Rippers, does: "+1 Power. Backstreet docs who put stolen chrome in anyone who pays." }
    assets:
      - text: The Chop Shops
        does: >-
          Once a session, Maelstrom strips anything metal, a car or a corpse,
          and sells it by morning.
    agendas:
      - text: Drive the Tyger Claws out of Watson
        die: 6
        at: tyger-claws
        then: Watson's Maelstrom's, building sites and all, and the Claws go back to Japantown.
    threads:
      - { to: tyger-claws, tie: rival, text: The Claws think Watson's theirs because they got there first }
      - { to: maxtac, tie: rival, text: MaxTac hunts us like animals }
      - { to: trauma-team, tie: rival, text: Trauma Team's patients are worth more in pieces }
    secret:
      tag: Chrome From the Tower
      more: >-
        A night nurse in Trauma Team Tower sells Maelstrom the chrome out of
        clients who die there, and some who might not have.
      ways:
        - A Platinum client's arm on a Maelstrom booster
        - The nurse's runs to Watson after her shifts
    note: >-
      The Boss's name is yours to give. Maelstrom's Watson is half-built
      towers, cranes and gang signs on the hoardings.

  - key: tyger-claws
    kind: gang
    seal: { c: knife, f: plain }
    size: city
    seat: old-japantown
    name: The Tyger Claws
    about: >-
      The old gang of Japantown, with blades, a code and a cab company. It
      works through rackets, cabs and the docks' back doors. It sits in Old
      Japantown.
    want: Every racket from Old Japantown to Watson answers to the Claws.
    face: >-
      The Claws' Oyabun, old enough to remember the bomb, and patient enough
      to outlast anyone.
    faceOf: tyger-claws-oyabun
    res:
      - Protection Money
      - Cab Fares
      - Dock Theft
      - Joytoy Dens
      - Seized Guns
    people:
      - { text: Blade Crews, does: "+1 Power. Claws with katanas and bikes, who'll ride through anyone." }
      - { text: Cab Drivers, does: "+1 Power. Every Tyger Cab driver's a Claw when it counts." }
      - { text: Tattooed Muscle, does: "+1 Power. Old soldiers of the gang, quiet and very hard to move." }
    assets:
      - text: Tyger Cab
        does: >-
          The Claws' cab company. Once a session, find out where anyone in the
          city went in a cab, or get anywhere fast.
      - text: The Locker Pipeline
        does: >-
          The NCPD's seized guns come to the Claws by the back door. Once a
          downtime, arm a crew without a trace.
    agendas:
      - text: Hold Watson against Maelstrom
        die: 4
        at: maelstrom
        then: Watson's construction rackets are the Claws', and Maelstrom's chromers are dead or gone.
      - text: Take Heywood Docks back off SK
        die: 4
        at: sk-securities
        then: The Claws run the docks again, and SK's men are back in prison or the bay.
    pub:
      - { text: The Claws keep their word and everybody knows it, kind: bond }
    threads:
      - { to: maelstrom, tie: rival, text: Maelstrom's chromers are a disease in Watson }
      - { to: sk-securities, tie: rival, text: Skiv's men stole our docks with a contract }
      - { to: militech, kind: hostile, text: Militech's crates are ours if they're left on our docks }
    secret:
      tag: Petrochem Takes Our Dead
      more: >-
        Petrochem's carting crews take the Claws' bodies to the tip, and the
        Oyabun has a Coastal Carting truck for every one.
      ways:
        - A carting truck parked in Old Japantown at three in the morning
        - The tip, if anyone digs
    note: >-
      The Oyabun's name is yours to give. Tyger Cab's drivers are the
      fastest way across the city, and the Claws hear everything they do.

  - key: sixth-street
