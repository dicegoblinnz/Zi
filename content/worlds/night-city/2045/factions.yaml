      SINs. It sits in Santo Domingo.
    want: Santo Domingo runs on El Norte's money, and the rest of the city follows.
    face: >-
      Theresa Valentino, Santo Domingo's manager, elected with the cartel's
      money and owing it less every day.
    faceOf: theresa-valentino
    res:
      - Drugs
      - Fake SINs
      - Smuggling
      - Extortion
    people:
      - { text: Cartel Gunmen, does: "+1 Power. Hard men sent up from the south, who don't know the city yet." }
      - { text: Street Sellers, does: "+1 Power. Kids on every corner in Santo Domingo selling for the cartel." }
    assets:
      - text: Counterfeit SINs
        does: >-
          Once a downtime, the cartel makes someone a citizen, or makes a
          citizen someone else.
      - text: The Southern Road
        does: >-
          The cartel's smuggling road from the border. Anything can come up it,
          once a downtime.
    agendas:
      - text: Take Santo Domingo's security off the Aldecaldos
        die: 4
        at: aldecaldos
        then: Valentino's Fists guard Santo Domingo, and the cartel owns a district outright.
    threads:
      - { to: aldecaldos, tie: rival, text: The nomads keep Santo Domingo's peace and won't be bought }
      - { to: norcal-marshals, tie: rival, text: The Marshals hang our men at the border }
      - { to: city-council, kind: hostile, text: The Council laughs at Valentino and counts our money }
    secret:
      tag: Valentino Isn't Theirs Any More
      more: >-
        Valentino's turned the cartel's men in Santo Domingo into her own, and
        she means to cut El Norte out of the city.
      ways:
        - Valentino's Fists, who salute her and not the cartel
        - A cartel accountant counting less every month
    note: >-
      El Norte calls its business here a pilot. Locals call Valentino's
      enforcers her Fists, and they don't mean it kindly.

  - key: valentinos-fists
    kind: gang
    seal: { c: serpent, f: plain, d: star }
    mini: { of: el-norte-cartel, outs: [Influence, Destroy] }
    name: "Valentino's Fists"
    about: >-
      Cartel men who follow Theresa Valentino now, not their bosses in the
      south. It does two things for the cartel, for now.
    want: Theresa Valentino rules Santo Domingo, and the cartel takes what it's given.
    res:
      - Valentino's Payroll
    people:
      - { text: The Fists, does: "+1 Power. Cartel gunmen who'd die for Valentino, and say so." }
    loy:
      - { text: The cartel pays us but we answer to Valentino, kind: bond, s: strained }
    threads:
      - { to: aldecaldos, kind: hostile, text: The nomads are in Valentino's way }

  - key: kanzaki-family
    kind: gang
    seal: { c: anvil, f: chevron }
    size: local
    seat: future-buildworks
    name: The Kanzaki Family
    about: >-
      An old crime family that bet everything it had on rebuilding the city,
