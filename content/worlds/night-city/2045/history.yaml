# How it came to be: Night City from its founding to 2045, the Time of the
# Red, an age at a time, in the order it happened, and nothing after it. A
# line that would give a faction's Secret away is hers.
history:

  # ── Long ago
  - age: 1
    text: >-
      Richard Night talked the corps into paying for a city of the future on a
      gutted stretch of coast, and the work began.
  - age: 1
    text: >-
      Richard Night was shot dead before his city was finished, and the corps
      finished it their way and kept his name on it.
  - age: 1
    text: >-
      When the old country broke apart, Northern California went its own way as
      a Free State, and Night City went with it as a free port.
  - age: 1
    text: >-
      Arasaka put up its tower in the Corporate Center, and the rest of the
      corps built theirs round it.
  - age: 1
    text: >-
      The Tyger Claws came over with the Japanese money, and Japantown was
      theirs before the city noticed.
  - age: 1
    text: >-
      Trauma Team sold the city its first subscriptions, and the rich stopped
      dying in the street.
  - age: 1
    text: >-
      Network 54 became the channel every screen in the country watched.
  - age: 1
    text: >-
      Rogue Amendiares made her name running with Johnny Silverhand, a rocker
      who hated Arasaka more than anyone alive.

  # ── In living memory
  - age: 2
    text: >-
      Arasaka and Militech went to war over a sea-farming company, and Night
      City was one of the places they fought it.
  - age: 2
    text: >-
      A netrunner's virus killed the old Net, and the city's talked to itself
      through local nets and the Data Pool ever since.
  - age: 2
    text: >-
      Johnny Silverhand and Rogue led a team into Arasaka Tower, and a nuke went
      off inside it.
    hers: true
  - age: 2
    text: >-
      A nuke went off in Arasaka Tower, and the Corporate Center died with it.
      What's left is the Hot Zone, and it still glows.
  - age: 2
    text: >-
      Arasaka was thrown out of the country after the war, and Militech came
      home as the NUSA's own army.
  - age: 2
    text: >-
      Dust from the war turned the sky red for years, and people still call
      it the Time of the Red.
  - age: 2
    text: >-
      With Arasaka gone and no money left, the corps that stayed rebuilt the
      city to suit themselves, a district at a time.
  - age: 2
    text: >-
      The Glen was carved out with corp money, and what was left of the city's
      government moved into it.
  - age: 2
    text: >-
      The city's government became the City Council, a manager for every
      district and Advisory Seats for anyone rich enough to buy one.
  - age: 2
    text: >-
      The NCPD ran out of money and stopped going into the districts that
      couldn't pay.
  - age: 2
    text: >-
      MaxTac walked out of the NCPD and started hiring itself out to whoever
      had a cyberpsycho problem.
  - age: 2
    text: >-
      6th Street came home from the war to a country that didn't want them, and
      started guarding the neighbourhoods that would pay.
  - age: 2
    text: >-
      Rogue took over the Afterlife and made it the bar where every merc and
      fixer in the city does business.
  - age: 2
    text: >-
      The Willows, a crew of women edgerunners, took the city's hardest jobs,
      and Rogue drank with them.
  - age: 2
    text: >-
      Lazarus won the Executive Zone's contract and built its walls, and the
      city's richest have slept well behind them since.
  - age: 2
    text: >-
      The Kanzaki Family went straight in the 2030s and bought Future
      BuildWorks, a builder for a city that needed one.
  - age: 2
    text: >-
      Playland by the Sea reopened in Pacifica, and the Piranhas moved in with
      the crowds.
  - age: 2
    text: >-
      The Voodoo Boys and the Piranhas settled into a cold war over Pacifica,
      and Playland stayed open through it.
  - age: 2
    text: >-
      Sister Shelly Simpson's Digital Divinity compound blew up in Rancho
      Coronado, and nobody's managed the district since.
  - age: 2
    text: >-
      PacCon Electric put up wind farms and solar fields in the Outskirts, and
      they've never made quite enough.
  - age: 2
    text: >-
      Petrochem's Coastal Carting and SovOil's SMKP Hauling carved the city's
      rubbish up between them.
  - age: 2
    text: >-
      Biotechnica's farms started feeding the city, and Biotechnica started
      setting the price of bread.
  - age: 2
    text: >-
      Ziggurat won the city's emergency line and gave it to an AI, and nobody
      in Night City waited on hold again.
  - age: 2
    text: >-
      The Data Pool came back up across most of the city, and Network 54 lost
      its hold on the news.
  - age: 2
    text: >-
      The Jodes rolled into Pacifica and planted the lots nobody else wanted.
  - age: 2
    text: >-
      The Aldecaldos took the job of keeping Santo Domingo's peace, and set up
      a depot in the Heywood Industrial Zone.
  - age: 2
    text: >-
      Los Perros Guardianes were deputised to keep the Reclamation Zone, and
      their dogs did what the NCPD hadn't.
  - age: 2
    text: >-
      Heywood Docks hired SK Securities, a firm of former thieves, and the
      robberies stopped.
  - age: 2
    text: >-
      The NorCal Marshals started riding into Night City after bounties the
      NCPD wouldn't chase.
  - age: 2
    text: >-
      Corp money started building Watson Development, and the gangs started
      fighting over who'd tax the building sites.

  # ── This last year
  - age: 3
    text: >-
      Maelstrom and the Tyger Claws went to war over Watson, and the cranes
      there have bullet holes in them.
  - age: 3
    text: >-
      Clearing the ground for Megabuilding H6 in New Westbrook killed
      thirty-seven people, and Network 54 never mentioned it.
  - age: 3
    text: >-
      The indie screamsheets ran the H6 story, and the Kanzaki Family's
      builders didn't stop work for a day.
  - age: 3
    text: >-
      The Inquisitors started recruiting corpzone teenagers in Charter Hill,
      and the first implant clinic burned.
  - age: 3
    text: >-
      Gang attacks in North Heywood got worse all year, and 6th Street won the
      district's security contract off the back of them.
  - age: 3
    text: >-
      Theresa Valentino won Santo Domingo's seat with the El Norte Cartel's
      money, promising to serve everyone, not just the nomads.
  - age: 3
    text: >-
      The Aldecaldos kept Santo Domingo's contract anyway, and Valentino's
      Fists started walking the same streets.
  - age: 3
    text: >-
      Heather Stein and Karen Davies went to war over the Executive Zone, and
      somebody's netrunners wrecked Stein's lawns.
  - age: 3
    text: >-
      Rancho Coronado's power lines kept getting cut, and PacCon Electric
      hired MaxTac to guard them.
  - age: 3
    text: >-
      SovOil's generators sold out in the worst blackout of the year.
  - age: 3
    text: >-
      A ship blew up leaving Heywood Docks last month, and nobody's claimed it.
