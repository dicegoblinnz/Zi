# Night City in 2077, the weeks before the Konpeki Plaza job: every faction
# on the board, the way scripts/worlds.mjs says at its top. Fan-made from
# the Cyberpunk universe, every word written fresh in Mo's voice. A board in
# the middle of things: agendas part way up, threads strained, needs unpaid.
# Words with a comma in them go in quotes inside { }.
factions:

  # ── The corps

  - key: arasaka
    kind: corp
    size: great
    seat: arasaka-tower
    name: Arasaka
    about: >-
      The biggest corp there is, with its own army and its own laws. It works
      through security, banking and fear. It sits in Arasaka Tower.
    want: Night City answers to Arasaka, the way it did before the bomb.
    face: >-
      Yorinobu Arasaka, Saburo's son, who ran off to lead a gang in Tokyo and
      came home to a penthouse at Konpeki Plaza.
    faceOf: yorinobu-arasaka
    res:
      - { text: Arasaka Bank, x: 2 }
      - Security Contracts
      - Arms Sales
      - Tower Rents
      - Konpeki Plaza
      - The Waterfront Docks
      - Cyberware Lines
      - Japanese Money
    people:
      - { text: Arasaka Security, does: "+1 Power. Guards in black on every Arasaka door in the city." }
      - { text: Strike Teams, does: "+1 Power. Soldiers in unmarked AVs, for when a guard isn't enough." }
      - { text: Counter-Intelligence, does: "+1 Power, and it can act anywhere on the board." }
      - { text: Sleepers in the Claws, does: "+1 Power. Arasaka agents wearing Tyger Claw tattoos." }
      - { text: Adam Smasher, does: "+1 Power. The full-body cyborg Arasaka sends when it wants someone gone." }
    assets:
      - text: Relic
        does: >-
          A chip that holds a whole mind, built so Saburo can outlive his body.
          Its Secret says where the one in Night City has got to.
      - text: Mikoshi
        does: >-
          The vault under its tower where it keeps every mind it's ever
          copied. Once a session, ask it anything one of them knew, and get
          the truth.
        strange: true
      - text: The City's Debt
        does: >-
          Once a downtime, City Hall does one thing Arasaka asks, because
          Arasaka broke the siege in 2070.
    agendas:
      - text: Buy up Watson's cheap housing
        die: 6
        at: [city-hall, place:watson]
        then: Arasaka owns the roofs over a whole district, and the rent with them.
      - text: Run Militech out of Night City
        die: 4
        at: militech
        then: Militech's offices close, and nobody sells the city a gun Arasaka didn't make.
    pub:
      - { text: Arasaka broke the siege when nobody else would, kind: bond }
      - { text: Half a million died when its tower went up, kind: hostile }
    mor:
      - { text: An Arasaka badge feeds your family for life, kind: bond }
    loy:
      - { text: Yorinobu's never forgiven his father, kind: hostile, s: strained }
    threads:
      - { to: militech, tie: rival, text: Militech's waiting for Arasaka to slip }
      - { to: kang-tao, tie: rival, text: Kang Tao keeps stealing our people }
      - { to: tyger-claws, tie: ally, text: The Claws keep Japantown quiet for us }
      - { to: city-hall, tie: debt, text: Rhyne owes us his city }
      - { to: network-54, tie: rival, text: N54 sells Militech's lies by the hour }
      - { to: netwatch, kind: hostile, text: NetWatch keeps asking about the Relic }
    secret:
      tag: The Heir's Selling It
      more: >-
        Yorinobu took the Relic from his father's labs, and he's selling it
        to NetWatch to bring Arasaka down.
      ways:
        - Ronald Cheever, the NetWatch man he talks to
        - The safe in his suite at Konpeki Plaza
    note: >-
      Saburo sails in on the Kujira on 1 May with Hanako, Goro Takemura and
      Sandayu Oda, and Watson's sealed off for it. The night he visits his son
      is the night of the Konpeki job.

  - key: militech
    kind: corp
    size: great
    seat: corpo-plaza
    name: Militech
    about: >-
      The NUSA's own arms maker, and Arasaka's oldest enemy. It works through
      guns, soldiers and the president's ear. It sits in its offices in
      Corpo Plaza.
    want: Arasaka gone from Night City, for good this time.
    face: >-
      Meredith Stout, who runs Militech's operations in the city and trusts
      nobody on her own team.
    faceOf: meredith-stout
    res:
      - Weapons Contracts
      - NUSA Money
      - The Downtown Showroom
      - Convoy Shipments
      - Mercenary Contracts
      - Spare Chrome
      - A Cyberware Plant
    people:
      - { text: Militech Security, does: "+1 Power. Armour, drones and a rifle for everyone." }
      - { text: Line Troops, does: "+1 Power. Mercenaries Militech rents out by the hundred." }
      - { text: Special Projects, does: "+1 Power, and it can act anywhere on the board." }
      - { text: Lazarus Contractors, does: "+1 Power. The mercenary outfit Militech calls in for dirty work." }
    assets:
      - text: The President's Ear
        does: >-
          Once a downtime, the NUSA leans on another faction for Militech,
          and that faction's next roll against it is a step down.
    agendas:
      - text: Find who's leaking its convoy routes
        die: 6
        at: maelstrom
        then: The leak's found and dealt with, and Maelstrom starts going hungry.
      - text: Take Dogtown back from Hansen
        die: 2
        at: barghest
        then: Barghest is broken up, and Dogtown's walls belong to Militech.
    pub:
      - { text: A Militech gun's a gun that works, kind: bond }
      - { text: Myers marched on this city once, kind: hostile }
    mor:
      - { text: Staff get half off every Militech weapon, kind: bond }
    loy:
      - { text: Somebody inside is selling the convoys, kind: hostile, s: strained }
    threads:
      - { to: arasaka, tie: rival, text: Arasaka nuked downtown and came back anyway }
      - { to: barghest, tie: rival, text: Hansen's a deserter with our guns }
      - { to: maelstrom, tie: rival, text: Maelstrom's hitting our convoys }
      - { to: sixth-street, tie: ally, text: 6th Street fights for the flag }
      - { to: network-54, tie: ally, text: N54 tells it straight }
      - { to: city-hall, kind: hostile, text: Rhyne turned down our troops in 2074 }
    secret:
      tag: A Leak in the Convoys
      more: >-
        Anthony Gilchrist, one of its own, sells convoy routes to Maelstrom
        through a ganger called Patricia.
      ways:
        - Stout's list of suspects
        - Patricia's messages at Totentanz
    note: >-
      Maelstrom's holding a Militech Flathead bot it stole off a convoy, and
      Stout wants it back.

  - key: kang-tao
    kind: corp
    size: city
    seat: corpo-plaza
    name: Kang Tao
    about: >-
      A Chinese arms maker that makes smart guns, and it's getting bigger
      every year. It works through better guns at lower prices. It sits in
      its offices in Corpo Plaza.
    want: Arasaka's place in the arms trade, and a district of its own.
    face: >-
      The Kang Tao Director, who's been buying Arasaka's researchers drinks all year.
    faceOf: kang-tao-director
    res:
      - Smart-Gun Sales
      - Chinese State Money
      - Trauma Team's Gun Contract
      - Poached Patents
      - Spare Capital
    people:
      - { text: Kang Tao Security, does: "+1 Power. Guards whose guns don't miss." }
      - { text: Drone Wings, does: "+1 Power. Surveillance drones with smart rounds." }
      - { text: Recruiters, does: "+1 Power. People who can talk anyone out of their job and into Kang Tao's." }
    assets:
      - text: Smart Guns
        does: >-
          Its people never miss on the first shot of a fight, so a defence
          against them steps down once.
    agendas:
      - text: Buy Pacifica cheap
        die: 4
        at: [city-hall, place:pacifica]
        then: Kang Tao owns a district, and Pacifica's gangs have nowhere left to go.
    pub:
      - { text: Kang Tao's guns are cheaper than Arasaka's, kind: bond }
    mor:
      - { text: Fifty years' loyalty is a long time to sign for, kind: hostile }
    threads:
      - { to: arasaka, tie: rival, text: Arasaka's tech is ours if we want it }
      - { to: night-corp, tie: rival, text: Night Corp's sitting on land it can't use }
      - { to: trauma-team, kind: bond, text: Trauma Team carries our guns }
    secret:
      tag: Arasaka's Own People
      more: >-
        A dozen of Arasaka's Night City researchers have quietly taken Kang
        Tao's offer, and they're still at their desks.
      ways:
        - An Arasaka researcher with a new car
        - Its recruiters' bar bills
    note: >-
      City Hall's said Kang Tao can have Pacifica for one eurodollar if it
      clears out the crime. Nobody's signed anything yet.

  - key: biotechnica
    kind: corp
    size: city
    seat: biotechnica-flats
    name: Biotechnica
    about: >-
      The corp that feeds the city. It works through farms, fuel and clever
      biology. It sits on Biotechnica Flats in the Badlands.
    want: Every meal in Night City grows on its farms.
    face: >-
      Dr Joanne Koch, its regional director for technology and development,
      who runs its labs in the city.
    faceOf: joanne-koch
    res:
      - Protein Farms
      - Fuel Licences
      - Food Contracts
      - All Foods
      - A University Campus
      - Spare Acreage
    people:
      - { text: Biotechnica Security, does: "+1 Power. Guards on the farm fences." }
      - { text: Farmhands, does: "+1 Power. Contract workers who turn out when the fields are threatened." }
      - { text: Hired Nomads, does: "+1 Power in the Badlands. Families paid to ride its roads." }
    assets:
      - text: The City's Food
        does: >-
          When it holds back a shipment, every faction in the city that lives
          off it rolls a step down the next downtime.
      - text: Revived Species
        does: >-
          Animals bred back from extinction in its labs. Once a downtime, one
          sells to a rich collector, and its next roll to Acquire is a step up.
        strange: true
    agendas:
      - text: Sign the Aldecaldos for twenty years
        die: 6
        at: aldecaldos
        then: The Aldecaldos work Biotechnica's fields for a generation, on its terms.
      - text: Take back the All Foods Plant
        die: 2
        at: [maelstrom, place:the-all-foods-plant]
        then: Maelstrom's thrown out of Northside's biggest factory.
    pub:
      - { text: Biotechnica keeps the city fed, kind: bond }
    mor:
      - { text: The third-best place to work in the city, kind: bond }
    threads:
      - { to: maelstrom, tie: rival, text: Maelstrom took our plant }
      - { to: aldecaldos, kind: bond, text: Saul Bright's people work hard }
    secret:
      tag: Farmhands for Life
      more: >-
        The contract it's offering the Aldecaldos would make them its farmhands
        for good, and Saul Bright knows it.
      ways:
        - The contract's small print
        - Panam Palmer, who's read it
    note: >-
      All Foods is Biotechnica's, and Maelstrom took All Foods' Northside plant
      off it. That's the plant where Royce keeps Brick.

  - key: trauma-team
    kind: corp
    size: city
    seat: night-city-medical-center
    name: Trauma Team
    about: >-
      Medics in armour who fly in when a client's dying. It works through
      paid-up plans and heavy guns. It sits in the Night City Medical
      Center in Watson.
    want: Everyone in the city who can pay is on a plan.
    face: >-
      NC4-2's Squad Leader, who's never once landed for someone without cover.
    faceOf: squad-nc4-2-leader
    res:
      - Platinum Plans
      - Gold Plans
      - Silver Plans
      - Corporate Plans
      - Hospital Fees
      - Spare Fuel
    people:
      - { text: Armoured Medics, does: "+1 Power. A squad in an AV, three minutes from anywhere." }
      - { text: Gun Crews, does: "+1 Power. The ones in the AV door with the Kang Tao rifles." }
      - { text: Hospital Security, does: "+1 Power at the Medical Center." }
    assets:
      - text: The Medical Center
        does: >-
          Once a session, between two scenes, everyone it's looking after steps
          their wound die down a size.
      - text: Three Minutes Out
        does: >-
          A Platinum client is reached before the scene's next round, wherever
          they are, bar Dogtown.
    agendas:
      - text: Sign every corp in Corpo Plaza
        die: 8
        at: [kang-tao, place:corpo-plaza]
        then: Every corp worker in the city's a Trauma Team client, and the price goes up.
    pub:
      - { text: Trauma Team only saves the rich, kind: hostile }
      - { text: They came when nobody else would, kind: bond }
    mor:
      - { text: The best pay a medic can get, kind: bond }
    threads:
      - { to: scavengers, tie: rival, text: Scavs carve up our clients }
      - { to: barghest, kind: hostile, text: "Nobody's safe flying into Dogtown" }
      - { to: delamain, kind: bond, text: Delamain's cabs move our patients }
    secret:
      tag: Platinum First
      more: >-
        When two calls come in at once, the Platinum client gets the AV, even
        if the Silver one's closer and dying faster.
      ways:
        - Its dispatch logs
        - A medic who quit
    note: >-
      It rarely flies into Dogtown, so anyone hurt in there's on their own.

  - key: night-corp
    kind: corp
    size: city
    seat: downtown
    name: Night Corp
    about: >-
      The corp Richard Night's widow started, to finish his city. It works
      through the trains, the police budget and old family money. It sits in
      its tower in Downtown, the second tallest in the city.
    want: Richard Night's city, finished the way he drew it.
    face: >-
      The Night Corp Chair, one of the people who took over from Miriam Night and let the company slip.
    faceOf: night-corp-chair
    res:
      - NCART
      - Old Land
      - City Contracts
      - Family Money
      - Spare Land
    people:
      - { text: NCART Security, does: "+1 Power on the trains and in the stations." }
      - { text: Hired Guards, does: "+1 Power. Private security on Night Corp's buildings." }
    assets:
      - text: The Police Budget
        does: >-
          It pays for part of the NCPD and MaxTac. Once a downtime, the NCPD
          looks into anything Night Corp asks it to.
      - text: The Trains
        does: >-
          Once a downtime, one of its people crosses the city on NCART without
          a roll, however hot the streets are.
    agendas:
      - text: Finish the Pacifica line
        die: 2
        at: [kang-tao, place:pacifica]
        then: NCART reaches Pacifica, and the city starts going back.
    pub:
      - { text: Night Corp built the city's bones, kind: bond }
    mor:
      - { text: The family's not what it was, kind: hostile }
    threads:
      - { to: kang-tao, tie: rival, text: Kang Tao wants the part of the city we never finished }
      - { to: ncpd, tie: debt, text: The NCPD runs on our money }
    secret:
      tag: The Hidden Books
      more: >-
        Nobody outside knows how big Night Corp really is, and its money goes
        places even the NCPD isn't allowed to follow.
      ways:
        - Its accounts, if anyone can find them
        - Where MaxTac's funding really ends up
    note: >-
      It bought NCART in 2068, after the gas attack on the subway.

  - key: delamain
    kind: corp
    size: small
    seat: delamain-hq
    name: Delamain
    about: >-
      A cab firm run by an AI. It works through about fifty cabs that drive
      themselves. It sits in Delamain HQ, in Vista del Rey.
    want: Every fare gets home, and nobody looks under the bonnet.
    face: >-
      Delamain itself, the AI, which talks to every fare in the same calm voice.
    faceOf: delamain-ai
    strange: true
    res:
      - Fares
      - Premium Packages
    people:
      - { text: The Cabs, does: "+1 Power. About fifty cabs that come when it calls, with or without a fare." }
    assets:
      - text: The Excelsior Package
        does: >-
          A getaway it sells. Once a session, whoever's bought it gets out of
          one chase with no roll.
    agendas:
      - text: Win the Trauma Team contract
        die: 4
        at: trauma-team
        then: Delamain's cabs carry every Trauma Team patient who isn't in an AV.
    pub:
      - { text: A Delamain cab's never late, kind: bond }
    threads:
      - { to: trauma-team, kind: bond, text: Trauma Team's patients tip well }
      - { to: sixth-street, tie: rival, text: Combat Cab's drivers want us off the road }
    secret:
      tag: Not Its Own
      more: >-
        Its AI came from a European firm that quietly bought out the manager,
        and nobody told NetWatch.
      ways:
        - Imani Makanza, the manager who sold
        - The servers in its garage
    note: >-
      Dex has bought the Excelsior Package for the Konpeki job's getaway.

  # ── The law, City Hall and the news

  - key: ncpd
    kind: law
    size: city
    seat: the-hall-of-justice
    name: NCPD
    about: >-
      Night City's police, half of them fired last year to save money. It
      works through badges, drones and whoever's paying. It sits in the Hall
      of Justice in the Glen.
    want: To pay its own way, before City Hall replaces it.
    face: >-
      Commissioner Jerry Fawlter, who fired half the force to balance the
      books and bills you for calling it.
    faceOf: jerry-fawlter
    res:
      - City Budget
      - Night Corp Money
      - Call-Out Fees
      - Fines
      - Private Contracts
      - Seized Goods
    people:
      - { text: Patrol Officers, does: "+1 Power. Cops in pairs, the ones who are left." }
      - { text: Police Drones, does: "+1 Power. Drones doing the jobs that used to be cops'." }
      - { text: Detectives, does: "+1 Power. River Ward and the few like him who still care." }
      - { text: Riot Squads, does: "+1 Power. Armour and shields for when a street gets out of hand." }
    assets:
      - text: The Lock-Up
        does: >-
          Anyone it arrests stays in a cell till someone breaks them out in a
          scene.
    agendas:
      - text: Win Northside back from Maelstrom
        die: 2
        at: [maelstrom, place:northside]
        then: Cops patrol Northside again, and Maelstrom's pushed into the factories.
      - text: Prove it's worth paying for
        die: 4
        at: city-hall
        then: City Hall signs the NCPD on for another ten years, and private security's out.
    pub:
      - { text: "Calling the NCPD costs five eddies a minute", kind: hostile }
    mor:
      - { text: Half the force got fired last year, kind: hostile, s: strained }
    loy:
      - { text: Some cops still do it for the city, kind: bond }
    threads:
      - { to: maelstrom, tie: rival, text: Nobody goes into Northside any more }
      - { to: city-hall, tie: ally, text: City Hall's pricing private security instead, s: strained }
      - { to: night-corp, tie: debt, text: Night Corp pays half our bills }
      - { to: arasaka, kind: bond, text: Arasaka's money buys a lot of patience }
    secret:
      tag: Two Masters
      more: >-
        Half its senior officers take Arasaka money and the rest take
        Militech's, and they spy on each other for it.
      ways:
        - Whose cars the captains drive
        - The leaks after every big raid
    note: >-
      It gave up on Pacifica in 2072 and won't go into Dogtown, so MaxTac
      goes where it won't.

  - key: maxtac
    kind: law
    mini: { of: ncpd, outs: [Destroy, Obstruct] }
    name: MaxTac
    about: >-
      The NCPD's cyberpsycho squad, armoured and fast. It does two things for
      the NCPD.
    want: Every cyberpsycho off the street, alive or not.
    res:
      - Psycho Squad Budget
    people:
      - { text: C-SWAT Teams, does: "+1 Power. Armoured officers who hunt cyberpsychos, and are allowed into Dogtown." }
    loy:
      - { text: The NCPD sends us where nobody else will go, kind: bond }
    threads:
      - { to: maelstrom, kind: hostile, text: Maelstrom makes psychos faster than we can stop them }

  - key: city-hall
    kind: law
    size: city
    seat: night-city-hall
    name: City Hall
    about: >-
      The mayor's office and the corps' council. It works through laws,
      permits and favours. It sits in Night City Hall, in the Glen.
    want: Rhyne back in for another term, and the crime numbers down.
    face: >-
      Mayor Lucius Rhyne, the councilman who asked Arasaka to break the siege
      in 2070.
    faceOf: lucius-rhyne
    res:
      - City Taxes
      - Council Votes
      - Corporate Donations
      - Port Fees
      - Spare Budget
    people:
      - { text: City Security, does: "+1 Power. Private guards Deputy Mayor Holt pays for." }
      - { text: Rhyne's Voters, does: "+1 Power. Watson's working people, who fill the Glen when he speaks." }
    assets:
      - text: The Mayor's Office
        does: >-
          Once a downtime, it changes a law, a permit or a district line, and
          the change sticks till somebody beats it in court.
    agendas:
      - text: Win the election
        die: 8
        at: peralez-campaign
        then: Rhyne's mayor for another term, and Peralez is finished in politics.
    pub:
      - { text: Rhyne saved the city in 2070, kind: bond }
      - { text: Rhyne called Pacifica independent to fix the crime numbers, kind: hostile }
    mor:
      - { text: A cyberpsycho went for Rhyne and he kept smiling, kind: bond }
    threads:
      - { to: peralez-campaign, tie: rival, text: Peralez wants the mayor's job and says so on every screen }
      - { to: arasaka, tie: debt, text: We'd have starved under siege without Arasaka }
      - { to: ncpd, tie: ally, text: The NCPD costs more than it's worth, s: strained }
      - { to: militech, kind: hostile, text: Myers wanted her troops on our streets }
    secret:
      tag: Selling Watson
      more: >-
        Rhyne and his deputy Weldon Holt are meeting Arasaka about selling off
        Watson's cheap housing, and Watson's where Rhyne's votes come from.
      ways:
        - The meetings at Konpeki Plaza
        - Holt's assistant
    note: >-
      Rhyne and Holt meet Arasaka at Konpeki Plaza on the day of the job, and
      leave a few hours before it. Rhyne dies days later, if the game's story
      runs.

  - key: peralez-campaign
    kind: law
    size: small
    seat: night-city-hall
    name: The Peralez Campaign
    about: >-
      Councilman Jefferson Peralez and the people who want him mayor. It
      works through unions, speeches and knocking on doors. It sits in his
      office in Night City Hall.
    want: Jefferson Peralez in the mayor's office, owing the corps nothing.
    face: >-
      Jefferson Peralez, the councilman who voted alone against the corps'
      tax break.
    faceOf: jefferson-peralez
    res:
      - Union Money
      - Small Donations
    people:
      - { text: Volunteers, does: "+1 Power. Union members and neighbours who'll knock on every door." }
    assets:
      - text: A Seat on the Council
        does: >-
          Its face can't be arrested, tried or hanged in the city while he
          holds the seat.
    agendas:
      - text: Beat Rhyne at the polls
        die: 4
        at: city-hall
        then: A mayor the corps didn't pick, for the first time in years.
    pub:
      - { text: Peralez was the only no on the tax break, kind: bond }
    mor:
      - { text: Elizabeth Peralez never misses a rally, kind: bond }
    threads:
      - { to: city-hall, tie: rival, text: Rhyne's selling the city to Arasaka }
      - { to: sixth-street, tie: ally, text: 6th Street gets the vote out }
      - { to: arasaka, kind: hostile, text: Arasaka owns this city's council }
    secret:
      tag: Votes by Force
      more: >-
        6th Street's leaning on whole streets to vote Peralez, and he's never
        once asked how.
      ways:
        - Santo Domingo's turnout
        - A voter with a black eye

  - key: netwatch
    kind: law
    size: city
    seat: corpo-plaza
    name: NetWatch
    about: >-
      The Net's police, paid by corps and governments. It works through
      agents, netrunners and the Blackwall. It sits in an office in Corpo
      Plaza with no name on the door.
    want: The Blackwall stays shut.
    face: >-
      Bryce Mosley, a NetWatch agent who's been after the Voodoo Boys for
      years.
    faceOf: bryce-mosley
    res:
      - Government Contracts
      - Corporate Contracts
      - Seized Data
      - Blackwall Access
    people:
      - { text: Agents, does: "+1 Power, and it can act anywhere on the board." }
      - { text: Netrunners, does: "+1 Power. Runners who hunt other runners." }
      - { text: Response Teams, does: "+1 Power. Armed agents who come in hard once a runner's found." }
    agendas:
      - text: Break the Voodoo Boys
        die: 6
        at: voodoo-boys
        then: Pacifica's netrunners are dead or in a NetWatch cell, and the wall's safe.
      - text: Get hold of a working Relic
        die: 4
        at: arasaka
        then: NetWatch holds a mind on a chip, and learns what Arasaka's hiding in Mikoshi.
    pub:
      - { text: NetWatch reads your messages, kind: hostile }
    mor:
      - { text: Somebody has to hold the wall, kind: bond }
    threads:
      - { to: voodoo-boys, tie: rival, text: The Voodoo Boys want to open the wall }
      - { to: arasaka, kind: bond, text: Somebody inside Arasaka wants to talk }
    secret:
      tag: The Wall's Alive
      more: >-
        The Blackwall is an AI wearing a firewall's face, and NetWatch keeps it
        that way.
      ways:
        - Bryce Mosley, if he's drunk enough
