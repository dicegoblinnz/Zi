  # ── Pacifica
  - key: pacifica
    name: Pacifica
    area: district
    line: The resort district the money walked out on, and the city's combat zone
    ch: 5
    look: >-
      Half-built hotels, a mall gone to ruin and a pier with a dead
      rollercoaster, all paid for by investors who ran when the war came. The
