      - { text: "An officer matches a face to a wanted list.", d: 6, at: "a case file" }
    hooks:
      - "A detective wants help with a case the commissioner's told him to drop"

  - key: el-coyote-cojo
    name: El Coyote Cojo
    aka: [the Coyote]
    in: the-glen
    line: Mama Welles's bar, where the Valentinos drink and nobody makes trouble
    ch: 2
    look: >-
