    ground:
      - "*Wired Rooms*: anyone in here can be hacked from a chair three floors up"
    stakes:
      - "*An audience*, Challenge 5: *Someone Must Agree*, *Proud* (Brigitte meets the crew)"
    clock: { d: 8, text: "Placide decides the crew's NetWatch, and the hotel's netrunners wake up." }
    teles:
      - { text: "Placide puts a gun on the table and asks who sent the crew.", d: 6, at: "Confidence, Not Trusted" }
      - { text: "A netrunner upstairs fries someone's optics.", d: 8, at: "Defend, Blinded" }
    hooks:
