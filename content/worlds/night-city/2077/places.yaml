      who'll listen about the big job he's going to land.
    here:
      - "*Mama Welles*, who owns the bar"
      - "*Jackie Welles*, her son, looking for his big break"
      - "Valentinos having a quiet drink (Challenge 3: *Loyal to a Name*)"
    ground:
      - "*Mama's House*: nobody draws in here, because nobody wants Mama Welles to hear about it"
