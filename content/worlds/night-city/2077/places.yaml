    teles:
      - { text: "Barghest's gate crew asks for the toll, then doubles it.", d: 6, at: "Confidence, Shaken Down" }
      - { text: "A Barghest patrol sweeps the street with lights.", d: 8, at: "a way through the wall" }
    hooks:
      - "Militech wants to know what Hansen's keeping under the Black Sapphire"

  - key: battys-hotel
