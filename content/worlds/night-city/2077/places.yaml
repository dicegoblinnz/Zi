    here:
      - "*Delamain*, everywhere at once"
      - "Mechanics who keep to their shift"
    ground:
      - "*Its Cabs*: every car in the garage drives itself, and they all go where Delamain says"
    stakes:
      - "*A ride*, Challenge 3: *Someone Must Agree* (Delamain takes the crew where they need to go, with no questions)"
    clock: { d: 6, text: "Delamain decides the crew's a risk to its fleet, and locks the doors." }
    teles:
