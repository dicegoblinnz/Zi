# Night City: a whole world from the Cyberpunk universe, fan-made, for
# playing Zi'Dara there (stages 12 to 14 and 17 to 19 of
# notes/builder-plan.md). It's the one place CLAUDE.md lets another game be
# named. Every word's Mo's voice, written fresh, bar the two notices, which
# are the companies' own words.
# scripts/worlds.mjs reads it, and says at its top how a world's written.
id: night-city
name: Night City
whose: >-
  This one's fan-made and free, so you can run Zi'Dara in Night City.
  Cyberpunk and everything in it belong to CD Projekt and R. Talsorian Games,
  and neither of them made this or signed off on it.
notices:
  - >-
    {title} is unofficial content provided under the Homebrew Content
    Policy of R. Talsorian Games and is not approved or endorsed by RTG. This
    content references materials that are the property of R. Talsorian Games
    and its licensees.
  - This is an unofficial fan work and is not approved/endorsed by CD PROJEKT RED.
kinds:
  corp: Corps
  gang: Gangs
  nomad: Nomads
  fixer: Fixers
  law: The law
  other: The rest
# The year /worlds/night-city/ opens on, and 2045's at /worlds/night-city/2045/.
opens: 2077
years:
  2045:
    title: Night City, 2045
    when: >-
      The Time of the Red, twenty-two years after the bomb, with the city
      rebuilding a district at a time and the Council arguing over who pays.
    recipe: { region: city, era: near-future, twist: chrome }
  2077:
    title: Night City, 2077
    when: >-
      The weeks before the Konpeki Plaza job, with Saburo Arasaka alive and
      Dex DeShawn setting up the job of the year.
    recipe: { region: city, era: near-future, twist: chrome }
# Anyone or anywhere in more than one year, by its key, so it's one faction,
# place or person from year to year: Rogue in 2045 is Rogue in 2077.
both:
  # the factions
  - militech
  - biotechnica
  - network-54
  - trauma-team
  - ncpd
  - maxtac
  - maelstrom
  - tyger-claws
  - sixth-street
  - voodoo-boys
  - aldecaldos
  - afterlife
  # the places
  - the-glen
  - charter-hill
  - watson
  - santo-domingo
  - rancho-coronado
  - pacifica
  - the-afterlife
  # the people
  - rogue-amendiares
# The ground every year shares, so the coast, the water and the hills never
# move between years: the sea, the reservoir and the hills, in the map's own
# numbers, 0 to 1000 across and down. Our own map of the city, drawn for
# Zi'Dara, never traced from anyone else's.
ground:
  size: [1000, 1000]
  sea: [[0, 0], [445, 0], [432, 30], [380, 44], [300, 50], [248, 72], [206, 112], [186, 160], [200, 212], [178, 252], [150, 300], [138, 360], [158, 420], [128, 482], [140, 542], [110, 602], [98, 660], [70, 722], [54, 800], [70, 868], [46, 940], [40, 1000], [0, 1000]]
  water:
    - [[766, 170], [796, 136], [840, 128], [872, 150], [876, 196], [846, 226], [800, 236], [770, 214]]
  hills:
    - [[520, 26], [600, 14], [690, 18], [712, 70], [722, 120], [668, 146], [600, 140], [548, 112]]
    - [[800, 58], [870, 40], [948, 52], [984, 120], [962, 186], [884, 204], [820, 160]]
    - [[790, 280], [860, 248], [944, 262], [982, 350], [968, 430], [900, 462], [828, 440], [796, 380]]
    - [[870, 630], [940, 604], [992, 640], [996, 750], [934, 786], [882, 744]]
