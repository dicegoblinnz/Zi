# The made-up pack's era (tests only, never shipped).
fits: [town, city]

seats:
  - { text: The Long Ford, role: passage, tags: [river, road], notice: Toll chains rattle across the water all night. }
  - { text: Saltgate Market, role: trade, tags: [market], notice: Everyone shouts prices and nobody pays them. }
  - { text: The Old Mill, role: craft, tags: [river], notice: "The wheel never stops, even on feast days." }
  - { text: "Saint Orla's", role: belief, tags: [holy], notice: "Bells, and a queue of the sick." }
  - { text: The Rookery, role: crime, tags: [poor], notice: "Every window's watching you." }
  - { text: The Moot Hall, role: office, tags: [law], sizes: [city, great], notice: Clerks with ink up to their elbows. }
  - { text: The Archive Tower, role: knowledge, tags: [old], notice: Candles burning in every window till dawn. }
  - { text: The Hiring Yard, role: labour, tags: [poor], notice: "Men waiting by the wall for a day's work." }
  - { text: The Barrow Fields, role: land, tags: [old], notice: "Sheep grazing on the old kings' graves." }
  - { text: The Iron Pits, role: ground, tags: [mine], notice: "Smoke, and men who don't look up." }
  - { text: The Bridge Inn, role: passage, tags: [road], regions: [town], notice: "Everyone stops here, and the landlord knows them all." }
  - { text: The Tanyards, role: craft, tags: [poor], regions: [town], notice: The smell gets into your clothes for days. }
  - { text: The Common, role: land, regions: [town], notice: "Geese, washing lines and a gallows." }
  - { text: The Chapel Steps, role: belief, tags: [holy, poor], regions: [town], notice: Beggars who know the priest by name. }
  - { text: The Weeping Stone, role: wonder, tags: [old], regions: [town], rare: true, strange: true, notice: "It's wet even in a drought." }
  - { text: The Harbour Wall, role: passage, tags: [coast], regions: [city], notice: "Ships three deep, waiting for a berth." }
  - { text: The Exchange, role: trade, tags: [wealth, market], regions: [city], notice: Gold changing hands without a word said. }
  - { text: The Citadel, role: office, tags: [war, law], regions: [city], sizes: [great], notice: Banners on every tower and guards at every gate. }
  - { text: The Undercroft, role: crime, tags: [secret], regions: [city], notice: Tunnels nobody admits are there. }
  - { text: The Glass Garden, role: wonder, tags: [old], regions: [city], rare: true, strange: true, notice: "Flowers that don't grow anywhere else." }

